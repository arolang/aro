# =============================================================================
# ARO Programming Language - Cards Pipeline
# =============================================================================
# Builds and pushes the ARO Cards Docker image to GitHub Container Registry
# - On main: tags with short commit hash (e.g., d04f2e8)
# - On tag: tags with version number (e.g., 2.3.1)
# =============================================================================

name: Cards

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'cards/**'
      - '.github/workflows/cards.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'cards/**'
      - '.github/workflows/cards.yml'
  workflow_dispatch:
  schedule:
    # 09:00 Europe/London, every day.
    #
    # GitHub's cron is UTC only and has no timezone, while London is UTC+0 in
    # winter and UTC+1 in summer — so one fixed expression is an hour wrong for
    # half the year. Both candidate hours fire, and the job's first step stops
    # whichever one is not 09:00 in London. Exactly one posts, year round.
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'

concurrency:
  group: cards-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/aro-cards

jobs:
  # ===========================================================================
  # Build and Push Docker Image
  # ===========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # On main branch: use short SHA
            type=sha,prefix=,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            # On version tags: use semver (strips 'v' prefix)
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # Latest tag for main branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: ./cards
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image info
        if: github.event_name != 'pull_request'
        run: |
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.meta.outputs.tags }}' | tr ',' '\n' | while read tag; do
            echo "- \`$tag\`" >> $GITHUB_STEP_SUMMARY
          done

  # ===========================================================================
  # Post Card to Mastodon (09:00 Europe/London, daily)
  # ===========================================================================
  post:
    name: Post Card to Mastodon
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Only run on schedule or manual trigger, not on code changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      # Two crons fire so that one of them is 09:00 in London whatever the
      # season; this is where the other one stops. A manual run is never
      # stopped — someone who pressed the button means it.
      - name: Post only at 09:00 Europe/London
        id: window
        run: |
          HOUR=$(TZ=Europe/London date +%H)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "manual run — posting regardless of the hour"
            echo "post=true" >> "$GITHUB_OUTPUT"
          elif [ "$HOUR" = "09" ]; then
            echo "09:00 in London — this is the run that posts"
            echo "post=true" >> "$GITHUB_OUTPUT"
          else
            echo "London local time is ${HOUR}:00, not 09 — the other cron is today's run"
            echo "post=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.window.outputs.post == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.window.outputs.post == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.window.outputs.post == 'true'
        run: |
          cd cards
          npm install

      - name: Generate cards
        if: steps.window.outputs.post == 'true'
        run: |
          cd cards
          node generate.js

      - name: Post card to Mastodon
        if: steps.window.outputs.post == 'true'
        env:
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          START_DATE: '2026-01-01'
        run: |
          cd cards
          node post-to-mastodon.js

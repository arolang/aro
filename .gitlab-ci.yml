# =============================================================================
# Release Stage - Create GitLab Release (tags only)
# =============================================================================
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build:linux
      artifacts: true
    - job: build:solaro:linux
      artifacts: true
      optional: true
    - job: integration:linux
    - job: documentation
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache tar gzip python3 py3-pip
  script:
    # Extract version from tag
    - VERSION="${CI_COMMIT_TAG#v}"
    - echo "Version - $VERSION"

    # Jupyter kernel wheel + sdist.
    #
    # Installing the kernel meant cloning the repository, which is a lot
    # to ask of someone who wants a notebook. The wheel is one file and
    # `pip install` takes a URL, so the release page is enough.
    #
    # The version is pinned to the tag here rather than tracked by hand
    # in pyproject.toml: two version numbers for one artifact drift, and
    # the one that matters to `pip` is the one on the release.
    - |
      python3 -m pip install --quiet --break-system-packages build || python3 -m pip install --quiet build
      sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Editor/jupyter-aro/pyproject.toml
      python3 -m build --outdir dist-kernel Editor/jupyter-aro
      ls -la dist-kernel/
      cp dist-kernel/aro_kernel-"$VERSION"-py3-none-any.whl aro_kernel-py3-none-any.whl
      cp dist-kernel/aro_kernel-"$VERSION".tar.gz aro_kernel-sdist.tar.gz

    # Package Linux binary
    - cd aro-dist
    - chmod +x aro
    - tar -czvf ../aro-linux-amd64.tar.gz aro libARORuntime.a
    - cd ..

    # Show package contents
    - ls -la aro-linux-amd64.tar.gz
    - ls -la Book/TheLanguageGuide/output/ARO-Language-Guide.pdf || echo "Language Guide PDF not found"
    - ls -la Book/TheConstructionStudies/output/ARO-Construction-Studies.pdf || echo "Construction Studies PDF not found"
    - ls -la Book/AROByExample/output/ARO-By-Example.pdf || echo "ARO By Example PDF not found"
    - ls -la Book/TheEssentialPrimer/output/ARO-Essential-Primer.pdf || echo "Essential Primer PDF not found"
    - ls -la Book/AROByHallucination/output/ARO-by-Hallucination.pdf || echo "ARO by Hallucination PDF not found"
    - ls -la Book/AROForDataEngineers/output/ARO-For-Data-Engineers.pdf || echo "Data Engineers PDF not found"

    # Determine if prerelease
    - |
      if echo "$CI_COMMIT_TAG" | grep -q '-'; then
        echo "PRERELEASE=true" >> release.env
      else
        echo "PRERELEASE=false" >> release.env
      fi
  artifacts:
    paths:
      - aro-linux-amd64.tar.gz
      - solaro-linux-amd64.tar.gz
      - aro_kernel-py3-none-any.whl
      - aro_kernel-sdist.tar.gz
      - Book/TheLanguageGuide/output/ARO-Language-Guide.pdf
      - Book/TheConstructionStudies/output/ARO-Construction-Studies.pdf
      - Book/AROByExample/output/ARO-By-Example.pdf
      - Book/TheEssentialPrimer/output/ARO-Essential-Primer.pdf
      - Book/AROByHallucination/output/ARO-by-Hallucination.pdf
      - Book/AROForDataEngineers/output/ARO-For-Data-Engineers.pdf
    expire_in: 1 year
  release:
    tag_name: $CI_COMMIT_TAG
    name: 'ARO ${CI_COMMIT_TAG#v}'
    description: |
      ## ARO Programming Language ${CI_COMMIT_TAG#v}

      ### Downloads

      | Platform | Architecture | Download |
      |----------|--------------|----------|
      | Linux | x86_64 | [aro-linux-amd64.tar.gz]($CI_PROJECT_URL/-/releases/$CI_COMMIT_TAG/downloads/aro-linux-amd64.tar.gz) |
      | SOLARO Linux | x86_64 | [solaro-linux-amd64.tar.gz]($CI_PROJECT_URL/-/releases/$CI_COMMIT_TAG/downloads/solaro-linux-amd64.tar.gz) |
      | SOLARO macOS | Apple silicon | [solaro-macos-arm64.dmg]($CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/solaro/${CI_COMMIT_TAG#v}/solaro-macos-arm64.dmg) |
      | Jupyter kernel | any | [aro_kernel-py3-none-any.whl]($CI_PROJECT_URL/-/releases/$CI_COMMIT_TAG/downloads/aro_kernel-py3-none-any.whl) |

      ### Documentation

      | Document | Download |
      |----------|----------|
      | ARO Language Guide | [ARO-Language-Guide.pdf]($CI_PROJECT_URL/-/releases/$CI_COMMIT_TAG/downloads/ARO-Language-Guide.pdf) |
      | ARO Construction Studies | [ARO-Construction-Studies.pdf]($CI_PROJECT_URL/-/releases/$CI_COMMIT_TAG/downloads/ARO-Construction-Studies.pdf) |
      | ARO By Example | [ARO-By-Example.pdf]($CI_PROJECT_URL/-/releases/$CI_COMMIT_TAG/downloads/ARO-By-Example.pdf) |
      | ARO Essential Primer | [ARO-Essential-Primer.pdf]($CI_PROJECT_URL/-/releases/$CI_COMMIT_TAG/downloads/ARO-Essential-Primer.pdf) |
      | ARO by Hallucination | [ARO-by-Hallucination.pdf]($CI_PROJECT_URL/-/releases/$CI_COMMIT_TAG/downloads/ARO-by-Hallucination.pdf) |
      | ARO for Data Engineers | [ARO-For-Data-Engineers.pdf]($CI_PROJECT_URL/-/releases/$CI_COMMIT_TAG/downloads/ARO-For-Data-Engineers.pdf) |

      ### Installation

      **Linux**
      ```bash
      curl -L $CI_PROJECT_URL/-/releases/$CI_COMMIT_TAG/downloads/aro-linux-amd64.tar.gz | tar xz
      sudo mv aro /usr/local/bin/
      ```

      **Jupyter kernel**

      Notebooks in JupyterLab, VS Code or DataSpell. Needs the `aro`
      binary above on your `PATH`, and Python 3.9+.

      ```bash
      pip install $CI_PROJECT_URL/-/releases/$CI_COMMIT_TAG/downloads/aro_kernel-py3-none-any.whl
      python -m aro_kernel.install --user
      ```

      If `aro` is somewhere else, point at it before installing the
      kernelspec — the path is baked in:

      ```bash
      export ARO_KERNEL_ARO=/opt/aro/bin/aro
      python -m aro_kernel.install --user
      ```

      **macOS (SOLARO)**

      Download the DMG, open it, drag Solaro to Applications. The app
      and the disk image are both signed with a Developer ID
      certificate and notarized by Apple, so Gatekeeper opens it
      without the right-click dance.
    assets:
      links:
        # Built on the GitHub macOS runner (GitLab's runners are
        # Linux-only) and pushed into this project's generic package
        # registry by the release workflow — see #268.
        - name: 'solaro-macos-arm64.dmg'
          url: '$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/solaro/${CI_COMMIT_TAG#v}/solaro-macos-arm64.dmg'
          filepath: '/solaro-macos-arm64.dmg'
          link_type: 'package'
        - name: 'aro-linux-amd64.tar.gz'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/aro-linux-amd64.tar.gz?job=release'
          filepath: '/aro-linux-amd64.tar.gz'
          link_type: 'package'
        - name: 'solaro-linux-amd64.tar.gz'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/solaro-linux-amd64.tar.gz?job=release'
          filepath: '/solaro-linux-amd64.tar.gz'
          link_type: 'package'
        - name: 'aro_kernel-py3-none-any.whl'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/aro_kernel-py3-none-any.whl?job=release'
          filepath: '/aro_kernel-py3-none-any.whl'
          link_type: 'package'
        - name: 'aro_kernel-sdist.tar.gz'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/aro_kernel-sdist.tar.gz?job=release'
          filepath: '/aro_kernel-sdist.tar.gz'
          link_type: 'package'
        - name: 'ARO-Language-Guide.pdf'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/Book/TheLanguageGuide/output/ARO-Language-Guide.pdf?job=release'
          filepath: '/ARO-Language-Guide.pdf'
          link_type: 'other'
        - name: 'ARO-Construction-Studies.pdf'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/Book/TheConstructionStudies/output/ARO-Construction-Studies.pdf?job=release'
          filepath: '/ARO-Construction-Studies.pdf'
          link_type: 'other'
        - name: 'ARO-By-Example.pdf'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/Book/AROByExample/output/ARO-By-Example.pdf?job=release'
          filepath: '/ARO-By-Example.pdf'
          link_type: 'other'
        - name: 'ARO-Essential-Primer.pdf'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/Book/TheEssentialPrimer/output/ARO-Essential-Primer.pdf?job=release'
          filepath: '/ARO-Essential-Primer.pdf'
          link_type: 'other'
        - name: 'ARO-by-Hallucination.pdf'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/Book/AROByHallucination/output/ARO-by-Hallucination.pdf?job=release'
          filepath: '/ARO-by-Hallucination.pdf'
          link_type: 'other'

# =============================================================================
# Docker Stage - Build and Push Docker Images (using Kaniko + Crane)
# =============================================================================
docker:buildsystem:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE/aro-buildsystem
  before_script:
    # Create Docker config for registry authentication
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64 -w 0)\"}}}" > /kaniko/.docker/config.json
  script:
    # Determine tag
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG="$CI_COMMIT_TAG"
        DESTINATIONS="--destination=$IMAGE_NAME:$TAG --destination=$IMAGE_NAME:latest"
      else
        TAG="latest"
        DESTINATIONS="--destination=$IMAGE_NAME:$TAG"
      fi
    # Build and push with Kaniko (remote layer cache speeds repeat builds).
    - /kaniko/executor
      --context=docker/buildsystem/
      --dockerfile=docker/buildsystem/Dockerfile
      --build-arg=ARO_VERSION=${CI_COMMIT_REF_NAME}
      --build-arg=SKIP_TESTS=true
      --cache=true
      --cache-repo=${CI_REGISTRY_IMAGE}/cache
      --cache-ttl=168h
      $DESTINATIONS

docker:runtime:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE/aro-runtime
  before_script:
    # Create Docker config for registry authentication
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64 -w 0)\"}}}" > /kaniko/.docker/config.json
  script:
    # Determine tag
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG="$CI_COMMIT_TAG"
        DESTINATIONS="--destination=$IMAGE_NAME:$TAG --destination=$IMAGE_NAME:latest"
      else
        TAG="latest"
        DESTINATIONS="--destination=$IMAGE_NAME:$TAG"
      fi
    # Build and push with Kaniko (remote layer cache speeds repeat builds).
    - /kaniko/executor
      --context=docker/runtime/
      --dockerfile=docker/runtime/Dockerfile
      --cache=true
      --cache-repo=${CI_REGISTRY_IMAGE}/cache
      --cache-ttl=168h
      $DESTINATIONS

# =============================================================================
# Mastodon Stage - Post Daily Cards (scheduled pipelines only)
# =============================================================================
post:mastodon:
  stage: mastodon
  image: node:20-bookworm
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    # Install Puppeteer dependencies for card generation
    - apt-get update -qq
    - apt-get install -y -qq chromium
    - export PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
    - export PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
  script:
    - cd cards
    - npm install
    - node generate.js
    - node post-to-mastodon.js

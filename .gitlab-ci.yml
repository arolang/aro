# =============================================================================
# ARO Programming Language - GitLab CI/CD Pipeline (Linux Only)
# =============================================================================
# Builds, tests, and releases ARO on Linux using Swift 6.3
# =============================================================================

stages:
  - test
  - build
  - integration
  - documentation
  - release
  - mastodon

variables:
  SWIFT_VERSION: '6.3.2'

# Only run pipelines for main, release branches, tags, merge requests, and schedules
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*"

# Default settings for all jobs
default:
  interruptible: true
  tags:
    - adt

# Resolve SwiftPM dependencies, retrying the fetch.
#
# Package resolution clones ~15 repositories from github.com. This runner's
# egress to GitHub is intermittently refused — git gets a reply it cannot
# read as a ref listing and reports it as missing credentials:
#
#   fatal: could not read Username for 'https://github.com': terminal
#   prompts disabled
#
# It is not a missing credential and not an upstream problem: every one of
# those repositories is public and clones anonymously from elsewhere. It is
# also not one bad dependency — three consecutive failures picked three
# different packages (`swifty-llvm` twice, `swift-nio-ssl` once), which is
# what an intermittent refusal across a long fetch looks like rather than a
# broken URL.
#
# It looks like rate limiting, and the timings say so. In pipeline 21888
# `test` cold-fetched the whole graph successfully at 10:14; `build:linux`
# was refused on the very first repository at 10:23, on all four attempts,
# from the same runner. Roughly thirty anonymous clones in ten minutes is
# what sits between those two facts.
#
# Which makes the cache the real story. Every job misses it, every run:
#
#   Checking cache for swift-build-<hash>-non_protected...
#   No URL provided, cache will not be downloaded from shared cache server.
#   WARNING: Cache file does not exist
#
# There is no shared cache server, so a "local" cache on an ephemeral pod is
# never there, and `test` and `build:linux` use different key prefixes over
# the same paths — so each pipeline clones the graph at least twice from
# scratch. A warm `.build/` would need no network at all.
#
# THE DURABLE FIX IS A SHARED CACHE SERVER (S3/MinIO on the runner), not
# this retry. This only buys enough time for a rate-limit window to pass:
# ~5 minutes across four attempts, since the first version's 15s/30s backoff
# was far too short and burned its attempts inside the same window.
#
# Only the fetch is retried. Nothing here re-runs a build or a test, so a
# genuine failure is still reported from a single honest attempt — the same
# line integration:linux draws when it retries infrastructure classes and
# refuses to retry script failures.
.resolve-with-retry: &resolve-with-retry |
  resolved=""
  delays="30 90 180"
  attempt=1
  for delay in $delays x; do
    if swift package resolve; then resolved=1; break; fi
    [ "$delay" = x ] && break
    echo "swift package resolve failed (attempt $attempt) — retrying in ${delay}s"
    sleep "$delay"
    attempt=$((attempt + 1))
  done
  if [ -z "$resolved" ]; then
    echo "ERROR: could not resolve dependencies after 4 attempts over ~5 minutes."
    echo "       This is the runner being refused by github.com, not a code failure."
    echo "       See the .resolve-with-retry comment: the durable fix is a shared"
    echo "       cache server, so these jobs stop re-cloning the graph every run."
    exit 1
  fi

# =============================================================================
# Proposal identifier hygiene (GitLab #481)
# =============================================================================
# Proposals/ is the project's top-priority source of truth, so a duplicated or
# dangling ARO-NNNN identifier is a real defect. Cheap and dependency-free, so it
# runs before the Swift build rather than after it.
proposals:
  stage: test
  image: python:3.12-slim
  script:
    - python3 Scripts/check-proposals.py

# =============================================================================
# Action reference is generated, not hand-maintained (GitLab #480)
# =============================================================================
# ARO-0004 §11 is the authoritative action spec. It had drifted to 48 of 70
# actions with several wrong rows; it is now derived from the runtime and this
# job fails if the committed table no longer matches.
action-reference:
  stage: test
  image: python:3.12-slim
  script:
    - python3 Scripts/generate-action-reference.py --check

# =============================================================================
# Test Stage - Gate for all builds (main branch only)
# =============================================================================
test:
  stage: test
  image: swift:6.3-jammy
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  cache:
    key:
      files:
        - Package.resolved
      prefix: swift-test
    paths:
      - .build/
      - .swiftpm/
    policy: pull-push
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq wget gnupg software-properties-common libgit2-dev
    # Add LLVM APT repository for LLVM 20 (required for Swifty-LLVM)
    - wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
    - echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-20 main" > /etc/apt/sources.list.d/llvm.list
    - apt-get update -qq
    - apt-get install -y -qq llvm-20-dev libzstd-dev
    # Same HTTP/1.1 pin as build:linux — this job resolves the same package
    # graph from github.com and failed the same way while only build:linux
    # carried the setting, which gates every job behind it.
    - git config --global http.version HTTP/1.1
    # Create pkg-config file for LLVM
    - |
      cat > /usr/lib/pkgconfig/llvm.pc << 'PKGCONFIG'
      prefix=/usr/lib/llvm-20
      exec_prefix=${prefix}
      libdir=${prefix}/lib
      includedir=${prefix}/include

      Name: LLVM
      Description: Low-level Virtual Machine compiler framework
      Version: 20.1
      Libs: -L${libdir} -lLLVM-20
      Cflags: -I${includedir}
      PKGCONFIG
  # Socket / WebSocket / BroadcastAction tests are skipped: they use blocking
  # poll() syscalls and NIO event loops the constrained K8s pod can't service.
  # Same suite passes locally and on GitHub.
  script:
    - *resolve-with-retry
    - swift test --parallel --num-workers 2 --skip "Socket"

# Socket / WebSocket / Broadcast tests are NOT run on GitLab.
#
# The Kubernetes runner pod (~1–2 vCPUs) gives the Swift cooperative
# thread pool only 1–2 threads. AROSocketClient.connect calls blocking
# poll() syscalls from inside async functions, and AROWebSocketServer
# wants its own NIO event-loop threads. With many concurrent test
# tasks all suspending on those blocking calls, the pool starves —
# every test gets to "started" and nothing ever completes (jobs 80535,
# 80454 timed out at 45m with zero completions).
#
# The full socket surface is exercised on GitHub (Linux + macOS) where
# the runner has enough cores, and locally. Re-enable this job once
# the runner is sized larger OR the blocking poll() paths are moved
# to a dedicated executor.
#
# The `runtime-sz-no-sockets` shard above already excludes Socket from
# the runtime test sweep, so this comment is the only marker left.

# =============================================================================
# Build Stage - Linux Release Build
# =============================================================================
build:linux:
  stage: build
  image: swift:6.3-jammy
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  needs:
    - job: test
      optional: true
  cache:
    key:
      files:
        - Package.resolved
      prefix: swift-build
    paths:
      - .build/
      - .swiftpm/
    policy: pull-push
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq git wget gnupg software-properties-common libgit2-dev
    # Add LLVM APT repository for LLVM 20 (required for Swifty-LLVM)
    - wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
    - echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-20 main" > /etc/apt/sources.list.d/llvm.list
    - apt-get update -qq
    - apt-get install -y -qq llvm-20-dev libzstd-dev
    - git config --global http.version HTTP/1.1
    # Create pkg-config file for LLVM
    - |
      cat > /usr/lib/pkgconfig/llvm.pc << 'PKGCONFIG'
      prefix=/usr/lib/llvm-20
      exec_prefix=${prefix}
      libdir=${prefix}/lib
      includedir=${prefix}/include

      Name: LLVM
      Description: Low-level Virtual Machine compiler framework
      Version: 20.1
      Libs: -L${libdir} -lLLVM-20
      Cflags: -I${includedir}
      PKGCONFIG
  script:
    # Generate version file
    - |
      # On a tag pipeline the version IS the tag; avoid `git describe
      # --dirty`, whose "-dirty" suffix (from an earlier step touching a
      # tracked file) would leak into a clean release.
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
      fi
      COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
      BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

      cat > Sources/AROVersion/Version.swift << 'EOF'
      // ============================================================
      // Version.swift
      // ARO Version Information
      // ============================================================
      // This file is auto-generated during build

      import Foundation

      public enum AROVersion {
          /// Version from git tag (embedded at build time)
          public static let version: String = "VERSION_PLACEHOLDER"

          /// Short commit hash (embedded at build time)
          public static let commit: String = "COMMIT_PLACEHOLDER"

          /// Build date in ISO 8601 format (embedded at build time)
          public static let buildDate: String = "BUILD_DATE_PLACEHOLDER"

          /// Whether this is a release build
          public static let isRelease: Bool = {
              !version.contains("-dirty") && !version.hasPrefix("unknown") && !version.hasPrefix("dev")
          }()

          /// Full version string with commit and build date
          public static var fullVersion: String {
              "\(version) (\(commit)) built on \(buildDate)"
          }

          /// Short version string (just the version)
          public static var shortVersion: String {
              version
          }
      }
      EOF

      # Replace placeholders with actual values
      sed -i "s|VERSION_PLACEHOLDER|$VERSION|g" Sources/AROVersion/Version.swift
      sed -i "s|COMMIT_PLACEHOLDER|$COMMIT|g" Sources/AROVersion/Version.swift
      sed -i "s|BUILD_DATE_PLACEHOLDER|$BUILD_DATE|g" Sources/AROVersion/Version.swift

      echo "Generated version file with:"
      echo "  Version: $VERSION"
      echo "  Commit: $COMMIT"
      echo "  Build Date: $BUILD_DATE"

    # Release build with static Swift stdlib
    - *resolve-with-retry
    - swift build -c release --static-swift-stdlib
    - swift build -c release --product ARORuntime

    # Verify CLI works
    - .build/release/aro --help
    - .build/release/aro check ./Examples/HelloWorldAPI
    - .build/release/aro check ./Examples/UserService

    # Prepare artifact directory
    - mkdir -p aro-dist
    - cp .build/release/aro aro-dist/
    - cp .build/x86_64-unknown-linux-gnu/release/libARORuntime.a aro-dist/

    # Show artifact contents
    - ls -la aro-dist/
  artifacts:
    name: aro-linux-amd64
    paths:
      - aro-dist/
    expire_in: 30 days

# SOLARO Linux job was removed (ADR-001 follow-up 2026-06): SOLARO is
# now a native SwiftUI/AppKit macOS app — see .github/workflows/build.yml
# for the macOS pipeline.

# =============================================================================
# Integration Tests Stage
# =============================================================================
integration:linux:
  stage: integration
  image: ubuntu:22.04
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  # Swift-plugin examples (CustomPlugin, GreetingPlugin, QualifierPlugin,
  # ExternalService) compile their plugins via `swift build` on first run.
  # The constrained Kubernetes pod can't service that combined CPU+RAM
  # load — pipeline 17785 retry 80454 was killed with OOM (exit 137).
  # SPM plugin builds are therefore pre-warmed sequentially below, before
  # run-tests.pl, so the tests only load pre-built libraries.
  #
  # `allow_failure: true` accompanied that pre-warm as a temporary measure,
  # "until a few pipelines confirm the pod copes". They have: the last ten runs
  # on main are eight successes and two cancellations (superseded pipelines),
  # with no OOM.
  #
  # It is removed because the cost showed up. A real regression — an example
  # broken in interpreter mode — sat red across four consecutive pipelines that
  # all reported success, and was only noticed by reading job status directly.
  # A suite that cannot fail the build is not a gate.
  #
  # Infrastructure classes are retried rather than tolerated. Script failures
  # are deliberately not retried: re-running a genuine failure costs an hour and
  # tells you nothing. If a non-infra flake does appear here, fix it or quarantine
  # the example — do not reinstate blanket tolerance.
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - scheduler_failure
  # Pre-warming the plugin builds adds serial compile time on top of the
  # ~60 min the suite already needs on this pod.
  timeout: 2h
  needs:
    - job: build:linux
      artifacts: true
  cache:
    key: swift-integration
    paths:
      - /usr/share/swift/
    policy: pull
  before_script:
    # Install dependencies
    - apt-get update -qq
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get install -y -qq git ca-certificates wget curl perl llvm-14 clang-14 cpanminus libipc-run-perl libyaml-libyaml-perl libhttp-tiny-perl zlib1g-dev libsqlite3-dev libxml2-dev libgit2-dev gnupg software-properties-common python3 python3-dev python3-venv build-essential

    # Same HTTP/1.1 pin as test and build:linux. This job clones from
    # github.com too — not through SwiftPM but through pip, which shells out
    # to git for the `git+https://` SDK below and failed identically:
    # "could not read Username for 'https://github.com'". Set after git is
    # installed, before anything uses it.
    - git config --global http.version HTTP/1.1

    # Python plugin SDK (GitLab #486 fallout, job 122170).
    #
    # Examples/QualifierPluginPython declares `stats.*` qualifiers from a
    # python-plugin. The container had python3 but never the SDK the plugin
    # imports, so the plugin registered nothing and every `stats.*` qualifier
    # went unresolved. That used to be invisible: an unresolved qualifier
    # returned its input unchanged, so the example printed empty values and
    # still matched its occurrence-check expectations. #486 closed the
    # qualifier namespace, the unresolved name became a hard error, and the
    # example started failing — surfacing a plugin that had never actually
    # run here.
    #
    # Installed rather than tolerated, per this job's own policy note below:
    # fix it or quarantine it, never reinstate blanket tolerance. If the
    # runner cannot reach the SDK the install fails loudly here, which is the
    # honest signal — a green example that exercised no plugin was worth less
    # than a red one that says why.
    - apt-get install -y -qq python3-pip
    - pip3 install --quiet "git+https://github.com/arolang/aro-plugin-sdk-python.git@main"
    - python3 -c "import aro_plugin_sdk; print('aro-plugin-sdk ready')"

    # Add LLVM APT repository for LLVM 20 (required for aro binary which links against libLLVM-20)
    - wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
    - echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-20 main" > /etc/apt/sources.list.d/llvm.list
    - apt-get update -qq
    - apt-get install -y -qq libllvm20 llvm-20 clang-20

    # Setup LLVM 20 for both aro binary and llc/clang (V2 code generator produces LLVM 20 IR)
    - ln -sf /usr/bin/llc-20 /usr/bin/llc
    - ln -sf /usr/bin/clang-20 /usr/bin/clang
    - ln -sf /usr/bin/llvm-objcopy-20 /usr/bin/llvm-objcopy
    - export PATH="/usr/lib/llvm-20/bin:$PATH"
    - export LD_LIBRARY_PATH="/usr/lib/llvm-20/lib:$LD_LIBRARY_PATH"

    # Install Rust for plugin compilation
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustc --version

    # Install Swift for native compilation tests
    - wget -q https://download.swift.org/swift-6.3.2-release/ubuntu2204/swift-6.3.2-RELEASE/swift-6.3.2-RELEASE-ubuntu22.04.tar.gz
    - tar xzf swift-6.3.2-RELEASE-ubuntu22.04.tar.gz
    - mv swift-6.3.2-RELEASE-ubuntu22.04 /usr/share/swift
    - export PATH="/usr/share/swift/usr/bin:$PATH"

    # Install Perl modules
    - cpan -T Net::EmptyPort Term::ANSIColor 2>&1 || true

    # Prepare ARO binary
    - chmod +x ./aro-dist/aro
    - export ARO_BIN="$CI_PROJECT_DIR/aro-dist/aro"

    # Copy runtime library to system location
    - mkdir -p /usr/local/lib
    - cp ./aro-dist/libARORuntime.a /usr/local/lib/libARORuntime.a

    # Verify installation
    - ./aro-dist/aro --version
  script:
    - export PATH="$HOME/.cargo/bin:/usr/share/swift/usr/bin:/usr/lib/llvm-20/bin:$PATH"
    - export LD_LIBRARY_PATH="/usr/lib/llvm-20/lib:$LD_LIBRARY_PATH"
    - export ARO_BIN="$CI_PROJECT_DIR/aro-dist/aro"

    # Debug: test aro build directly to see errors
    - echo "=== Testing aro build directly ==="
    - which clang && clang --version 2>&1 | head -1 || true
    - which llc && llc --version 2>&1 | head -1 || true
    - ls /usr/share/swift/usr/lib/swift/linux/ | head -5 || true
    - echo "=== About to run aro build ==="
    - ls -la ./aro-dist/aro || echo "aro binary not found"
    - file ./aro-dist/aro || echo "file command failed"
    - timeout 60 ./aro-dist/aro build ./Examples/HelloWorld --verbose 2>&1 || echo "Build failed with exit code $?"
    - echo "=== aro build completed ==="

    # Start local Open-Meteo stubs (offline HTTPClient / WeatherClient tests).
    # Running them here, outside the test harness, avoids IPC::Run keeping
    # pipes tied to backgrounded processes when a per-test pre-script exits.
    - STUB_TIMEOUT=1800 nohup python3 Examples/HTTPClient/stub.py 18765 >/tmp/httpclient-stub.log 2>&1 </dev/null &
    - STUB_TIMEOUT=1800 nohup python3 Examples/WeatherClient/stub.py 18766 >/tmp/weatherclient-stub.log 2>&1 </dev/null &
    - STUB_TIMEOUT=1800 nohup python3 Examples/URLClient/stub.py 18767 >/tmp/urlclient-stub.log 2>&1 </dev/null &
    - for i in $(seq 1 50); do python3 -c 'import socket; s=socket.socket(); s.settimeout(0.2); exit(0 if s.connect_ex(("127.0.0.1",18765))==0 else 1)' && python3 -c 'import socket; s=socket.socket(); s.settimeout(0.2); exit(0 if s.connect_ex(("127.0.0.1",18766))==0 else 1)' && break; sleep 0.2; done
    - python3 -c 'import urllib.request; print(urllib.request.urlopen("http://127.0.0.1:18765/v1/forecast").read()[:120])'
    - python3 -c 'import urllib.request; print(urllib.request.urlopen("http://127.0.0.1:18766/v1/forecast").read()[:120])'

    # Pre-warm SPM plugin builds sequentially. First-run plugin compiles
    # inside the tests OOM / blow the 300s per-test timeout on this pod
    # (CustomPlugin, SQLiteExample), and `aro build` needs the .build
    # trees to harvest static-link objects (ExternalService, ZipService).
    # Building into the default .build scratch path satisfies every
    # consumer: NativePluginHost (interpreter), compilePackagePlugin
    # (managed compile), and BuildCommand's static-link object hunt.
    # A pre-warm failure fails the job here, where the real compiler
    # error is visible, instead of as a confusing downstream test error.
    # The Swift toolchain must come first in PATH here: with llvm-20 first,
    # SPM can pick up clang-20 as the link driver, which rejects Swift
    # metadata relocations when linking the plugin .so (PREL32/PC32
    # "recompile with -fPIC" errors).
    - |
      for pkg in Examples/*/plugins/*/Package.swift Examples/*/Plugins/*/Package.swift; do
        [ -f "$pkg" ] || continue
        dir="$(dirname "$pkg")"
        echo "=== Pre-warming plugin build: $dir"
        (cd "$dir" && PATH="/usr/share/swift/usr/bin:$PATH" swift build -c release) || { echo "ERROR: pre-warm build failed for $dir"; exit 1; }
      done

    - chmod +x Tests/IntegrationTestsRunner/run-tests.pl
    # K8s runner pod is small (~1–2 vCPUs); -j 2 gets a real speedup
    # without thrashing the cooperative pool.
    - perl Tests/IntegrationTestsRunner/run-tests.pl --verbose -j 2
  artifacts:
    when: on_failure
    name: test-failures-linux
    paths:
      - Examples/**/expected.*
      - Examples/**/testrun.*
      - Examples/**/.build/*.ll
    expire_in: 7 days

integration:repl:
  stage: integration
  image: ubuntu:22.04
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  needs:
    - job: build:linux
      artifacts: true
  before_script:
    - apt-get update -qq
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get install -y -qq wget gnupg software-properties-common perl libgit2-dev libcurl4
    # Add LLVM APT repository for LLVM 20 (required for aro binary which links against libLLVM-20)
    - wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
    - echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-20 main" > /etc/apt/sources.list.d/llvm.list
    - apt-get update -qq
    - apt-get install -y -qq libllvm20
    # Prepare ARO binary
    - chmod +x ./aro-dist/aro
    - export ARO_BIN="$CI_PROJECT_DIR/aro-dist/aro"
    # Verify installation
    - ./aro-dist/aro --version
  script:
    - export LD_LIBRARY_PATH="/usr/lib/llvm-20/lib:$LD_LIBRARY_PATH"
    - export ARO_BIN="$CI_PROJECT_DIR/aro-dist/aro"
    - chmod +x test_repl.pl
    - perl test_repl.pl
    # Issue #200: stdin-pipe smoke tests
    - chmod +x test_stdin.sh
    - ./test_stdin.sh

# Executes the shipped notebook against the real kernel (ARO-0091). Catches
# both halves at once: a protocol change that breaks the Python shim, and an
# example notebook whose ARO has rotted.
#
# Runs on ubuntu:22.04, the same image as build:linux, and not on a Python
# image: the `aro` artifact links libgit2.so.1.1, which is what jammy ships.
# python:3.12-slim is Debian trixie now and ships libgit2.so.1.9, so the
# binary would not even start (job 123729: "error while loading shared
# libraries: libgit2.so.1.1"). Python comes from apt instead — the kernel
# shim is a thin subprocess wrapper and needs no particular interpreter
# version (pyproject asks for >=3.9; jammy has 3.10).
integration:jupyter:
  stage: integration
  image: ubuntu:22.04
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  needs:
    - job: build:linux
      artifacts: true
  before_script:
    - apt-get update -qq
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get install -y -qq wget gnupg ca-certificates libgit2-dev libcurl4 python3 python3-pip
    - wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
    - echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-20 main" > /etc/apt/sources.list.d/llvm.list
    - apt-get update -qq
    - apt-get install -y -qq libllvm20
    - chmod +x ./aro-dist/aro
    - export LD_LIBRARY_PATH="/usr/lib/llvm-20/lib:$LD_LIBRARY_PATH"
    - ./aro-dist/aro --version
  script:
    - export LD_LIBRARY_PATH="/usr/lib/llvm-20/lib:$LD_LIBRARY_PATH"
    - export ARO_KERNEL_ARO="$CI_PROJECT_DIR/aro-dist/aro"
    # Ubuntu 22.04 ships pip 22.0.2, which does not chdir into a local
    # source tree before invoking the PEP 517 backend. setuptools then
    # reads pyproject.toml relative to the *current* directory, finds
    # none, and cheerfully builds a package called UNKNOWN 0.0.0 —
    # exit 0, nothing importable, and the failure surfaces one line
    # later as "No module named 'aro_kernel'". Upgrading pip first is
    # the fix; `cd`-ing into the package would also work and would
    # hide why.
    - python3 -m pip install --quiet --upgrade pip
    - pip3 install --quiet ./Editor/jupyter-aro nbconvert
    - python3 -m aro_kernel.install --sys-prefix
    - jupyter kernelspec list
    # Exercise the protocol before the notebooks do, and triage it.
    #
    # `aro repl --json` segfaults here on the first request (exit 139)
    # while the interactive REPL is fine on the same binary, so the
    # difference is the JSON server and its fd capture. These three cases
    # separate startup from execution from output, and print both streams
    # whatever happens — the first version of this step died on the
    # segfault before it could show anything, which is a diagnostic that
    # diagnoses nothing.
    #
    # SWIFT_BACKTRACE asks the Swift runtime for a symbolicated stack on
    # crash; it costs nothing when there is no crash.
    - |
      export SWIFT_BACKTRACE=enable=yes,interactive=no,color=no
      set +e
      run_case() {
        name="$1"; shift
        printf '%s\n' "$@" | ./aro-dist/aro repl --json > "/tmp/$name.out" 2> "/tmp/$name.err"
        code=$?
        echo "=== $name: exit=$code ==="
        if [ $code -gt 128 ]; then echo "    killed by signal $((code-128))"; fi
        echo "    --- stdout ---"; sed 's/^/      /' "/tmp/$name.out"
        echo "    --- stderr ---"; sed 's/^/      /' "/tmp/$name.err"
        eval "rc_$name=$code"
      }
      run_case startup '{"id":1,"type":"shutdown"}'
      run_case compute '{"id":1,"type":"execute","code":"Compute the <n> from 2 + 40."}' '{"id":2,"type":"shutdown"}'
      run_case logonly '{"id":1,"type":"execute","code":"Log \"smoke\" to the <console>."}' '{"id":2,"type":"shutdown"}'
      set -e
      echo "=== summary: startup=$rc_startup compute=$rc_compute logonly=$rc_logonly ==="
      test "$rc_startup" -eq 0
      test "$rc_compute" -eq 0
      test "$rc_logonly" -eq 0
      grep -q '"status":"ok"' /tmp/logonly.out
    - jupyter nbconvert --to notebook --execute --stdout Editor/jupyter-aro/examples/ARO-Tour.ipynb > /dev/null
    # The data-engineering notebook reads the CSVs sitting beside it, so it
    # also proves the book's pipeline still runs. Same no---allow-errors rule.
    - cd Editor/jupyter-aro/examples && jupyter nbconvert --to notebook --execute --stdout Medallion-Pipeline.ipynb > /dev/null

# =============================================================================
# JSON REPL protocol smoke + crash triage (GitLab #490)
# =============================================================================
# `aro repl --json` segfaults on Linux the moment it executes a statement,
# while the interactive REPL runs the same statements fine in
# `integration:repl`. This job separates the protocol from the notebooks so
# the two failures stop looking alike, and it runs on the Swift image
# rather than bare Ubuntu because the toolchain is there.
#
# The stack comes from gdb, not from SWIFT_BACKTRACE: the release binary
# is linked with --static-swift-stdlib, so the runtime cannot find its own
# toolchain and reports "unable to locate swift-backtrace" on the Swift
# image just as it does on Ubuntu. gdb does not care where the toolchain
# went.
#
# allow_failure while the crash is open — it reports, it does not gate.
# `integration:jupyter` is the one that blocks, and it should: the kernel
# genuinely does not work on Linux yet.
repl:smoke:
  stage: integration
  image: swift:6.3-jammy
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  needs:
    - job: build:linux
      artifacts: true
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq wget gnupg ca-certificates libgit2-dev >/dev/null
    - wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
    - echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-20 main" > /etc/apt/sources.list.d/llvm.list
    - apt-get update -qq && apt-get install -y -qq libllvm20 gdb >/dev/null
    - chmod +x ./aro-dist/aro
  script:
    - export LD_LIBRARY_PATH="/usr/lib/llvm-20/lib:$LD_LIBRARY_PATH"
    - ./aro-dist/aro --version
    - |
      set +e
      run_case() {
        name="$1"; shift
        printf '%s\n' "$@" | ./aro-dist/aro repl --json > "/tmp/$name.out" 2> "/tmp/$name.err"
        code=$?
        echo "=== $name: exit=$code ==="
        if [ $code -gt 128 ]; then echo "    killed by signal $((code-128))"; fi
        echo "    --- stdout ---"; sed 's/^/      /' "/tmp/$name.out"
        echo "    --- stderr (backtrace lands here) ---"; sed 's/^/      /' "/tmp/$name.err"
        eval "rc_$name=$code"
      }
      run_case startup '{"id":1,"type":"shutdown"}'
      run_case compute '{"id":1,"type":"execute","code":"Compute the <n> from 2 + 40."}' '{"id":2,"type":"shutdown"}'
      if [ "$rc_compute" -ne 0 ]; then
        echo "=== backtrace (gdb) ==="
        printf '%s\n' \
          '{"id":1,"type":"execute","code":"Compute the <n> from 2 + 40."}' \
          '{"id":2,"type":"shutdown"}' > /tmp/bt.in
        gdb -q -batch \
            -ex 'set confirm off' \
            -ex 'run repl --json < /tmp/bt.in > /tmp/bt.out 2> /tmp/bt.err' \
            -ex 'thread apply all bt 25' \
            --args ./aro-dist/aro 2>&1 | sed 's/^/    /'
      fi
      set -e
      echo "=== summary: startup=$rc_startup compute=$rc_compute ==="
      test "$rc_startup" -eq 0
      test "$rc_compute" -eq 0


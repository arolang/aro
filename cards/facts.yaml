# One card a day, every day of the year.
#
# Assembled from cards/facts.d/*.yaml — edit those and re-run the assembly,
# or the next one overwrites you. Every ARO snippet is checked by
# cards/validate-facts.py against a build from this checkout; the installed
# release lags the tree and reports correct cards as broken.
#
# Filed as week 1..53 / day 1..7. post-to-mastodon.js selects by day of the
# year, so 1 January is the first card and 31 December the last; a leap year
# repeats the first rather than posting nothing.
facts:
- id: 01-1
  week: 1
  day: 1
  category: Actions
  headline: aro actions Store
  explanation: 'Store, Log, Send and Write read as exports and declare the RESPONSE role. That is a known,
    deliberate inconsistency rather than a typo waiting to be fixed: roles drive data-flow analysis, so
    changing one changes what programs do.'
- id: 01-2
  week: 1
  day: 2
  category: Plugins
  headline: aro new plugin my-greeting --lang swift
  explanation: Scaffolds a plugin under Plugins/<name>/ with its manifest and a working action. --lang
    is required — swift, rust, c, cpp, python or aro — and there is no interactive prompt, so a bare aro
    new plugin is an error rather than a questionnaire.
- id: 01-3
  week: 1
  day: 3
  category: Compiler
  headline: aro build ./MyApp
  explanation: Compiles the application to a native binary through LLVM IR and an object file, then links
    it. The output takes the directory's own name and is written inside it, so this produces ./MyApp/MyApp.
    Intermediates land in a .build folder beside it and are removed afterwards.
- id: 01-4
  week: 1
  day: 4
  category: Concurrency
  headline: Sleep the <pause> for 50 milliseconds.
  explanation: Sleep is deliberately absent from the deferrable verb list. For the verbs that are on it
    the wait moves to the first read of the result; with Sleep the delay is the effect, so deferring it
    would quietly delete the pacing between this statement and the one after it.
- id: 01-5
  week: 1
  day: 5
  category: Tooling
  headline: aro kernel install
  explanation: Writes kernels/aro/kernel.json into your Jupyter data directory and then Jupyter starts
    the kernel itself. The spec records the absolute path of the aro binary, because Jupyter does not
    inherit the PATH of the shell you installed from.
- id: 01-6
  week: 1
  day: 6
  category: Data
  headline: 'Filter the <active-orders: List> from the <orders> where <status> is "active".'
  explanation: The where clause reads the fields of each element by name, so <status> here is a field
    of an order rather than a binding in the feature set. Comparisons take a literal or another binding.
    Nothing in the source collection is copied.
- id: 01-7
  week: 1
  day: 7
  category: HTTP
  headline: 'Return a <TooManyRequests: status> with <retry-after>.'
  explanation: Status names are looked up in one catalog that the interpreter, the compiled binary and
    aro check all read. Case and separators do not distinguish a name, so NoContent, no-content and No_Content
    are the same 204. A name the catalog does not know is answered 200.
- id: 02-1
  week: 2
  day: 1
  category: Files
  headline: 'Compute the <name: basename> from <p>.'
  explanation: The path qualifiers are pure functions on a string — basename, dirname, extension and stem
    never touch the filesystem, so they work on a path that does not exist yet. The three agree that basename
    is stem, a dot, and extension, which makes renaming a file two qualifiers rather than a Split.
- id: 02-2
  week: 2
  day: 2
  category: Control
  headline: 'Return an <OK: status> for the <order> when <user: age> >= 18.'
  explanation: A `when` guard decides whether the statement runs at all. A false condition skips that
    one statement and execution continues at the next line — there is no implicit else branch, so two
    outcomes are written as two guarded statements.
- id: 02-3
  week: 2
  day: 3
  category: Repositories
  headline: 'Configure the <cart-repository: scope> with "session".'
  explanation: A repository's scope is declared once, where the repository is declared, and no statement
    restates it. A cart is per-caller in every line that touches it, so saying so once is both less to
    write and impossible to get inconsistently wrong. An undeclared repository is application-scoped.
- id: 02-4
  week: 2
  day: 4
  category: Syntax
  headline: Retrieve the <user> from the <user-repository>.
  explanation: Every statement has the same three slots — the action verb, the result it binds, the object
    it reads. The preposition between them is grammar rather than decoration. Each action declares which
    prepositions it accepts, and one it does not is a check-time error.
- id: 02-5
  week: 2
  day: 5
  category: Loops
  headline: for each <item> in <items> { Store the <reservation> into the <reservation-repository>. }
  explanation: 'Iteration is bounded and deterministic: one element at a time, in order. The loop variable
    belongs to the body and is immutable, so nothing one iteration binds can be read by the next or after
    the loop.'
- id: 02-6
  week: 2
  day: 6
  category: DevOps
  headline: swift build --product ARORuntime && swift build --product aro
  explanation: Two invocations on purpose. SwiftPM honours only the last --product, so naming both in
    one command silently builds only the runtime. Do this before testing aro build against a runtime change,
    or the link picks up the archive you have installed instead.
- id: 02-7
  week: 2
  day: 7
  category: Operators
  headline: 'Return an <OK: status> for the <request> when <path> starts with "/api".'
  explanation: 'starts with and ends with are literal, which is the point of having them — matches "^a.c"
    accepts axc as readily as a.c. Neither word is reserved: only a following with, in operator position,
    makes one an operator, so <starts> stays usable as a name.'
- id: 03-1
  week: 3
  day: 1
  category: Expressions
  headline: 'Compute the <line-total> from <item: qty> * <item: price>.'
  explanation: A qualified reference is a valid expression operand wherever a bare one is. Its meaning
    is identical to extracting the field into a temporary first, so two Extract statements collapse into
    the arithmetic that wanted them.
- id: 03-2
  week: 3
  day: 2
  category: Date
  headline: 'Compute the <next-week: +7d> from <now>.'
  explanation: A date offset is written in the qualifier slot — +7d, -1d, +1h, +2w — and reads as the
    sentence it replaces. The framework variable <now> is the current instant in UTC, so an offset from
    it does not depend on the machine's local zone.
- id: 03-3
  week: 3
  day: 3
  category: Errors
  headline: Retrieve the <user> from the <user-repository> where id = <id>.
  explanation: Write the happy case. When the statement cannot be satisfied the runtime rebuilds it as
    the message — "Cannot retrieve the user from the user-repository where id = 530" — with the values
    that were live at the time substituted in.
- id: 03-4
  week: 3
  day: 4
  category: Lifecycle
  headline: '(Application-Start: File Watcher)'
  explanation: Exactly one per application, in whichever file you like. None is "no entry point defined";
    two is an error naming both files. Everything else in an application is reached by an event rather
    than by being called.
- id: 03-5
  week: 3
  day: 5
  category: Scoping
  headline: Create the <score> with 97. Publish as <headline-score> <score>.
  explanation: Publish as exports a binding under an alias so other feature sets can read it. It is a
    statement form of its own, with no preposition and no object clause. Inside the publishing feature
    set both names keep working, because the alias is an alias.
- id: 03-6
  week: 3
  day: 6
  category: Match
  headline: match <status> { case "paid" { Log "paid" to the <console>. } otherwise { Log "other" to the
    <console>. } }
  explanation: '`match` branches on one value and the first matching case wins. There is no fallthrough
    to arrange and no break to forget. `otherwise` is optional; with nothing matching and no `otherwise`,
    nothing runs.'
- id: 03-7
  week: 3
  day: 7
  category: Sockets
  headline: 'Start the <socket-server> with { port: 9000 }.'
  explanation: A TCP server is one statement and a Keepalive, and the connections it accepts arrive at
    feature sets whose business activity is Socket Event Handler. Nothing registers a callback, so the
    handlers can live in a different file from the statement that opened the port.
- id: 04-1
  week: 4
  day: 1
  category: Testing
  headline: aro test ./MyApp
  explanation: Tests are feature sets whose business activity ends in Test or Tests, living in the same
    .aro files as the code they cover. Nothing is discovered by filename. Finding no tests at all is an
    exit failure rather than a pass, so a renamed activity cannot quietly empty the suite.
- id: 04-2
  week: 4
  day: 2
  category: REPL
  headline: aro repl --load definitions.aro
  explanation: 'Pre-loads feature sets and definitions into the session before the first prompt, so you
    can poke at an application''s own actions rather than retyping them. Immutability still applies inside
    a session: a name binds once, and re-binding it is refused.'
- id: 04-3
  week: 4
  day: 3
  category: Philosophy
  headline: Store the <invoice> into the <invoice-repository>.
  explanation: Only the happy case is written. When a statement fails, the runtime reconstructs it with
    the values it held and reports that, so the failing line becomes the error message. There is no catch
    block and no error variable to thread through the feature set.
- id: 04-4
  week: 4
  day: 4
  category: Types
  headline: Create the <price> with 19.99.
  explanation: Four primitives cover the language — Integer, Float, String, Boolean — and the type is
    inferred from the literal, so 19.99 is a Float and 19 an Integer. Anything more structured is declared
    in openapi.yaml rather than in ARO.
- id: 04-5
  week: 4
  day: 5
  category: Literals
  headline: Create the <budget> with 1_000_000_000.
  explanation: 'Underscores group digits in decimal, hexadecimal and binary literals and are purely visual.
    Each must sit between two digits: no leading or trailing underscore, none doubled, and none touching
    the decimal point or the exponent marker.'
- id: 04-6
  week: 4
  day: 6
  category: Events
  headline: 'Emit a <UserCreated: event> with <user>.'
  explanation: 'A named variable is wrapped under its own name, so the handler reads `<event: user>`.
    Which form you wrote decides how the handler extracts, and routing is by the event type in the result
    descriptor — nothing subscribes at the call site.'
- id: 04-7
  week: 4
  day: 7
  category: IDE
  headline: aro lsp
  explanation: The language server, spoken over stdio, and normally started by an editor extension rather
    than by you. It serves diagnostics, hover, completion, go-to-definition, references, document and
    workspace symbols, formatting, rename, folding, signature help, code actions, document highlight and
    inlay hints.
- id: 05-1
  week: 5
  day: 1
  category: Immutability
  headline: Compute the <value-doubled> from <value-incremented> * 2.
  explanation: Bindings are immutable. The analyzer reports a rebind as an error citing the line of the
    first binding, so a transformation takes a new name instead. The chain of names then records the pipeline
    the value went through.
- id: 05-2
  week: 5
  day: 2
  category: State
  headline: 'Accept the <transition: draft_to_placed> on <order: status>.'
  explanation: Two checks at two times. Both halves of the name must be states the contract's enum declares,
    or the build stops and names the closest declared one. Then at run time the entity must already be
    in the first of them, or the transition is refused with the state it is actually in.
- id: 05-3
  week: 5
  day: 3
  category: Contract
  headline: 'operationId: uploadDocument'
  explanation: The operationId in openapi.yaml is the name of the feature set that handles the route,
    so there is no routing table, no decorator and no registration statement. A route nothing implements
    answers 501 and names the operationId it looked for. Two routes sharing an operationId is a contract
    error.
- id: 05-4
  week: 5
  day: 4
  category: Metrics
  headline: 'Log the <metrics: prometheus> to the <console>.'
  explanation: 'Runtime metrics are a value you read, in the format you name: short, table, plain or prometheus.
    The Prometheus rendering carries per-feature-set execution, success and failure counters, duration
    gauges, request-body byte counters and process CPU, memory and file-descriptor metrics.'
- id: 05-5
  week: 5
  day: 5
  category: Runtime
  headline: ARO_MAX_BODY=1MB
  explanation: 'The default ceiling on how much of a request body may become a value in memory, one megabyte
    unless you change it. It is a materialisation limit, not a transport limit: a route that only moves
    its body to a file or a socket accumulates nothing and is not bounded by it.'
- id: 05-6
  week: 5
  day: 6
  category: Actions
  headline: aro actions --qualifiers
  explanation: 'The live table is the specification: every built-in action with its verbs, prepositions
    and role, and every Compute qualifier with the types it accepts. The role tables in ARO-0004 are generated
    from the same source.'
- id: 05-7
  week: 5
  day: 7
  category: Plugins
  headline: aro new plugin --name my-csv --lang rust --actions --qualifiers
  explanation: 'The scaffolding flags pick what to generate: actions, qualifiers, services, system-objects,
    events, templates, or hybrid for native code plus .aro files. With none of them set you get actions.
    The name must be kebab-case, and --handle defaults to a PascalCase reading of it.'
- id: 06-1
  week: 6
  day: 1
  category: Compiler
  headline: aro build ./MyApp -o myapp
  explanation: A bare name is resolved relative to the application root, so the binary still lands beside
    the source. Give a path instead and the build goes out of place. Either way the intermediate files
    stay under the app's own .build directory, keyed by the binary's basename.
- id: 06-2
  week: 6
  day: 2
  category: Concurrency
  headline: Log <total> to the <console>.
  explanation: Log runs at its own statement and forces what it reads first, so console output stays in
    source order even when the statements around it overlap. Return, Throw, Publish, Emit, Compare, Validate
    and Accept behave the same way — effects and branch conditions are never deferred.
- id: 06-3
  week: 6
  day: 3
  category: Tooling
  headline: brew install zeromq
  explanation: The native Jupyter kernel speaks the Jupyter wire protocol over ZeroMQ directly, with no
    Python and no ipykernel, so libzmq is a system dependency alongside libgit2. On Debian and Ubuntu
    the package is libzmq3-dev.
- id: 06-4
  week: 6
  day: 4
  category: Data
  headline: 'Reduce the <total: Float> from the <orders> with sum(<amount>).'
  explanation: Reduce names its aggregate as a call — sum, avg, count, min, max. A field inside the parentheses
    aggregates that field of every record; empty parentheses, as in count(), aggregate the rows themselves.
    The annotation on the result is the type of the answer, not of the collection.
- id: 06-5
  week: 6
  day: 5
  category: HTTP
  headline: 'Return an <Unprocessable: status> with <problems>.'
  explanation: Several spellings map to one code where one reads better than another — Invalid is BadRequest,
    RateLimited is TooManyRequests, ServerError is Error. What ARO calls a status is not always the wire's
    reason phrase — this one is 422, sent as Unprocessable Content.
- id: 06-6
  week: 6
  day: 6
  category: Files
  headline: 'Compute the <joined: path-join> from "uploads/" with "/photo.png".'
  explanation: path-join puts exactly one separator between the pieces however they are written, which
    is the bug that string concatenation leaves in a program until a value arrives with a trailing slash.
    Both sides stay otherwise untouched.
- id: 06-7
  week: 6
  day: 7
  category: Control
  headline: 'Send the <notice> to the <user: email> when <user: email> exists.'
  explanation: '`exists`, `is defined`, `is null` and `is empty` are four different questions and the
    condition grammar keeps them apart. A missing field and a field holding an empty string are not the
    same case, so the wrong check guards the wrong thing.'
- id: 07-1
  week: 7
  day: 1
  category: Repositories
  headline: 'Configure the <cart-repository> with { scope: "session", ttl: 3600 }.'
  explanation: Several settings for one repository go in one object, because a second Configure naming
    the same subject is an immutable rebind. The scope value is quoted, because a bare word inside an
    object literal is a variable reference and would be looked up as a binding called session.
- id: 07-2
  week: 7
  day: 2
  category: Syntax
  headline: Log <message> to <console>.
  explanation: Articles are optional everywhere. The lexer recognises a, an and the, then discards them,
    so they change how a line reads aloud and nothing else. Write one where the sentence wants it and
    leave it out where it gets in the way.
- id: 07-3
  week: 7
  day: 3
  category: Loops
  headline: 'for each <user> in <users> where <active> is true { Send the <mail> to the <user: email>.
    }'
  explanation: A `where` on the loop filters as it goes, evaluated per element in that element's own scope.
    It is the predicate a `Filter` statement takes, without materialising the filtered collection under
    a second name first.
- id: 07-4
  week: 7
  day: 4
  category: DevOps
  headline: ARO_LIB_PATH=$PWD/.build/release/libARORuntime.a aro build ./MyApp
  explanation: Names the runtime archive outright, and it is checked before every other location. Without
    it the search ends at the working directory's .build, so an installed copy under /opt/homebrew/lib
    wins — and a runtime change appears to do nothing because the binary was built against the release.
- id: 07-5
  week: 7
  day: 5
  category: Operators
  headline: Log "Admin access" to the <console> when <roles> contains "admin".
  explanation: contains picks its comparison from the runtime type of the left operand. A list tests element
    membership, a string tests substring, a map tests key membership, and every other type answers false.
    Two strings therefore compare as substrings.
- id: 07-6
  week: 7
  day: 6
  category: Expressions
  headline: 'Return an <OK: status> for the <order> when <order-total> >= 50 or <prime-member>.'
  explanation: Grouping depends only on the operators, never on the shape of the operands. This reads
    as (order-total >= 50) or prime-member, because comparison binds tighter than or. Parentheses here
    would be for the reader; they produce the same tree.
- id: 07-7
  week: 7
  day: 7
  category: Date
  headline: 'Extract the <year> from the <now: year>.'
  explanation: The parts of a date are read the way any field is read. year, month, day, hour and the
    rest come off an instant without formatting it first, so a comparison or a filename segment does not
    go through a string.
- id: 08-1
  week: 8
  day: 1
  category: Errors
  headline: Retrieve the <queued> from the <order-repository> where <status> is "queued".
  explanation: A retrieval that matches nothing is not one of those failures. It binds an empty list,
    and the only throw on that path is a repository that does not exist. Guard on the result — the statement
    will not fail for you.
- id: 08-2
  week: 8
  day: 2
  category: Lifecycle
  headline: Keepalive the <application> for the <events>.
  explanation: Without it `Application-Start` returns and the process exits — a server would bind a port
    and immediately close it. Keepalive blocks the feature set, lets the event bus dispatch, and unblocks
    on SIGINT or SIGTERM.
- id: 08-3
  week: 8
  day: 3
  category: Scoping
  headline: Create the <score> with 97. Publish as <top-score> <score> when <score> > 50.
  explanation: A publish takes the same when guard an action statement takes. A false condition leaves
    the name unpublished rather than published with a placeholder, so a reader fails the way an absent
    binding always fails. Otherwise the test moves to every reader.
- id: 08-4
  week: 8
  day: 4
  category: Match
  headline: 'match <code> { case 404 { Return a <NotFound: status> for the <request>. } }'
  explanation: A case pattern is a literal, a variable, a regular expression, or `_`. Matching literal
    codes is the common shape, and a `Return` inside a case ends the feature set exactly as it would anywhere
    else.
- id: 08-5
  week: 8
  day: 5
  category: Sockets
  headline: 'Connect the <conn> to the <host> with { port: 9001 }.'
  explanation: The client side binds a connection it can then Send to, and replies come back as socket
    events rather than as the result of the Send. A client therefore needs a Keepalive too, or the program
    exits before the answer arrives.
- id: 08-6
  week: 8
  day: 6
  category: Testing
  headline: '(length-of-hello: String Utils Test) {'
  explanation: 'The suffix on the business activity is what makes this a test, and it is also what strips
    it: aro build removes test feature sets from the binary using the same rule the runner uses to find
    them. Tests and production code can therefore share a file without shipping.'
- id: 08-7
  week: 8
  day: 7
  category: REPL
  headline: aro repl --json
  explanation: Speaks one JSON object per line on stdin and stdout instead of running a terminal REPL
    — newline framing, not LSP Content-Length headers. It answers execute, is_complete, complete, inspect,
    info, reset and shutdown, and an unknown type gets an explicit protocol error rather than silence.
- id: 09-1
  week: 9
  day: 1
  category: Philosophy
  headline: Retrieve the <users> from the <user-repository> where <status> is "active".
  explanation: A Retrieve that matches nothing is not a failure. It binds an empty list, and a where clause
    matching exactly one row binds that record rather than a one-element list. Guard on the result — the
    statement will not fail on your behalf.
- id: 09-2
  week: 9
  day: 2
  category: Types
  headline: 'Create the <user: User> with <data>.'
  explanation: 'User here is a schema from openapi.yaml, not a name ARO defines. The contract is the type
    source whether or not the application serves HTTP: a spec with no paths still publishes its component
    schemas to every feature set.'
- id: 09-3
  week: 9
  day: 3
  category: Literals
  headline: Create the <avogadro> with 6.022_140_76e23.
  explanation: Separators work in the fraction and the exponent too, so a constant can be grouped the
    way it is printed. Grouping is free-form rather than thousands-only, because the lexer strips the
    underscores before the number is parsed at all.
- id: 09-4
  week: 9
  day: 4
  category: Events
  headline: 'Emit an <OrderPlaced: event> with { id: <id>, total: <total> }.'
  explanation: 'An object literal is spread instead of wrapped: its fields become top-level payload keys,
    so the handler reads `<event: id>` and `<event: total>`. Payload values are forced at the emitting
    statement, never later.'
- id: 09-5
  week: 9
  day: 5
  category: IDE
  headline: aro lsp --debug
  explanation: 'Logs every message received and sent to stderr with a timestamp, truncated so one large
    document does not bury the trace. This is the first thing to reach for when an editor shows no diagnostics:
    it tells you whether the editor is talking to the server at all.'
- id: 09-6
  week: 9
  day: 6
  category: Immutability
  headline: 'Compute the <second-length: length> from the <second-message>.'
  explanation: Immutability is why qualifier-as-name exists. Two statements both writing <length> are
    a rebind, not an overwrite, so the operation moved into the qualifier and the base became whatever
    you want to call the result.
- id: 09-7
  week: 9
  day: 7
  category: State
  headline: '(Log Transition: status StateObserver<paid_to_shipped>)'
  explanation: A state observer reacts to a transition; a handler guard filters on a current value. `Handler<status:shipped>`
    fires for any event that says shipped, the observer only for the edge that arrived there.
- id: 10-1
  week: 10
  day: 1
  category: Contract
  headline: 'Extract the <limit> from the <queryParameters: limit>.'
  explanation: Query parameter values are always strings, including a default the schema supplies — a
    missing limit with a default of 10 arrives as "10", never as the number. Compute the type you want
    before doing arithmetic with it.
- id: 10-2
  week: 10
  day: 2
  category: Metrics
  headline: 'Log the <metrics: short> to the <console>.'
  explanation: 'One line: executions, feature sets, average duration, uptime, CPU, memory and file descriptors.
    Metrics count feature-set executions rather than statements, and there is deliberately no way to reset
    them — a counter that goes backwards is worse than no counter.'
- id: 10-3
  week: 10
  day: 3
  category: Runtime
  headline: ARO_BODY_CHUNK_SIZE=65536
  explanation: The buffer size for streamed request bodies and streamed file writes, sixty-four kilobytes
    by default. It matches the file service's own read chunk, so a body streamed from a socket straight
    to a file moves in one buffer size from end to end.
- id: 10-4
  week: 10
  day: 4
  category: Actions
  headline: Compute the <doubled> from <n> * 2.
  explanation: 'Compute is OWN: internal to internal. With no qualifier it evaluates the expression; with
    one, the qualifier selects the operation and the base becomes the name the result is bound to. Arithmetic,
    comparison and the built-in operations all arrive through this one verb.'
- id: 10-5
  week: 10
  day: 5
  category: Plugins
  headline: aro add https://github.com/arolang/plugin-csv.git
  explanation: Clones a plugin into your application's Plugins/ directory and records it. The repository
    must have a plugin.yaml at its root; without one the install stops rather than leaving a directory
    the loader will skip.
- id: 10-6
  week: 10
  day: 6
  category: Compiler
  headline: aro build
  explanation: 'Native compilation needs LLVM, and it is available on macOS and Linux. On Windows the
    command is not there: run, check, compile and test are the supported path, and an application developed
    on Windows still builds to a binary on the other two.'
- id: 10-7
  week: 10
  day: 7
  category: Concurrency
  headline: Retrieve the <rows> from the <user-repository>.
  explanation: Retrieve is deferrable, so this starts here and the program waits at the first statement
    that reads rows. If nothing ever reads it, feature-set exit forces it anyway, so a failure nobody
    looked at is still reported — and attributed to this line rather than to wherever it surfaced.
- id: 11-1
  week: 11
  day: 1
  category: Tooling
  headline: aro mcp
  explanation: Runs ARO as an MCP server over stdio so a model can use the real toolchain. It exposes
    eight tools — aro_check, aro_run, aro_compile, aro_examples, aro_actions, aro_qualifiers, aro_parse
    and aro_syntax — along with the proposals, examples and books as resources.
- id: 11-2
  week: 11
  day: 2
  category: Data
  headline: Group the <by-status> from the <orders> by "status".
  explanation: Group partitions a collection into sub-collections keyed by one field's value, and the
    field name is quoted. Every row lands in exactly one group, keyed by whatever that field holds. Reduce
    over each group is how a per-key total is written.
- id: 11-3
  week: 11
  day: 3
  category: HTTP
  headline: 'Return a <PendingVerification: status> with <account>.'
  explanation: A status name of your own is a deliberate 200, and the language keeps that spelling available
    for domain vocabulary. aro check stays quiet about it and warns only when a name is within a typo's
    distance of a real status, because NotFoudn is not domain vocabulary.
- id: 11-4
  week: 11
  day: 4
  category: Files
  headline: 'Compute the <safe: path-join> from "/uploads" with "/etc/passwd".'
  explanation: An absolute right-hand component does not reset the path. The answer is /uploads/etc/passwd,
    deliberately unlike Python, because the call this exists for is joining a trusted directory to a name
    somebody else chose. A join must not be turnable into "anywhere on the filesystem".
- id: 11-5
  week: 11
  day: 5
  category: Control
  headline: Log "sale" to the <console> when <order-date> in <sale-period>.
  explanation: '`in` dispatches on its right operand: a date-range tests interval membership inclusive
    of both endpoints, a list tests elements, a string tests substrings, an object tests keys. `<xs> contains
    <x>` asks the same question from the other side.'
- id: 11-6
  week: 11
  day: 6
  category: Repositories
  headline: 'Configure the <partial-repository: scope> with "connection".'
  explanation: A TCP connection is not a user. Anyone who can open a socket gets one, it carries no credentials,
    and nothing about it survives a reconnect — so connection scope and session scope are two words rather
    than one. Connection-scoped data is dropped when the socket closes.
- id: 11-7
  week: 11
  day: 7
  category: Syntax
  headline: Compute the <total> from <price> * <quantity>.
  explanation: The period ends a statement, not the newline. Whitespace only separates tokens, so a long
    statement can wrap across several lines and two short ones can share one. What every statement does
    need is its terminating period.
- id: 12-1
  week: 12
  day: 1
  category: Loops
  headline: for each <row> at <index> in <rows> { Log <index> to the <console>. }
  explanation: '`at` binds the position alongside the element. Both names live in the iteration''s scope,
    so the index is available to the body and gone afterwards, like the element itself. Nothing accumulates
    across iterations, because there is no outer name a body could write to.'
- id: 12-2
  week: 12
  day: 2
  category: DevOps
  headline: brew install llvm
  explanation: aro build needs LLVM's llc on the machine doing the building. It is looked for in the Homebrew
    and system prefixes before PATH, and if it is not there the build stops with the install command for
    your platform rather than failing somewhere further down.
- id: 12-3
  week: 12
  day: 3
  category: Operators
  headline: Log "Priority" to the <console> when <tier> in ["gold", "platinum"].
  explanation: in is the inverse of contains and dispatches on the right operand instead of the left.
    A list tests elements, a string tests substring, a map tests keys, and a date range tests the interval
    inclusive of both ends. not in is its negation.
- id: 12-4
  week: 12
  day: 4
  category: Expressions
  headline: 'Return an <OK: status> for the <check> when not <balance> >= 0.'
  explanation: not sits below the comparisons, so this negates the comparison rather than the operand.
    Unary minus is the tight one, which makes -<a> * <b> read as (-<a>) * <b>. The ten-level precedence
    table is the whole story.
- id: 12-5
  week: 12
  day: 5
  category: Date
  headline: 'Compute the <meeting: date> from "2025-06-15T14:00:00Z".'
  explanation: The date qualifier parses an ISO 8601 string into an instant. Once it is one, the comparison
    operators work on it directly, so "is this in the past" is a when guard against <now> rather than
    string arithmetic.
- id: 12-6
  week: 12
  day: 6
  category: Errors
  headline: 'Throw a <Conflict: error> for the <order-modification>.'
  explanation: '`Throw` is the explicit path, for when a business rule rather than a failure decides the
    outcome. Left to itself the runtime maps by verb: a failed Extract is 400, a failed Retrieve 404,
    a failed Validate 422.'
- id: 12-7
  week: 12
  day: 7
  category: Lifecycle
  headline: '(Application-End: Success)'
  explanation: Optional, and at most one. It runs after the shutdown signal, once new work has stopped
    and pending events have drained, so a `Stop` here sees a quiet application rather than one mid-request.
    Draining has a timeout, after which the runtime warns and continues.
- id: 13-1
  week: 13
  day: 1
  category: Scoping
  headline: Require the <API_TOKEN> from the <environment>.
  explanation: Require names an external dependency, and the source decides who supplies it. environment
    binds the process environment variable of that name; reading it when it is unset fails the statement
    in the ordinary way.
- id: 13-2
  week: 13
  day: 2
  category: Match
  headline: match <subscription> { case <premium> where <credits> > 0 { Log "go" to the <console>. } }
  explanation: '`where` adds a guard to a case, so two cases can share a pattern and differ only on a
    condition. Order decides which one runs: put the guarded case first, or the unguarded one absorbs
    every value the pattern matches and the guarded case never fires.'
- id: 13-3
  week: 13
  day: 3
  category: Sockets
  headline: 'Extract the <received-data> from the <packet: buffer>.'
  explanation: A data event carries the payload twice over — buffer and data give the raw bytes, message
    and text give them decoded as UTF-8. Which one to read is the question of whether the protocol is
    binary, and reading the wrong one is how a protocol bug becomes a text bug.
- id: 13-4
  week: 13
  day: 4
  category: Testing
  headline: Given the <text> with "hello".
  explanation: Given binds an input for the test that follows. Several Givens build up the context, and
    everything bound is visible to the feature set the test exercises — there is no separate fixture or
    mock layer to wire up.
- id: 13-5
  week: 13
  day: 5
  category: REPL
  headline: '{"id": 1, "type": "execute", "code": "Log \"hi\" to the <console>."}'
  explanation: Every stream message for a request is written before that request's single result message
    — the server pushes a sentinel through the capture pipe and waits for it, so the ordering is a guarantee
    rather than a race you usually win.
- id: 13-6
  week: 13
  day: 6
  category: Philosophy
  headline: 'Return a <TooManyRequests: status> for the <request>.'
  explanation: Status names come from one catalog that the interpreter, the compiled binary and aro check
    all read, so this is 429 in every mode. Case and separators do not distinguish names, and a misspelling
    close to a real one is reported at check time.
- id: 13-7
  week: 13
  day: 7
  category: Types
  headline: Compute the <count> as Integer from <total> / 2.
  explanation: 'The as clause annotates a result''s type. It exists because the colon slot is taken —
    <count: length> selects an operation, so a type needs somewhere else to live. Annotations are optional;
    reach for one when inference gives an Integer and you wanted a Float.'
- id: 14-1
  week: 14
  day: 1
  category: Literals
  headline: 'Create the <config> with { port: 8080, host: "localhost" }.'
  explanation: Object literals take identifier or quoted-string keys and array literals use square brackets.
    Both infer their type from the contents, so this is a Map and [1, 2, 3] is a List of Integer. Neither
    needs a schema to exist.
- id: 14-2
  week: 14
  day: 2
  category: Events
  headline: '(Send Welcome Email: UserCreated Handler)'
  explanation: A feature set is triggered by its business activity rather than by being called. `{EventType}
    Handler` subscribes to a domain event, `{repository-name} Observer` to repository changes, and an
    `operationId` to an HTTP route.
- id: 14-3
  week: 14
  day: 3
  category: IDE
  headline: '"aro.lsp.path": "/usr/local/bin/aro"'
  explanation: The VS Code extension resolves the server binary from this setting, falling back to whatever
    aro is on PATH. Point it at a checkout's build when you want the editor to use the compiler you are
    working on rather than the one you installed.
- id: 14-4
  week: 14
  day: 4
  category: Immutability
  headline: 'Compute the <item-total> from <item: price> * <item: quantity>.'
  explanation: A loop variable is immutable per iteration rather than across the loop, because each pass
    builds fresh bindings in a child context. So a statement inside a for-each may bind the same name
    on every pass, and still cannot rebind it within one.
- id: 14-5
  week: 14
  day: 5
  category: State
  headline: '(Audit Changes: user-repository Observer)'
  explanation: An observer receives `changeType` — created, updated or deleted — with `oldValue`, `newValue`
    and the repository name alongside it. Observers are awaited by default, so a `Store` does not return
    until they have run, and the write is visible by the time they do.
- id: 14-6
  week: 14
  day: 6
  category: Contract
  headline: 'Extract the <api-key> from the <headerParameters: x-api-key>.'
  explanation: Only headers the contract declares as in header appear here. An undeclared header is absent
    rather than empty, and there is no spelling that reaches the raw header map, so a header a handler
    depends on is a header the contract names. Cookies arrive the same way under cookieParameters.
- id: 14-7
  week: 14
  day: 7
  category: Metrics
  headline: 'Return an <OK: status> with <metrics: prometheus>.'
  explanation: Execution counts and timings are collected without instrumenting anything. The qualifier
    picks the rendering - prometheus, plain, short or table - so one binding serves a scrape endpoint
    and a human reading a terminal.
- id: 15-1
  week: 15
  day: 1
  category: Events
  headline: '(FlagBigOrder: OrderPlaced Handler) when <event: total> > 50 {'
  explanation: A guard on the declaration decides whether the handler runs at all, and a skipped handler
    is silent - not firing is a routing decision, not a failure. It reads only the event payload, so a
    threshold the emitter did not put into the event cannot be tested here. Payload fields are reached the
    same way the body reaches them, through the event object, not as bare names. The same words after a
    statement guard only that statement.
- id: 15-2
  week: 15
  day: 2
  category: Plugins
  headline: aro add git@github.com:arolang/plugin-csv.git --ref v1.0.0
  explanation: Pins the install to a tag or commit. --branch is the same knob under another name — it
    folds into --ref — so the two are not independent and there is no point passing both. SSH and HTTPS
    URLs both work.
- id: 15-3
  week: 15
  day: 3
  category: Compiler
  headline: aro build ./MyApp --static
  explanation: The default, so passing it changes nothing. It means the Swift runtime is linked in rather
    than shipped alongside, and native plugins are compiled into the binary instead of loaded at startup.
    On macOS the Swift runtime is always the system one — Apple ships no static build of it.
- id: 15-4
  week: 15
  day: 4
  category: Concurrency
  headline: ARO_FORCE_WARN_SECONDS=5
  explanation: When a statement has waited this long on a deferred result, the runtime writes one line
    to stderr naming the binding and its source position, then keeps waiting. It is a diagnostic aid,
    not a deadline. Set it to 0, off, false or no to silence it.
- id: 15-5
  week: 15
  day: 5
  category: Tooling
  headline: aro ask "write a feature set that greets a user"
  explanation: A coding assistant that runs against a local model and has the real toolchain wired in
    as tools, so it can check and run what it writes rather than guessing. Give it a prompt for one answer,
    or no argument to get a REPL.
- id: 15-6
  week: 15
  day: 6
  category: Data
  headline: 'Map the <summaries: List<UserSummary>> from the <users>.'
  explanation: A PascalCase annotation is a schema from the contract's components/schemas, and Map copies
    only the fields that schema declares — recursively, so a nested record is projected too. It is how
    a field stays out of a response. A name that matches no schema is an error, not an empty list.
- id: 15-7
  week: 15
  day: 7
  category: HTTP
  headline: 'x-aro-max-body: 256KB'
  explanation: A route declares how much of a request body it is willing to hold. A body over the limit
    is answered 413 before it is read — from Content-Length where the client declared one, incrementally
    otherwise. The default is 1 MB, and the route's own declaration wins over it.
- id: 16-1
  week: 16
  day: 1
  category: Files
  headline: 'Compute the <ext: extension> from ".gitignore".'
  explanation: A dotfile is a name, not an extension, so this is empty and stem is the whole .gitignore.
    An extension never carries its dot, which is what lets it be compared against a literal without one
    and joined back with path-join.
- id: 16-2
  week: 16
  day: 2
  category: Control
  headline: Log "found" to the <console> when <roles> contains "admin".
  explanation: '`contains` picks its comparison from the runtime type of the left operand — list membership,
    substring, or object key. Every other left-hand type evaluates to false rather than failing, so a
    guard over a number silently never fires.'
- id: 16-3
  week: 16
  day: 3
  category: Repositories
  headline: Attach the <session> to the <connection>.
  explanation: A socket peer that authenticates in-band is promoted with this one statement, after which
    session-scoped repositories resolve for it. Promotion cannot be undone or redirected inside a connection,
    because either would be a downgrade attack in one line. Closing the socket is how a peer stops being
    that session.
- id: 16-4
  week: 16
  day: 4
  category: Syntax
  headline: (* A block comment runs until the closing star-paren, over as many lines as it needs. *)
  explanation: ARO has two comment forms. The block form spans lines; a double slash runs to the end of
    one. Specifications and examples reach for the block form, because a note above a feature set rarely
    fits on a single line.
- id: 16-5
  week: 16
  day: 5
  category: Loops
  headline: for each <n> in [1, 2, 3] { Log <n> to the <console>. }
  explanation: 'The collection slot takes a noun or any expression — a list literal, a field access, a
    parenthesised expression. It is evaluated once, before the first iteration, never per element. There
    is no range literal: count with `for <n> from 1 to 10` instead.'
- id: 16-6
  week: 16
  day: 6
  category: DevOps
  headline: sudo apt-get install llvm-14
  explanation: 'The Linux side of the same requirement. The object file is emitted position-independent
    there, which is not optional: modern distributions default to position-independent executables, and
    an object built without it produces relocations the link then rejects.'
- id: 16-7
  week: 16
  day: 7
  category: Operators
  headline: 'Return an <OK: status> for the <check> when <name> matches "^a.c".'
  explanation: matches is a regular expression test, and the pattern lives in a string, so a backslash
    needs doubling. When a literal prefix or suffix is what you actually want, starts with and ends with
    say so without any escaping at all.
- id: 17-1
  week: 17
  day: 1
  category: Expressions
  headline: 'Create the <region> with <params: region> default <config: region> default "eu".'
  explanation: 'default yields its left operand when that operand is present and the right one otherwise,
    chaining left to right so the first present value wins. Present means the value exists: false, 0,
    "" and [] are values somebody wrote, and they beat the default.'
- id: 17-2
  week: 17
  day: 2
  category: Date
  headline: 'Extract the <berlin: timezone> from <instant> with "Europe/Berlin".'
  explanation: Timezone conversion is an Extract, not a Compute qualifier, because it reads one rendering
    of an instant out of another. The instant never moves — the same moment rendered in three zones still
    carries one timestamp, which is what keeps comparisons honest.
- id: 17-3
  week: 17
  day: 3
  category: Errors
  headline: 'Return a <PendingVerification: status> for the <request>.'
  explanation: A name nowhere near a real status is a domain status, and is deliberately a 200 on the
    wire. A name within a typo's distance of a real one is a check-time warning naming the status that
    was meant.
- id: 17-4
  week: 17
  day: 4
  category: Lifecycle
  headline: '(Application-End: Error)'
  explanation: 'The other optional handler, for the path where the application is going down because something
    failed. It reads what happened the way any feature set reads a conduit: `Extract the <reason> from
    the <shutdown: error>.`'
- id: 17-5
  week: 17
  day: 5
  category: Scoping
  headline: Require the <settings> from the <ConfigLoader>.
  explanation: A source that is neither framework nor environment names a feature set, and aro check warns
    when nothing publishes that symbol. The source is a single identifier, so a multi-word feature set
    cannot be named here. framework documents a runtime dependency and does nothing.
- id: 17-6
  week: 17
  day: 6
  category: Match
  headline: match <text> { case /^[A-Z]{2}\d{4}$/ { Log "code" to the <console>. } }
  explanation: A regular expression is a case pattern in its own right, written in the same `/pattern/flags`
    form `Split` takes. Dispatching on format then reads as a list of shapes rather than a chain of guarded
    statements.
- id: 17-7
  week: 17
  day: 7
  category: Sockets
  headline: 'Extract the <client-id> from the <connection: id>.'
  explanation: A connect handler is given connection, with id and remoteAddress on it; a data handler
    is given packet; a disconnect handler is given event, with connectionId and reason. The three system
    objects differ because the three moments know different things.
- id: 18-1
  week: 18
  day: 1
  category: Testing
  headline: When the <len> from the <get-length>.
  explanation: 'When runs the named feature set with every variable the test has bound so far, and binds
    its result. It is optional: any ordinary statement may sit between Given and Then, which is how a
    test that only exercises a computation is written.'
- id: 18-2
  week: 18
  day: 2
  category: REPL
  headline: '{"id": 2, "type": "execute", "cellId": "c7", "code": "..."}'
  explanation: Sending a cellId releases the bindings that cell made before re-running it, which is what
    makes re-executing a notebook cell work at all. Leave it out and the session keeps ARO's ordinary
    rule, so a plain REPL line that re-binds a name is still refused.
- id: 18-3
  week: 18
  day: 3
  category: Philosophy
  headline: Cannot retrieve the user from the user-repository where id = 530.
  explanation: Errors are the runtime's job, not the program's. It reconstructs the statement that failed
    and fills in the values it had, so the message is the line you wrote with the data that broke it.
    There are no error-handling branches to write, or to read past.
- id: 18-4
  week: 18
  day: 4
  category: Types
  headline: Create the <nothing> with null.
  explanation: ARO has no optional types. There is nothing to unwrap and no way to declare a field as
    maybe-absent. A null value still exists — null, nil and none lex to the same literal — and is null
    compares against it. The guarantee is no declared optionality.
- id: 18-5
  week: 18
  day: 5
  category: Literals
  headline: Create the <greeting> with "Hello, ${<name>}.".
  explanation: Interpolation embeds an expression in a string, and it is the full expression grammar,
    so arithmetic works inside the braces. A double-quoted string may also span source lines — a newline
    between the quotes is content, kept exactly as written.
- id: 18-6
  week: 18
  day: 6
  category: Events
  headline: '(Process Payment: OrderUpdated Handler<status:paid>)'
  explanation: A state guard filters before the handler body runs. Commas are OR, semicolons AND, dots
    navigate into nested payload fields, and comparison is case-insensitive. An event that does not match
    is skipped silently.
- id: 18-7
  week: 18
  day: 7
  category: IDE
  headline: python3 Scripts/generate-editor-grammars.py --check
  explanation: The TextMate grammars under Editor/ are generated from the same action registry that feeds
    aro actions and the language server, and CI verifies they are current. A hand-maintained verb list
    drifts; a derived one cannot.
- id: 19-1
  week: 19
  day: 1
  category: Actions
  headline: 'Compute the <total: sum> from <amounts>.'
  explanation: The qualifier namespace is closed. A Compute qualifier must resolve to a built-in, a plugin
    qualifier, a chain, or a date offset; anything else is an error naming the closest match rather than
    a value quietly passed through unchanged.
- id: 19-2
  week: 19
  day: 2
  category: Plugins
  headline: aro remove plugin-csv --force
  explanation: Deletes the plugin's directory and drops it from the lock file. Without --force it asks
    first. Removing the directory by hand leaves the lock entry behind, so the command is worth using
    even though the deletion looks trivial.
- id: 19-3
  week: 19
  day: 3
  category: Compiler
  headline: aro build ./MyApp --dynamic
  explanation: On Linux this links the Swift runtime dynamically and copies the Swift, Foundation and
    ICU shared objects next to the binary with an rpath of $ORIGIN, so the directory travels as a unit.
    Plugins ship beside the binary too and are loaded at startup the way the interpreter loads them.
- id: 19-4
  week: 19
  day: 4
  category: Concurrency
  headline: 'Configure the <application: concurrency> with 8.'
  explanation: 'This bounds the whole application, not one loop: every triggered feature set and every
    parallel-loop iteration that is not already running inside a slot counts against it. Work queues at
    the ceiling, it never fails. 0 means no ceiling, and ARO_CONCURRENCY sets the same number.'
- id: 19-5
  week: 19
  day: 5
  category: Tooling
  headline: aro ask --read-only "why does this route 500?"
  explanation: Withholds the tools that write files or run commands instead of refusing them later, and
    tells the model so. A tool whose use will be refused is not a capability — it is a round the model
    spends discovering that — so the answer comes back as a description of the change.
- id: 19-6
  week: 19
  day: 6
  category: Data
  headline: 'Compute the <common: intersect> from <list-a> with <list-b>.'
  explanation: intersect, difference and union apply to lists, strings and objects alike. Lists carry
    multiset semantics — [1,2,2,3] against [2,2,2,4] intersects to [2,2], the smaller count of the two.
    Objects compare field by field, and union merges with the left side winning.
- id: 19-7
  week: 19
  day: 7
  category: HTTP
  headline: 'Extract the <upload> from the <request: body>.'
  explanation: This binds the body without reading it, so on its own it costs nothing whatever the upload
    weighs. What the statement after it does decides everything — moving the body leaves it a stream,
    reading it turns it into a value, and only a value has a size to bound.
- id: 20-1
  week: 20
  day: 1
  category: Files
  headline: 'Compute the <abs: absolute> from "/srv/./app/../app/run.sh".'
  explanation: Dot and double-dot are resolved lexically against the working directory, so the answer
    never depends on what is a symlink today. Being a pure function is the point — the same input gives
    the same path on a machine where none of it exists.
- id: 20-2
  week: 20
  day: 2
  category: Control
  headline: Log "late" to the <console> when <deadline> before <now>.
  explanation: '`before` and `after` compare two instants — dates, or the ISO-8601 strings dates arrive
    as over HTTP and in JSON — and sit at the same precedence as `<` and `>`. Comparing something that
    is neither a date nor a number raises instead of answering false.'
- id: 20-3
  week: 20
  day: 3
  category: Repositories
  headline: Attach the <session> to the <caller>.
  explanation: The HTTP half of the same verb, which hands the caller the session cookie. A record with
    no id mints a session; a record carrying one adopts that session and rotates its identifier, which
    is the session-fixation defence. An id no session holds is an error.
- id: 20-4
  week: 20
  day: 4
  category: Syntax
  headline: 'Extract the <id> from the <pathParameters: id>.'
  explanation: The text after the colon is a qualifier. On a record it selects a field, so this binds
    one path parameter instead of the whole dictionary. The contract names the parameter and the statement
    reads it, with no routing table in between.
- id: 20-5
  week: 20
  day: 5
  category: Loops
  headline: for each <line> in <order>.lines { Log <line> to the <console>. }
  explanation: 'Field access is the expression form of the collection slot. The noun form is not sugar
    for it: only a name can carry specifiers, and only a name reaches the lazy-stream path that iterates
    in constant memory.'
- id: 20-6
  week: 20
  day: 6
  category: DevOps
  headline: otool -L ./MyApp/MyApp
  explanation: The honest way to find out what a finished binary needs on the target machine — the link
    line is a statement of intent, this is the result. Anything outside the system paths is a file the
    recipient has to receive alongside the binary.
- id: 20-7
  week: 20
  day: 7
  category: Operators
  headline: Log "Upcoming" to the <console> when <event-date> after <now>.
  explanation: before and after compare two instants — dates, or the ISO-8601 strings dates arrive as
    over HTTP and in JSON — at the same precedence as the arithmetic comparisons. Comparing something
    that is neither a date nor a number raises rather than answering false.
- id: 21-1
  week: 21
  day: 1
  category: Expressions
  headline: 'Extract the <port> from the <env: PORT> default "8080".'
  explanation: Only an unset variable takes the default. An empty PORT is a value and wins, the same rule
    the operator follows for 0 and the empty string. Without the clause an unset environment variable
    still binds an empty string rather than failing.
- id: 21-2
  week: 21
  day: 2
  category: Date
  headline: 'Extract the <tokyo: "Asia/Tokyo"> from <summer>.'
  explanation: The zone may be the qualifier itself when it is a literal, which keeps a one-off rendering
    to a single statement. Converting out and back is the identity, because nothing about the instant
    changed on the way.
- id: 21-3
  week: 21
  day: 3
  category: Errors
  headline: 'Return an <Unprocessable: status> for the <request>.'
  explanation: ARO says `Unprocessable`; HTTP says "Unprocessable Content". The catalog keeps the ARO
    spelling, the canonical name and the wire reason phrase apart, so the response line reads as HTTP
    requires without the source having to.
- id: 21-4
  week: 21
  day: 4
  category: Lifecycle
  headline: Start the <http-server> with <contract>.
  explanation: 'The contract is `openapi.yaml` and it is required: with no contract the server does not
    start and no port is opened. Feature sets are named after `operationId` values, and that is the whole
    of the route wiring.'
- id: 21-5
  week: 21
  day: 5
  category: Scoping
  headline: Retrieve the <profile> for the <authenticated-user>.
  explanation: A published variable crosses feature sets only inside the same business activity. Two feature
    sets both marked User Management see each other's published names; one marked Commerce does not. The
    activity in the header is the scope boundary.
- id: 21-6
  week: 21
  day: 6
  category: Match
  headline: match <n> { case _ { Log "any" to the <console>. } }
  explanation: '`_` matches anything, which makes it a case nothing after it can reach. Put it last, or
    write `otherwise`, which says the same thing in the place a reader already looks for it. A match with
    neither runs no branch at all when nothing fits, and execution continues after the block.'
- id: 21-7
  week: 21
  day: 7
  category: Sockets
  headline: '(Handle Data Received: Socket Event Handler)'
  explanation: Which of the three socket events a handler subscribes to is read out of its name — disconnect
    wins over connect, and data, message or received all mean the data event. A name carrying none of
    those words subscribes to all three rather than silently to nothing.
- id: 22-1
  week: 22
  day: 1
  category: Testing
  headline: Then the <len> with 5.
  explanation: Then is the assertion. A failure reads "Expected len to be 5, but was 4" — the binding's
    name, the expected value, the actual one. An undefined binding is reported as its own failure rather
    than compared against nothing.
- id: 22-2
  week: 22
  day: 2
  category: REPL
  headline: ARO_REPL_ALLOW_BLOCKING=1
  explanation: Keepalive, Wait and Block are refused inside a REPL or notebook cell, because a cell that
    blocks forever cannot be unwound and takes the session with it. Set this to exactly 1 when you really
    do want the cell to sit there.
- id: 22-3
  week: 22
  day: 3
  category: Philosophy
  headline: Retrieve the <users> from the <user-repository> where <id> is <id>.
  explanation: A Retrieve that matches nothing is not a failure. It binds an empty list, and with a where
    clause matching exactly one row it binds that record rather than a one-element list. Guard on the
    result; the statement will not fail for you.
- id: 22-4
  week: 22
  day: 4
  category: Types
  headline: Compute the <count> as Float from the <total>.
  explanation: A result type uses `as`, not the qualifier slot, because the qualifier slot already selects
    an operation. Asking for one named Float instead gets an error naming the closest real qualifier.
- id: 22-5
  week: 22
  day: 5
  category: Literals
  headline: Create the <greeting> with "Hello, " ++ <name> ++ ".".
  explanation: Two plus signs concatenate strings, and sit with plus and minus in the precedence table.
    Single plus stays arithmetic, so no operator means addition for numbers and joining for text. The
    spelling you wrote says which one you meant.
- id: 22-6
  week: 22
  day: 6
  category: Events
  headline: '(Crawl Page: CrawlPage Handler<dedupe:url>)'
  explanation: '`dedupe` names the payload field that identifies an event: the first event carrying a
    value runs the handler and later ones with the same value are skipped. The store keeps the most recent
    100 000 identities, evicting oldest first.'
- id: 22-7
  week: 22
  day: 7
  category: Actions
  headline: 'Compute the <ls: lines> from <content>.'
  explanation: 'Counting lines is `lines` and then `length`: `lines` already drops the phantom element
    a trailing newline would otherwise produce. `aro check` rejects an unknown qualifier, so a green check
    means the name exists.'
- id: 23-1
  week: 23
  day: 1
  category: Plugins
  headline: aro plugins
  explanation: Lists what is installed, and it never builds anything — it is a directory walk and a manifest
    read, so it cannot sit there in a compile or block on a build lock. A plugin that has no artefact
    yet is shown with a note telling you to run a rebuild.
- id: 23-2
  week: 23
  day: 2
  category: Compiler
  headline: aro build ./MyApp --static --dynamic
  explanation: This is a hard error, not a preference the build resolves for you. Link mode decides whether
    plugins are compiled in or shipped alongside, and it is settled before any plugin is built, so a contradictory
    pair has to be refused rather than silently ranked.
- id: 23-3
  week: 23
  day: 3
  category: Concurrency
  headline: 'Configure the <http-client> with { concurrency: 4, rate: "10/s" }.'
  explanation: 'Several settings for one category go in one object — two Configure statements naming the
    same category would rebind an immutable binding. A ceiling and a rate are different limits and both
    apply: one request at a time still exceeds a per-minute quota.'
- id: 23-4
  week: 23
  day: 4
  category: Tooling
  headline: ARO_ASK_ENDPOINT=http://localhost:8080/v1
  explanation: 'Points aro ask at any OpenAI-compatible server and takes priority over every local backend.
    Nothing ships configured to send your project anywhere: this variable is the only route out, and ARO_ASK_API_KEY
    supplies the bearer token if the endpoint wants one.'
- id: 23-5
  week: 23
  day: 5
  category: Data
  headline: 'Compute the <changed: symmetric-difference> from <before-roles> with <after-roles>.'
  explanation: The elements in exactly one of the two collections — what a diff of two sets of roles,
    tags or ids actually asks for. Against itself it is empty, which makes "nothing changed" a length
    of zero rather than a special case.
- id: 23-6
  week: 23
  day: 6
  category: HTTP
  headline: 'Write the <upload> to the <file: target>.'
  explanation: Moving a body to a sink never builds it in memory, so no limit applies and a four-gigabyte
    upload costs one chunk. Write, Append, Send, Return, Broadcast, Emit and Publish are all moves. What
    a route can accept is therefore a property of what the handler does, not of the server.
- id: 23-7
  week: 23
  day: 7
  category: Files
  headline: 'Compute the <dir: dirname> from "report.csv".'
  explanation: The dirname of a bare filename is a single dot, not an empty string, so the result stays
    a usable path for the next join or Read. Nothing here asks the filesystem anything, which is why the
    answer is the same on a machine where the file does not exist.
- id: 24-1
  week: 24
  day: 1
  category: Control
  headline: 'Log "active" to the <console> when not <account: suspended>.'
  explanation: '`not` negates one condition, `and` and `or` combine two, and parentheses group where the
    default precedence is not what was meant. However long the expression grows it still guards a single
    statement — the guard is a suffix on one line, not a block.'
- id: 24-2
  week: 24
  day: 2
  category: Repositories
  headline: Retrieve the <cart> from the <cart-repository>.
  explanation: Scope mistakes are caught before the program runs, because a feature set's trigger is known
    from its business activity. A session-scoped repository read from Application-Start or a file handler
    is reported, and so is a connection-scoped one read from an HTTP route.
- id: 24-3
  week: 24
  day: 3
  category: Syntax
  headline: 'Compute the <first-length: length> from the <first-message>.'
  explanation: Qualifier-as-name splits two jobs that used to share one word. The base is the variable
    the statement binds; the qualifier picks the operation. Without it, computing two lengths in one feature
    set would try to bind length twice, and bindings are immutable.
- id: 24-4
  week: 24
  day: 4
  category: Loops
  headline: parallel for each <url> in <urls> { Request the <page> from <url>. }
  explanation: The one construct that asks for concurrency explicitly. Completion order is non-deterministic,
    statements inside one iteration stay sequential, and bindings are immutable — so accumulate through
    a repository rather than into an outer name.
- id: 24-5
  week: 24
  day: 5
  category: DevOps
  headline: ldd ./MyApp/MyApp
  explanation: 'The Linux counterpart. One thing to expect even from a static build: Foundation is linked
    dynamically there, so it shows up. If the static Swift runtime is missing from the toolchain the build
    warns on stderr and links dynamically instead of failing, so read that warning.'
- id: 24-6
  week: 24
  day: 6
  category: Operators
  headline: 'Return an <OK: status> for the <request> when <required-roles> subset of <user-roles>.'
  explanation: 'subset of asks a question rather than producing a collection, so it is a condition operator
    and not a Compute qualifier. Set semantics apply: a duplicate on the left does not make a new member,
    and the empty set is a subset of everything.'
- id: 24-7
  week: 24
  day: 7
  category: Expressions
  headline: Create the <flag> with <enabled> or false.
  explanation: 'and and or evaluate truthiness and yield a boolean, so or is not a fallback: a port reference
    or 8080 is true, not the port. A non-boolean literal under either is a check-time error whose message
    names default and shows the rewrite.'
- id: 25-1
  week: 25
  day: 1
  category: Date
  headline: 'Log "dst ${<berlin: dst>}" to the <console>.'
  explanation: A named zone carries its own history, so the same zone is +01:00 in January and +02:00
    in July and a rendering says whether daylight saving was in force. A fixed offset stored in a config
    file gets one of those two halves of the year wrong, quietly.
- id: 25-2
  week: 25
  day: 2
  category: Errors
  headline: 'Log "processed 1000 records" to the <console: error>.'
  explanation: '`Log` writes to stdout by default and to stderr under the `error` qualifier. In a program
    whose stdout carries data, progress and warnings belong on the other stream so the output stays machine-readable.'
- id: 25-3
  week: 25
  day: 3
  category: Lifecycle
  headline: Stop the <http-server> with <application>.
  explanation: Start, Stop, Listen, Connect, Close and Keepalive are the SERVER role — service lifecycle,
    ordered against everything else by definition. None of them defer, so they happen where they are written.
- id: 25-4
  week: 25
  day: 4
  category: Scoping
  headline: Create the <_internal> with "first".
  explanation: A name starting with an underscore is framework-internal and exempt from the immutability
    check, which is how the runtime keeps its per-statement bookkeeping out of your way. User code should
    not use them, so every name you write is one you can bind only once.
- id: 25-5
  week: 25
  day: 5
  category: Match
  headline: match <method> { case "GET" { Retrieve the <resource> from the <database>. } case "POST" {
    Create the <resource> with <data>. } }
  explanation: Matches nest, and a case body is an ordinary statement list. Routing by method belongs
    inside a handler that serves several verbs — contract-first dispatch by `operationId` already separates
    them otherwise.
- id: 25-6
  week: 25
  day: 6
  category: Sockets
  headline: Send the <received-data> to the <client>.
  explanation: Sending to a connection that has gone away raises rather than reporting a success nobody
    can check. Broadcast to the socket server is the other half — one statement to every connected client,
    which is what makes a push from an HTTP route two lines.
- id: 25-7
  week: 25
  day: 7
  category: Testing
  headline: aro test ./MyApp --filter upper
  explanation: The filter is a case-insensitive substring match on the feature-set name, not a glob and
    not a regular expression. So --filter upper runs uppercase-simple and uppercase-mixed, and there is
    no pattern syntax to get wrong.
- id: 26-1
  week: 26
  day: 1
  category: REPL
  headline: ARO_REPL_PLUGINS_DIR=~/.aro/repl-plugins
  explanation: Where a REPL session looks for plugins, since a session has no application directory of
    its own to read a Plugins folder from. Both the terminal REPL and the JSON server load from it, so
    a qualifier you can call in one works in the other.
- id: 26-2
  week: 26
  day: 2
  category: Actions
  headline: 'Compute the <total: fixed> from <raw>.'
  explanation: '`fixed` rounds to two decimal places unless told otherwise, which is the shape money wants.
    `sum`, `avg`, `unique` and `random` are the collection side; `trim`, `replace`, `uppercase` and `html-escape`
    the text side.'
- id: 26-3
  week: 26
  day: 3
  category: Plugins
  headline: aro plugins rebuild
  explanation: 'Recompiles native plugins from source. This is the counterpart to the listing not building:
    after pulling a plugin''s new version, or after changing your own plugin''s code, this is the step
    that produces the library the runtime will load.'
- id: 26-4
  week: 26
  day: 4
  category: Compiler
  headline: aro build ./MyApp --release
  explanation: 'Sugar for --optimize --size --strip together. Worth knowing what that combination means:
    size wins over speed at the link step, so a release build links at -Os rather than -O2. Reach for
    --optimize alone when you want the faster one.'
- id: 26-5
  week: 26
  day: 5
  category: Concurrency
  headline: 'Configure the <http-client: rate> with "10/s".'
  explanation: The rate is a token bucket that refills continuously, not a fixed window — a window would
    let ten requests through at 0:59 and ten more at 1:01. Units are seconds, minutes and hours with their
    usual spellings, and a multiplier is allowed, so 5/2s parses.
- id: 26-6
  week: 26
  day: 6
  category: Tooling
  headline: aro ask --stats "add pagination to listUsers"
  explanation: Prints what the run cost and what the harness had to correct — turns, tool calls, and only
    when non-zero the failures, retries and repairs. It goes to stderr, so a pipeline reading the answer
    does not have to strip a bill off the end of it.
- id: 26-7
  week: 26
  day: 7
  category: Data
  headline: Filter the <remaining> from <items> where <value> not in <exclude-list>.
  explanation: in and not in take a collection on the right, so an exclusion list is a binding rather
    than a chain of comparisons. when and where accept the same operator set, so a predicate that filters
    a collection also guards a statement unchanged.
- id: 27-1
  week: 27
  day: 1
  category: HTTP
  headline: 'Extract the <text> from the <note: text>.'
  explanation: Reading a field out of a body is what turns it into a value, and the value is what the
    route's limit bounds. Log, Store, Compute, Validate and a when guard do the same, and so does a plain
    Create that copies the body. Anything the analysis cannot see through, such as a plugin action, counts
    as reading.
- id: 27-2
  week: 27
  day: 2
  category: Files
  headline: 'Configure the <mode> for the <file: "./run.sh"> with { permissions: "755" }.'
  explanation: Setting permissions binds a record of path, permissions, octal and previous, so the change
    is auditable in the same statement that makes it. Octal and the symbolic form Stat prints are both
    accepted, which means a mode read off one file applies unchanged to another.
- id: 27-3
  week: 27
  day: 3
  category: Control
  headline: Log "hit" to the <console> when <name> matches "^a.c".
  explanation: '`matches` is a regular-expression test, so `^a.c` accepts `axc` as readily as `abc`. The
    dot is a metacharacter whether or not you meant it that way, which is why a literal prefix or suffix
    is better said with the affix operators than with an anchored pattern.'
- id: 27-4
  week: 27
  day: 4
  category: Repositories
  headline: Store the <item> into the <cart-repository>.
  explanation: The same statement is correct over HTTP, WebSocket and TCP; what differs is who the caller
    is, and each transport answers that its own way. Touching a session-scoped repository where no session
    exists is an error — never an empty repository, and never a silent fall back to the application-wide
    one.
- id: 27-5
  week: 27
  day: 5
  category: Syntax
  headline: 'Compute the <slug: lowercase|trim> from the <title>.'
  explanation: Qualifiers chain with a vertical bar, applied left to right. The namespace is closed —
    a qualifier must resolve to a built-in, a plugin qualifier under its handle, a chain of those, or
    a date offset. An invented name is an error naming the closest match.
- id: 27-6
  week: 27
  day: 6
  category: Loops
  headline: 'parallel for each <url> in <urls> with <concurrency: 8> { Request the <page> from <url>.
    }'
  explanation: Left unbounded the default is min(item count, max(4, cores × 4)) rather than one task per
    item. When the cost of an iteration is dominated by an external service, set the bound to that service's
    tolerance instead of the machine's.
- id: 27-7
  week: 27
  day: 7
  category: DevOps
  headline: swift test --filter ActionRoleParityTests
  explanation: The interpreter and the compiled binary each keep their own copy of the action catalogue,
    and the copies have drifted into a user-visible bug more than once. This test fails when they disagree,
    which is why adding an action means touching both.
- id: 28-1
  week: 28
  day: 1
  category: Operators
  headline: Filter the <overdue> from the <invoices> where <due> before <now>.
  explanation: 'A where clause takes the condition operators a when guard takes: in, not in, starts with,
    ends with, contains, matches, before and after all read the same in both places. A predicate that
    filters a collection therefore also guards a statement.'
- id: 28-2
  week: 28
  day: 2
  category: Expressions
  headline: 'Compute the <parts: captures> from <line> by /(?<k>\w+)=(?<v>.*)/.'
  explanation: Named groups arrive under their names, numbered ones under 1, 2, and the whole match under
    match. A non-match binds an empty record rather than failing - the same answer a Retrieve gives when
    nothing matches.
- id: 28-3
  week: 28
  day: 3
  category: Date
  headline: 'Create the <vacation: date-range> from <start-date> to <end-date>.'
  explanation: A range is a value, so its span is read off it — days, hours — rather than recomputed from
    the endpoints at each use. Membership is the in operator and includes both endpoints, and the last
    seven days is the same value built from an offset and <now>.
- id: 28-4
  week: 28
  day: 4
  category: Errors
  headline: Retrieve the <rows> from the <report-repository>.
  explanation: 'A statement nobody reads still runs, and its failure is still reported: anything outstanding
    is forced at feature-set exit. The message names the statement that caused the failure, not the line
    where it surfaced.'
- id: 28-5
  week: 28
  day: 5
  category: Lifecycle
  headline: '(Application-Start: Crawler takes <url> <depth>)'
  explanation: '`takes` declares the positional arguments, so `./crawler https://example.com 3` works
    rather than only the flag spelling. A flag of the same name wins. The trap predates positionals: `--key
    value` consumes the next token, so write `--verbose=true`, or `--`, to mean two things.'
- id: 28-6
  week: 28
  day: 6
  category: Actions
  headline: Compute the <n> as Float from <s>.
  explanation: 'A result type uses `as`, because the qualifier slot is already taken: it selects an operation.
    Two other things are mistaken for qualifiers and are actions — `Sort the <s> for the <x>.` and `Reverse
    the <r> for the <x>.`'
- id: 28-7
  week: 28
  day: 7
  category: Plugins
  headline: aro plugins export
  explanation: Writes .aro-sources, one Git URL and optional ref per line, for every plugin that came
    from a repository. aro plugins restore reads it back and installs them, skipping anything already
    present — which is how a checkout without vendored plugins gets its dependencies.
- id: 29-1
  week: 29
  day: 1
  category: Compiler
  headline: aro build ./MyApp --optimize
  explanation: Raises the object-emission level and adds thin link-time optimisation. It is the flag to
    use for a binary you care about the speed of; --release also turns on size optimisation and stripping,
    which is a different trade.
- id: 29-2
  week: 29
  day: 2
  category: Concurrency
  headline: 'parallel for each <page> in <pages> with <concurrency: 6> {'
  explanation: 'Clause order in the header is fixed: the concurrency modifier comes before any where filter.
    N has to be an integer literal, so a variable in that slot does not parse. Leave the clause off and
    the loop uses the item count or four times the core count, whichever is smaller.'
- id: 29-3
  week: 29
  day: 3
  category: Tooling
  headline: aro ask --yes /fix ./MyApp/main.aro
  explanation: Every tool call that writes a file or runs a command asks for approval first; --yes approves
    them all for the session and is the documented route for non-interactive use. Paths are confined to
    the working directory, with the shell tool as the deliberate exception.
- id: 29-4
  week: 29
  day: 4
  category: Data
  headline: Filter the <failures> from the <log-rows> where <level> is "FATAL".
  explanation: At ten thousand records or more, Filter binds a stream rather than an array, so the next
    stage sees rows as they are produced instead of after a full intermediate copy. A list of plain strings
    takes the eager path instead, where the copy costs little.
- id: 29-5
  week: 29
  day: 5
  category: HTTP
  headline: 'Compute the <digest: sha256> from <payload>.'
  explanation: The folding qualifiers — sha256, hash, length, count, size, lines — consume a body chunk
    by chunk, so hashing a four-gigabyte upload costs a chunk as well. A chain folds only if every step
    does, so lines then length still streams while lines then uppercase does not.
- id: 29-6
  week: 29
  day: 6
  category: Files
  headline: 'Touch the <marker> for the <file: "./build-stamp.txt">.'
  explanation: Touch creates the file when it is absent and stamps it when it is there, and the result
    says which by binding created. A build marker or a lock file is therefore one statement, with no check-then-create
    window between two of them.
- id: 29-7
  week: 29
  day: 7
  category: Control
  headline: when <booking-date> before <deadline> { Store the <booking> into the <booking-repository>.
    }
  explanation: '`when` also takes a block, which is the suffix guard said once instead of once per statement.
    The block groups statements; it does not open a scope, so what it binds stays visible afterwards,
    and a `Return` inside it ends the feature set.'
- id: 30-1
  week: 30
  day: 1
  category: Repositories
  headline: 'Store the <first-order> into the <order-repository> with { id: "1", status: "open" }.'
  explanation: Store takes into or to and nothing else, so the English-sounding "in the repository" does
    not parse. The object after with is the row, and a list stores one row per element rather than one
    row holding a list.
- id: 30-2
  week: 30
  day: 2
  category: Syntax
  headline: '(getUser: User API) {'
  explanation: A feature set header is a name and a business activity. The name matches an operationId
    in openapi.yaml, which is how a route finds its handler. The activity is the scope that published
    variables travel in. No decorator, no registration call.
- id: 30-3
  week: 30
  day: 3
  category: Loops
  headline: for <n> from 1 to 10 { Log <n> to the <console>. }
  explanation: 'The range loop counts and its upper bound is exclusive: this binds 1 through 9. An inverted
    range is reported as an error naming both bounds, because a range that counts down is a mistake in
    the program every time.'
- id: 30-4
  week: 30
  day: 4
  category: DevOps
  headline: swift test --filter FrameworkVariableParityTests
  explanation: Statement modifiers — a with clause, a by pattern, a where field — live in framework variables
    that must be cleared between statements. The interpreter gives each statement its own scope and the
    compiler clears a list; this test is what keeps the two lists the same.
- id: 30-5
  week: 30
  day: 5
  category: Operators
  headline: 'Return an <OK: status> for the <check> when <user: email> exists.'
  explanation: exists tests presence, and is null, is empty and is not empty are its companions. They
    are checks rather than comparisons — nothing is being compared against a sentinel. A field that is
    missing and one explicitly set to null are both absent.
- id: 30-6
  week: 30
  day: 6
  category: Expressions
  headline: 'Compute the <parts: url-parts> from <link>.'
  explanation: Binds scheme, host, port, path, query and fragment as a record. The URL qualifiers are
    a family - url-encode, url-decode, url-resolve, url-defragment - so a crawler assembles and normalises
    addresses without a regex.
- id: 30-7
  week: 30
  day: 7
  category: Date
  headline: 'Create the <standup: recurrence> with "every monday".'
  explanation: A recurrence is written the way somebody would say it — every day, every 2 weeks, every
    monday, every last friday — and the next occurrence is extracted from it. The pattern is a value the
    program can hold, not a cron string handed to a scheduler.
- id: 31-1
  week: 31
  day: 1
  category: Actions
  headline: 'Map the <emails: email> from the <users>.'
  explanation: 'Map takes a field name, not an expression: this and `Map the <emails> from the <users>
    with email.` are the same statement. There is no per-element binding to compute against, so use `for
    each` when you need one.'
- id: 31-2
  week: 31
  day: 2
  category: Plugins
  headline: aro plugins check
  explanation: Verifies installed plugins against plugins.lock, the YAML file that records each plugin's
    name, version, repository, ref and resolved commit. The commit is what makes an install reproducible;
    aro add and aro plugins update are what write it.
- id: 31-3
  week: 31
  day: 3
  category: Compiler
  headline: aro build ./MyApp --size
  explanation: 'Optimises for size instead of speed, and also turns on dead-stripping. The saving happens
    at the link step: the object-emission stage stays at -O2 because the tool that emits it only understands
    -O0 through -O3, with no size level among them.'
- id: 31-4
  week: 31
  day: 4
  category: Concurrency
  headline: parallel for each <number> in <numbers> {
  explanation: Iterations run concurrently and finish in no particular order, in the interpreter and in
    a compiled binary alike. A parallel loop always materialises its collection first — concurrent iteration
    has nothing to pull a stream with — so a streamed source is read into memory here.
- id: 31-5
  week: 31
  day: 5
  category: Tooling
  headline: aro ask /clean
  explanation: The conversation is persisted to a .context YAML file in the current working directory,
    so a session survives closing the terminal. Treat it like shell history — it records whatever was
    in the files the model read — and /clean deletes it.
- id: 31-6
  week: 31
  day: 6
  category: Data
  headline: 'Compute the <first: captures> from the <line> by /(?<key>\w+)=(?<value>\S+)/.'
  explanation: captures binds the first match as a record of its groups — named ones under their names,
    numbered ones under "1", "2", and the whole match under match. It is the difference between the parts
    around a delimiter, which Split gives, and the parts of the match itself.
- id: 31-7
  week: 31
  day: 7
  category: HTTP
  headline: 'Emit a <DocumentReceived: event> with <upload>.'
  explanation: A handler outlives the request that triggered it, so emitting a body anchors it — drained
    to a temporary file one chunk at a time, readable afterwards by every handler, and deleted when the
    last reference goes. Memory stays at one chunk; the cost moves to disk.
- id: 32-1
  week: 32
  day: 1
  category: Files
  headline: 'Stat the <info> for the <file: "./config.yaml">.'
  explanation: Stat reads a file's metadata into a record — size, dates and permissions among them — and
    permissions come back in the symbolic form that Configure accepts. Asking about a file is a different
    action from reading it, so nothing about the contents is loaded.
- id: 32-2
  week: 32
  day: 2
  category: Control
  headline: 'Compute the <n: length> from <text> |> Log <n> to the <console>.'
  explanation: '`|>` marks a run of statements as one data flow. Each stage is a complete statement naming
    its own result and object: the operator records intent and groups the statements, it does not thread
    a value from one stage into the next.'
- id: 32-3
  week: 32
  day: 3
  category: Repositories
  headline: Retrieve the <widget> from the <products-repository> where <id> is "p1".
  explanation: What comes back depends on how many rows matched — none binds an empty list, exactly one
    binds that record, several bind a list. A Retrieve that matches nothing does not fail, so a handler
    that assumes a record needs a guard rather than an error handler.
- id: 32-4
  week: 32
  day: 4
  category: Syntax
  headline: '(Break Room Booking: Env Require)'
  explanation: Between the parentheses an author names their own domain, so the language reserves nothing
    there. Break, Require and Each all begin statements elsewhere and stay ordinary words in a header,
    because no statement can start inside one.
- id: 32-5
  week: 32
  day: 5
  category: Loops
  headline: while <done> == false { Break. }
  explanation: '`while` repeats until its condition goes false. Bindings are immutable, so the condition
    changes because the body rebinds a name in a new scope, or the loop is left with `Break.` — which
    is why a while loop in ARO usually reads as a search rather than as a counter.'
- id: 32-6
  week: 32
  day: 6
  category: DevOps
  headline: Tag the <release> for the <git> with "v1.0.0".
  explanation: Version control is native through libgit2 rather than shelling out. The bare git object
    discovers the enclosing repository upward from the working directory, exactly as the CLI does, and
    every git action emits an event.
- id: 32-7
  week: 32
  day: 7
  category: Operators
  headline: 'Return an <OK: status> for the <page> when <path> starts with "/api".'
  explanation: 'The affix operators are literal, which is the point of having them - matches with a caret-anchored
    pattern would also accept a near miss. `starts` and `ends` are not reserved: only a following `with`,
    in operator position, makes them operators.'
- id: 33-1
  week: 33
  day: 1
  category: Actions
  headline: Filter the <adults> from the <people> where <age> >= 18.
  explanation: Filter selects, Map projects, Group partitions, Reduce collapses. Each takes its collection
    through `from` and says what to do with it in its own clause, so a pipeline reads as four sentences
    rather than one nested expression.
- id: 33-2
  week: 33
  day: 2
  category: Plugins
  headline: 'handle: Collections'
  explanation: The root-level handle in plugin.yaml is the canonical way to declare a namespace, and PascalCase
    is the convention. Qualifiers are then reached as Collections.pick-random and actions as Collections.Verb.
    Lookup is case-insensitive, so the lowercase spelling in a statement resolves to the same thing.
- id: 33-3
  week: 33
  day: 3
  category: Compiler
  headline: aro build ./MyApp --strip
  explanation: 'Removes symbols, at the link step and again with a separate pass afterwards, and turns
    on dead-stripping — which a plain or optimised build never does on its own. Strip after you have finished
    debugging: the DWARF that lets lldb stop on an .aro line goes with it.'
- id: 33-4
  week: 33
  day: 4
  category: Concurrency
  headline: for each <number> in <numbers> {
  explanation: The sequential loop runs one iteration at a time in source order, and yields cooperatively
    every five hundred iterations so a long loop cannot pin a core. Reach for parallel only when the iterations
    are independent; the ordering you get back is the thing you gave up.
- id: 33-5
  week: 33
  day: 5
  category: Tooling
  headline: aro ask /index
  explanation: Builds the retrieval index over the project, and prints how many chunks it made. Until
    you run it, /search has nothing to search and says so rather than returning an empty result you might
    read as an answer.
- id: 33-6
  week: 33
  day: 6
  category: Data
  headline: 'Compute the <settings: all-captures> from the <line> by /(?<key>\w+)=(?<value>\S+)/.'
  explanation: all-captures binds every match as a list of those records, which a for each loop then walks.
    A group that took part in no match is absent from its record rather than present and empty, so a guard
    on it means what it says.
- id: 33-7
  week: 33
  day: 7
  category: HTTP
  headline: 'Configure the <http-server: max-body> with "1MB".'
  explanation: This sets the default for routes that declare nothing, and ARO_MAX_BODY sets the same thing
    from the environment. KB, MB and GB are powers of 1000 and KiB, MiB and GiB powers of 1024, so the
    1 MB default is a round million bytes.
- id: 34-1
  week: 34
  day: 1
  category: Files
  headline: 'Delete the <gone> from the <file: "./build-stamp.txt">.'
  explanation: A path inside angle brackets is a quoted string, not a bare word. The unquoted spelling
    does not parse, which is the first thing to check when a file statement is rejected and the path looks
    obviously fine.
- id: 34-2
  week: 34
  day: 2
  category: Control
  headline: Require the <console> from the <framework>.
  explanation: With `framework` as the source, `Require` is a no-op that documents what the feature set
    expects the runtime to provide. Any other source names a feature set, and `aro check` warns when nothing
    publishes that symbol.
- id: 34-3
  week: 34
  day: 3
  category: Repositories
  headline: Retrieve the <hardware> from the <products-repository> where <category> is "hardware".
  explanation: A repository where clause is an equality lookup against the stored rows. Anything richer
    — a comparison, contains, a range — is a Filter over what the Retrieve returned, which keeps the storage
    question and the predicate question apart.
- id: 34-4
  week: 34
  day: 4
  category: Syntax
  headline: Log "Starting the importer." to the <console>.
  explanation: Sink syntax puts an expression where a result binding would go, for a value consumed once
    and never named. The missing article is the giveaway — Log the <message> names a binding, Log "…"
    sinks a literal. Strings, numbers, variables and literals all work.
- id: 34-5
  week: 34
  day: 5
  category: Loops
  headline: Break.
  explanation: One of four forms that are grammar rather than actions, with `Publish as`, `Require` and
    `match`. It has no role, no prepositions and no object, and it leaves the innermost loop — `for each`,
    range or `while` alike.
- id: 34-6
  week: 34
  day: 6
  category: DevOps
  headline: 'Clone the <repo> from the <git> with { url: "https://example.test/r.git", path: "./cloned"
    }.'
  explanation: An optional branch key checks that ref out at clone time. Push and Pull need the git CLI
    for their network half, while status, log, staging and committing are all in-process.
- id: 34-7
  week: 34
  day: 7
  category: Actions
  headline: Group the <by-country> from the <users> by "country".
  explanation: Group partitions a collection by a field and binds a record of key to list of items. The
    field is named as a string, which is what distinguishes it from a value to compare each element against
    — `by "status"` groups, a `where` clause would have filtered.
- id: 35-1
  week: 35
  day: 1
  category: Plugins
  headline: 'handler: collections'
  explanation: The legacy spelling, nested inside a provides entry. It still works and warns, including
    when a root-level handle is present as well. If the two name different namespaces the root-level one
    wins and the warning says so, so you can see which name your qualifiers actually got.
- id: 35-2
  week: 35
  day: 2
  category: Compiler
  headline: aro build ./MyApp --emit-llvm
  explanation: Writes the LLVM IR as text and stops there. No object file, no link, no binary, and none
    of the post-build steps run. It is the way to see what a feature set actually compiles to without
    waiting for a link you are going to throw away.
- id: 35-3
  week: 35
  day: 3
  category: Concurrency
  headline: ARO_CONCURRENCY=8
  explanation: 'The application-wide ceiling, without editing the source. It is a FIFO gate: when it is
    saturated the next unit of work waits and is admitted in arrival order. Lowering it mid-run never
    revokes a slot already granted; the count drains to the new limit as work finishes.'
- id: 35-4
  week: 35
  day: 4
  category: Tooling
  headline: aro ask --file ./MyApp/users.aro
  explanation: 'Marks one file as the open file: its current content is injected into every request, so
    the model does not have to spend a tool call re-reading what you are looking at. In the REPL, /file
    changes it without restarting the session.'
- id: 35-5
  week: 35
  day: 5
  category: Data
  headline: 'Compute the <absent: captures> from the <line> by /(?<scheme>https?):/.'
  explanation: A pattern that matches nothing binds an empty record — an empty list for all-captures —
    rather than failing the statement. It is the same call ARO makes for a Retrieve that matches nothing,
    so the program guards on the result instead of handling an error.
- id: 35-6
  week: 35
  day: 6
  category: HTTP
  headline: aro check ./FileUpload
  explanation: Whether a route streams its body or holds it is computed from the source before a port
    is bound, and the check prints the verdict per route — which statement made a route hold its body,
    and how much it may hold. A declared limit on a streaming route is reported as unused rather than
    silently ignored.
- id: 35-7
  week: 35
  day: 7
  category: Files
  headline: Write the <users> to "./output/users.csv".
  explanation: The extension picks the format. A list of records becomes CSV with a header row, and the
    same value written to .json, .jsonl, .yaml, .tsv, .md, .xml, .toml, .sql or .html comes out in that
    shape instead. Nothing in the statement names a serialiser.
- id: 36-1
  week: 36
  day: 1
  category: Control
  headline: 'Create the <config> with { currency: "EUR" }. Publish as <user-config> <config>.'
  explanation: '`Publish as` exposes a binding to feature sets that share its business activity — the
    file it lives in is irrelevant, the activity string is what matters. Publications are evicted when
    the publishing execution returns; those from `Application-Start` live for the process.'
- id: 36-2
  week: 36
  day: 2
  category: Repositories
  headline: Delete the <purged> from the <order-repository> where <status> is "cancelled".
  explanation: A delete is something to report on, so the statement binds count, deleted, target and success.
    deleted is always a list, including for a single match, and a delete that matched nothing is distinguishable
    by its count rather than by an absence.
- id: 36-3
  week: 36
  day: 3
  category: Syntax
  headline: Compare the <same-size> from the <left-count> against the <right-count>.
  explanation: 'Compare reads both operands and binds a fresh third name. <same-size: matches> is the
    boolean; <same-size: result> spells the outcome out. Both operands stay bound afterwards, which is
    the only shape immutability allows.'
- id: 36-4
  week: 36
  day: 4
  category: Loops
  headline: ARO_CONCURRENCY=8 aro run ./Crawler
  explanation: 'An application-wide ceiling counts units of work not already running inside one: every
    triggered feature set and every parallel iteration. At the ceiling work waits for a slot in arrival
    order — it queues, it is never rejected.'
- id: 36-5
  week: 36
  day: 5
  category: Actions
  headline: Reduce the <revenue> from <rows> with sum(<line_total>).
  explanation: 'Reduce takes an aggregation call rather than a qualifier: `sum(<field>)`, `avg(<field>)`,
    `min(<field>)`, `max(<field>)`, or `count()` with no argument at all. The parentheses are part of
    the syntax.'
- id: 36-6
  week: 36
  day: 6
  category: Plugins
  headline: '  - type: swift-plugin'
  explanation: 'A provides entry says what kind of thing a directory holds and where it is. Seven types
    are recognised: swift-plugin, rust-plugin, c-plugin, cpp-plugin, python-plugin, aro-files and aro-templates.
    One plugin may list several, so native code and plain .aro feature sets can ship together.'
- id: 36-7
  week: 36
  day: 7
  category: Compiler
  headline: aro build ./MyApp --keep-intermediate
  explanation: The .ll and .o are written on every build; this flag only stops them being deleted afterwards.
    Keep them when you are debugging the compiler itself, or when you want the object file that a symbolicated
    stack trace on macOS needs to resolve.
- id: 37-1
  week: 37
  day: 1
  category: Concurrency
  headline: ARO_HTTP_CONCURRENCY=8
  explanation: How many outbound HTTP requests may be in flight at once, eight by default. It is a separate
    gate from the application ceiling, so a handler already holding an application slot still queues here.
    Configure the http-client category from ARO source to set the same number.
- id: 37-2
  week: 37
  day: 2
  category: Tooling
  headline: aro debug ./Examples/HelloWorld
  explanation: 'Pauses at every statement and takes a small command set on stdin: step, continue, b for
    a breakpoint on a line number or on any statement using a given verb, p to print the symbol table,
    bt for where you are. It runs through the interpreter, the same path as aro run.'
- id: 37-3
  week: 37
  day: 3
  category: Data
  headline: Split the <fields> from the <csv-line> by /,/.
  explanation: The delimiter is a regular expression between slashes and it follows by, never with — writing
    with is a check-time error that says so. Adjacent and trailing delimiters produce empty elements,
    and a pattern that matches nothing returns the whole string as one element.
- id: 37-4
  week: 37
  day: 4
  category: HTTP
  headline: 'Extract the <name> from the <pathParameters: name>.'
  explanation: A path parameter declared in the contract arrives under pathParameters, named exactly as
    the contract names it. Nothing in the feature set declares the route or the segment — the contract
    did that, and the handler is named after its operationId.
- id: 37-5
  week: 37
  day: 5
  category: Files
  headline: Read the <users> from "./output/users.csv".
  explanation: Reading is the mirror image — a CSV, JSON, YAML or .env file arrives as records, so the
    pipeline that follows does not care which it was. A path may be written as a plain string here, without
    the angle-bracket file form.
- id: 37-6
  week: 37
  day: 6
  category: Control
  headline: 'Extract the <mode> from the <parameter: mode> default "fast".'
  explanation: '`default` supplies a value only when the source is unset. An empty string somebody actually
    wrote is a value and wins, the same rule the `default` operator follows for `false` and `0`. Without
    the clause an unset variable still binds an empty string.'
- id: 37-7
  week: 37
  day: 7
  category: Repositories
  headline: Delete the <cleared> from the <order-repository>.
  explanation: With no where clause the repository is emptied, and count is what it held. One Delete carries
    exactly one predicate — chaining conditions is refused at check time, with the hint that one statement
    per predicate is the spelling.
- id: 38-1
  week: 38
  day: 1
  category: Syntax
  headline: 'Compute the <safe: html-escape> from <input>.'
  explanation: A template whose path ends .html escapes what it prints; .tpl, .txt and .md do not. So
    a .tpl emitting HTML still needs this, and escaping an already-escaping template is how a reader ends
    up seeing &amp;lt;.
- id: 38-2
  week: 38
  day: 2
  category: Actions
  headline: Sort the <ranked> from the <scores> by <value> descending.
  explanation: '`by` names the field to order on and `descending` reverses it. Sorting is an action rather
    than a Compute qualifier, and so is reversing — the diagnostic for the qualifier spelling points at
    both.'
- id: 38-3
  week: 38
  day: 3
  category: Plugins
  headline: 'name: plugin-c-hash'
  explanation: 'Plugin names are lowercase kebab-case, starting with a letter and ending with a letter
    or digit. The name is also the fallback namespace: a qualifier plugin that declares no handle answers
    to its own plugin name, which is why declaring one is worth the line.'
- id: 38-4
  week: 38
  day: 4
  category: Compiler
  headline: aro build ./MyApp --verbose
  explanation: Prints each stage as it runs and raises the log level for the whole process, not only the
    progress lines. It is what tells you which runtime archive was found, which plugins were compiled
    in, and how many test feature sets were stripped.
- id: 38-5
  week: 38
  day: 5
  category: Concurrency
  headline: ARO_HTTP_RATE=10/s
  explanation: An outbound request rate for the whole application. The rate is checked before the concurrency
    gate, so a request waits for a token first and for a slot second. Only second, minute and hour units
    parse; 10/day is not a rate specification the runtime accepts.
- id: 38-6
  week: 38
  day: 6
  category: Tooling
  headline: aro check ./MyApp
  explanation: Parses and analyses without running anything. It reports unknown Compute qualifiers as
    errors, unreachable code after a Return, a Require whose source nothing publishes, and a user-defined
    action whose every path calls itself before it can return.
- id: 38-7
  week: 38
  day: 7
  category: Data
  headline: 'Retrieve the <latest> from the <user-repository: last>.'
  explanation: The element-access qualifiers work on the repository itself, so the newest row does not
    need a Retrieve of everything followed by an access. first and last read as they say, and numeric
    indices count from the end.
- id: 39-1
  week: 39
  day: 1
  category: HTTP
  headline: 'Return a <Created: status> with <name>.'
  explanation: The status name carries the code and the value after with becomes the body, encoded as
    the contract says. A body that is still a stream is written out chunk by chunk with chunked transfer
    encoding and no Content-Length, so echoing a large upload back does not hold it.
- id: 39-2
  week: 39
  day: 2
  category: Files
  headline: 'Read the <boot-text: raw> from "./logs/boot.txt".'
  explanation: The raw qualifier opts out of format detection and hands back the file's characters whatever
    the name says. Resolution runs raw first, then an explicit format qualifier, then the extension, so
    the statement always says plainly which of the three decided.
- id: 39-3
  week: 39
  day: 3
  category: Control
  headline: Filter the <excluded> from <items> where <value> not in <exclude-list>.
  explanation: '`where` filters a collection, `when` guards a statement. Inside a filter the names are
    fields of each element rather than outer bindings, which is why the predicate reads like a sentence
    about one item.'
- id: 39-4
  week: 39
  day: 4
  category: Repositories
  headline: 'Extract the <change> from the <event: changeType>.'
  explanation: A repository event carries repositoryName, changeType of created, updated or deleted, entityId,
    newValue, oldValue and timestamp — so an observer can tell an edit from an insert and see both sides
    of it. Storing a list raises one event per element, not one for the list.
- id: 39-5
  week: 39
  day: 5
  category: Actions
  headline: Split the <parts> from the <line> by /,/.
  explanation: The delimiter is a regular expression in the `/pattern/flags` form that `match`'s regex
    cases also take. Splitting on a literal comma still writes it as a pattern, which keeps one spelling
    for both jobs.
- id: 39-6
  week: 39
  day: 6
  category: Plugins
  headline: Plugins/my-plugin/plugin.yaml
  explanation: Plugins/ with a capital P is the directory, and each plugin is one subdirectory with a
    manifest in it. Discovery goes exactly one level deep; a subdirectory without a plugin.yaml is skipped
    with a warning rather than guessed at. A lowercase plugins/ is still read, and warns.
- id: 39-7
  week: 39
  day: 7
  category: Compiler
  headline: aro build ./MyApp --sign '-'
  explanation: 'Signs the finished binary ad-hoc, which is enough to satisfy macOS on the machine that
    built it. Signing is deliberately the last step that touches the file: anything that rewrites bytes
    afterwards invalidates the signature, and Gatekeeper reports an invalid signature as damaged.'
- id: 40-1
  week: 40
  day: 1
  category: Concurrency
  headline: Store the <user> to the <user-repository>.
  explanation: 'Store is never deferred: it changes state another statement can observe. By default it
    also awaits its repository observers, so the statement after it runs in the world the observers left
    behind rather than racing them.'
- id: 40-2
  week: 40
  day: 2
  category: Tooling
  headline: aro check -r ./Apps
  explanation: A directory of applications is not an application. Without -r, a path holding several Application-Start
    feature sets in different subdirectories is an error naming one to point at instead — the same answer
    run and build give. With it, each is checked separately.
- id: 40-3
  week: 40
  day: 3
  category: Data
  headline: 'Extract the <newest: 0> from the <entries>.'
  explanation: A numeric index counts from the end — 0 is the last element, 1 the one before it. An index
    past the end fails the statement and names the index and the length, rather than quietly handing back
    the whole list.
- id: 40-4
  week: 40
  day: 4
  category: HTTP
  headline: Request the <response> from the <api-url>.
  explanation: The preposition picks the method — from is a GET, to is a POST — so the common calls need
    no configuration at all. A method key inside the config object overrides the preposition when the
    verb and the intent differ.
- id: 40-5
  week: 40
  day: 5
  category: Files
  headline: 'Read the <payload: json> from "./data/payload.txt".'
  explanation: An explicit format qualifier overrides what the extension suggests, which is how a file
    that carries JSON under some other name is still read as JSON. The same qualifier works on Write,
    for a file that must keep a name its format does not match.
- id: 40-6
  week: 40
  day: 6
  category: Control
  headline: Retrieve the <user> from the <user-repository> where <id> is <id>.
  explanation: A `where` on a retrieval selects rows. Matching exactly one row binds that record directly
    rather than a one-element list; matching several binds the list. The shape follows the data, so read
    the result before assuming which you have.
- id: 40-7
  week: 40
  day: 7
  category: Repositories
  headline: Retrieve the <products> from the <products-repository>.
  explanation: A file named products.store beside the source seeds products-repository with its YAML contents,
    before Application-Start runs. The repository's name is the file's stem plus -repository, spelled
    exactly as the file is, and seed data therefore lives in data rather than in a run of Store statements.
- id: 41-1
  week: 41
  day: 1
  category: Actions
  headline: Merge the <settings> from the <defaults> with <overrides>.
  explanation: Merge binds a new variable rather than modifying either input, which is the shape every
    OWN action takes. Bindings are immutable, so combining two things always produces a third name — and
    the two originals are still readable afterwards, which is often the point.
- id: 41-2
  week: 41
  day: 2
  category: Plugins
  headline: '@AROExport'
  explanation: The whole of a Swift plugin's registration, put on the plugin value itself. The macro emits
    the C entry point that forces the value to initialise, and the SDK supplies the rest of the ABI. Actions,
    qualifiers and services are added to the value with a builder chain.
- id: 41-3
  week: 41
  day: 3
  category: Compiler
  headline: 'aro build ./MyApp --sign "Apple Development: Jane Doe (AB12CD34)" --hardened-runtime'
  explanation: A real identity plus the hardened runtime, which is the combination anything destined for
    distribution needs. The two flags are independent, so asking for a signature does not turn the hardened
    runtime on for you — pass both. Both exist on macOS only.
- id: 41-4
  week: 41
  day: 4
  category: Concurrency
  headline: ARO_ASYNC_OBSERVERS=1
  explanation: Makes Store publish its repository-change event through a bounded worker pool instead of
    awaiting the whole observer chain, which frees the storing handler's locals immediately. Off by default,
    because it changes store then observer side effect then next statement ordering. Only 1, true or yes
    enable it.
- id: 41-5
  week: 41
  day: 5
  category: Tooling
  headline: aro check ./Examples/FileUpload
  explanation: For an application with a contract, the report ends with one line per route saying whether
    it streams its request body or holds it in memory, and under what limit. The verb that reads the body
    is named, so you can see which statement turned a stream into a value.
- id: 41-6
  week: 41
  day: 6
  category: Data
  headline: 'Extract the <recent: 0-2> from the <entries>.'
  explanation: A range is inclusive and counts from the end, and the elements come back in that same order
    — newest first. Picks work the same way, so 0,2,4 returns three elements in the order the indices
    were written. Reverse puts a result back into source order.
- id: 41-7
  week: 41
  day: 7
  category: HTTP
  headline: 'Request the <created> to the <endpoint> with { body: <payload>, timeout: 10 }.'
  explanation: Headers, body, method and timeout travel in one object, and the timeout is seconds for
    this request rather than a setting somewhere else. Left out, a request gives up after thirty seconds.
    The answer is a record, so nothing is thrown when the status is not a success.
- id: 42-1
  week: 42
  day: 1
  category: Files
  headline: Start the <file-monitor> with ".".
  explanation: One statement starts watching a directory, and the events arrive at feature sets whose
    business activity is File Event Handler. Which event a handler takes is read from its name — created,
    modified or deleted — and a name carrying none of the three receives all of them.
- id: 42-2
  week: 42
  day: 2
  category: Control
  headline: Read the <content> from "./big.csv".
  explanation: A statement's action starts where it is written, and the program waits for it at the first
    read of its result. A later statement that needs nothing from this one runs alongside it, so a feature
    set costs its critical path rather than the sum of its statements.
- id: 42-3
  week: 42
  day: 3
  category: Repositories
  headline: Commit the <saved> to the <orders-repository>.
  explanation: Writable stores are written a second after a change by default, which is a second in which
    a kill loses it. Commit writes now and waits, and binds which repositories were written and how many
    rows went. A Commit to a repository no writable store backs is an error rather than a quiet success.
- id: 42-4
  week: 42
  day: 4
  category: Actions
  headline: Store the <user> into the <user-repository>.
  explanation: 'A repository is identified by name alone and is application-global: every feature set
    naming `user-repository` reads and writes the same storage. A single operation is atomic with respect
    to the others; nothing larger is.'
- id: 42-5
  week: 42
  day: 5
  category: Plugins
  headline: '.library(name: "HelloPlugin", type: .dynamic, targets: ["HelloPlugin"])'
  explanation: A Swift plugin's package must declare a dynamic library. Leave the type off and SwiftPM
    builds a static one, which the runtime cannot load — and the failure arrives at plugin-load time,
    not at build time, so it is worth getting right in the manifest.
- id: 42-6
  week: 42
  day: 6
  category: Compiler
  headline: codesign -dv --verbose=4 ./MyApp/MyApp
  explanation: 'Reads back what was actually signed: the identity, the flags, and whether the hardened
    runtime is on. Worth running once after wiring signing into a release script, because a signing failure
    is reported as a warning and the build still exits successfully with an unsigned binary.'
- id: 42-7
  week: 42
  day: 7
  category: Concurrency
  headline: ARO_OBSERVER_WORKERS=8
  explanation: How many persistent workers drain the observer queue when asynchronous observer dispatch
    is on. The default is twice the core count, with a floor of four — sized so lightweight observers
    stay responsive while heavy ones cannot all run at once.
- id: 43-1
  week: 43
  day: 1
  category: Tooling
  headline: 'aro check --syntax ''Compute the <x: bogus> from <a>.'''
  explanation: Checks a bare fragment rather than a whole application — a statement, a block, or a feature-set
    body — from an argument, a file, or standard input. Useful for a REPL line or a generator that wants
    to gate one snippet without wrapping it in a feature set first.
- id: 43-2
  week: 43
  day: 2
  category: Data
  headline: 'Merge the <all-fruits: fruits> with <more-fruits>.'
  explanation: Merge names its left-hand source in the result's qualifier, which is what lets the result
    take a fresh name under immutability. Lists concatenate, strings concatenate, and objects merge with
    the right-hand side winning a conflict — the opposite of union, where the left wins.
- id: 43-3
  week: 43
  day: 3
  category: HTTP
  headline: 'Extract the <code> from the <response: status>.'
  explanation: A response is a record of body, status and headers, so the status line is read the same
    way the payload is. Checking what came back is a field access rather than a separate call, and a guard
    on it is an ordinary when clause.
- id: 43-4
  week: 43
  day: 4
  category: Files
  headline: 'Extract the <path> from the <event: path>.'
  explanation: A file event carries exactly two fields, path and kind, and the handler reads them the
    way any event field is read. The application needs a Keepalive as well, because Application-Start
    returning is otherwise the end of the program.
- id: 43-5
  week: 43
  day: 5
  category: Control
  headline: ARO_NO_DEFER=1 aro run ./MyApp
  explanation: 'Deferral is off with this set: every action runs at its own statement. It is the fastest
    way to find out whether a suspected bug is about ordering — if the behaviour changes, statement overlap
    is involved.'
- id: 43-6
  week: 43
  day: 6
  category: Repositories
  headline: 'Configure the <stores: write-back> with "manual".'
  explanation: In manual mode a mutation only marks the store dirty and Commit does the writing, which
    suits a run that rewrites the same rows repeatedly. Shutdown still flushes in both modes, because
    losing a run's work to a clean exit would be the worse default.
- id: 43-7
  week: 43
  day: 7
  category: Actions
  headline: 'Store the <ticket> into the <ticket-repository> with { id: 1, state: "new" }.'
  explanation: A trailing `with` clause supplies the record inline and binds it to the result. It is not
    one of Store's object prepositions — the object of a Store is always the repository, which is what
    makes the statement read as one sentence about where the record goes.
- id: 44-1
  week: 44
  day: 1
  category: Plugins
  headline: crate-type = ["cdylib"]
  explanation: The Rust counterpart, in Cargo.toml. The SDK's export macro generates the C entry points
    from a list of your functions, so you do not write no-mangle extern declarations by hand — and the
    qualifier entry point is only emitted when you actually declare qualifiers.
- id: 44-2
  week: 44
  day: 2
  category: Compiler
  headline: lldb ./MyApp/MyApp
  explanation: A compiled binary carries DWARF that points at the .aro files it came from, so a debugger
    stops in your source rather than in generated code. Each feature set becomes a subprogram named after
    itself, located at its real file and line.
- id: 44-3
  week: 44
  day: 3
  category: Concurrency
  headline: ARO_OBSERVER_QUEUE_CAPACITY=4096
  explanation: The ceiling on observer work items queued but not yet dispatched. When the queue is full
    the producer suspends until a slot frees, which is what keeps the queue's memory bounded. Workers
    never produce into it, so it cannot deadlock against itself.
- id: 44-4
  week: 44
  day: 4
  category: Tooling
  headline: echo 'Log "Hi" to the <console>.' | aro
  explanation: With no arguments and input on a pipe, aro evaluates what it reads through a REPL session.
    Consecutive statements are kept in one unit on purpose, so work the language may overlap still overlaps
    instead of being serialised by the splitting.
- id: 44-5
  week: 44
  day: 5
  category: Data
  headline: Sort the <ranked> from the <users> by "score".
  explanation: Sorting is an action, not a qualifier, and the direction rides on the result — a descending
    qualifier on the result name reverses it. Ascending is the default. A repository query has no order
    by clause, so sorting is this statement over what a Retrieve returned.
- id: 44-6
  week: 44
  day: 6
  category: HTTP
  headline: ARO_HTTP_PORT=9090 aro run ./UserService
  explanation: The environment wins over every other source of the port, including the contract and the
    Start statement, so one application runs twice on one machine without editing anything it ships. ARO_MAX_BODY
    overrides the default body limit the same way.
- id: 44-7
  week: 44
  day: 7
  category: Files
  headline: 'Compute the <path: path-join> from <dir> with <name>.'
  explanation: 'Path qualifiers touch no filesystem. An absolute right-hand side does not reset the path:
    joining /uploads to /etc/passwd gives /uploads/etc/passwd, deliberately unlike Python, because the
    call this exists for is joining a trusted directory to an untrusted name.'
- id: 45-1
  week: 45
  day: 1
  category: Actions
  headline: Delete the <gone> from the <order-repository> where <status> is "cancelled".
  explanation: 'The result is a record: `count`, `deleted`, `target` and `success`. `deleted` is always
    a list, even when one row matched, so no reader has to handle two shapes. Deleting with no `where`
    clears the repository and counts before it does.'
- id: 45-2
  week: 45
  day: 2
  category: Plugins
  headline: ARO_PLUGIN("plugin-c-hash", "1.0.0")
  explanation: Declares a C plugin's name and version. The namespace is a second macro, ARO_HANDLE("Hash"),
    rather than an argument here — so the first argument is the plugin name, not the handle it will be
    called through.
- id: 45-3
  week: 45
  day: 3
  category: Compiler
  headline: breakpoint set --file main.aro --line 5
  explanation: 'Debug locations are emitted per statement, not only per feature set, so a breakpoint on
    an ARO line resolves in a compiled binary on macOS and Linux alike. aro debug is the other route:
    it steps the interpreter and takes its commands on stdin.'
- id: 45-4
  week: 45
  day: 4
  category: Concurrency
  headline: 'Emit a <PageFetched: event> with { page: <page> }.'
  explanation: Emit runs at its own statement and forces the payload it reads, so a value computed immediately
    above is materialised before the event is delivered rather than somewhere downstream. The handler
    it wakes is a unit of work in its own right and counts against the application ceiling.
- id: 45-5
  week: 45
  day: 5
  category: Tooling
  headline: aro run ./MyApp --record events.json
  explanation: 'Records the run''s events to a file that --replay feeds back in, which is how an event-driven
    bug becomes reproducible. --debug-record is a different thing with a different format: per-statement
    JSONL for a live view, not a replayable recording.'
- id: 45-6
  week: 45
  day: 6
  category: Data
  headline: Filter the <mid-range> from the <products> where <price> between 10 and 100.
  explanation: A where clause takes is, is not, the comparison operators, in and not in, between and and,
    contains, starts with, ends with, and combinations with and and or. Over a list of plain values the
    field name is decorative — the element is matched as itself.
- id: 45-7
  week: 45
  day: 7
  category: HTTP
  headline: '(Handle WebSocket Message: WebSocket Event Handler)'
  explanation: WebSocket handlers are named on the same rule as socket handlers, and a connect handler
    reads connectionId, path and remoteAddress from the event while a message handler reads connectionId
    and message. The activity is checked for WebSocket first, since it contains the words Socket Event
    Handler.
- id: 46-1
  week: 46
  day: 1
  category: Actions
  headline: 'Return an <OK: status> with <users>.'
  explanation: 'Return ends the feature set: `with` carries a payload, `for` names what the status is
    about. Like every effect it never defers — it forces what it reads before it runs, which is what keeps
    observable output in source order.'
- id: 46-2
  week: 46
  day: 2
  category: Plugins
  headline: '#define ARO_PLUGIN_SDK_IMPLEMENTATION'
  explanation: The C SDK is a single header in the style that carries its own implementation, so this
    define goes above the include in exactly one translation unit. Without it you get declarations and
    no entry points, and the plugin loads as a library with nothing in it.
- id: 46-3
  week: 46
  day: 3
  category: Compiler
  headline: ARO_STATIC_PYTHON=/opt/cpython-static aro build ./MyApp
  explanation: Lets a Python plugin go into a standalone binary, by carrying the interpreter and the parts
    of the standard library the program needs. The distribution must have a real static libpython — the
    build reads the file's archive magic rather than trusting its name, because some installs ship a symlink
    to the dynamic library under that name.
- id: 46-4
  week: 46
  day: 4
  category: Concurrency
  headline: ARO_STREAM_PREFETCH=2
  explanation: 'How far a stream''s producer may run ahead of its consumer, through a bounded channel
    that suspends the producer when it is full. Two on purpose: the win is overlapping one element''s
    read and parse with the previous one''s processing, and a deeper buffer trades memory for latency
    the consumer cannot use.'
- id: 46-5
  week: 46
  day: 5
  category: Tooling
  headline: aro diff --graph main..my-branch
  explanation: 'Compares two revisions as feature graphs rather than as text: nodes are feature sets,
    wires are events, Application.<Name> calls and repository observers. Nodes are keyed by name, so a
    feature set that changed file is reported as moved rather than as a delete and an add.'
- id: 46-6
  week: 46
  day: 6
  category: Data
  headline: chmod o+w config.store
  explanation: A .store file's other-write bit decides whether the repository it seeds is written back
    to disk. It is the least commonly set bit, it shows up in ls -l, and it needs no new syntax or config
    file. Read-only means "not written back" rather than "refuses writes" — the repository still changes
    in memory.
- id: 46-7
  week: 46
  day: 7
  category: HTTP
  headline: 'Start the <http-server> with { port: 8080, websocket: "/ws" }.'
  explanation: The upgrade handler is installed only when the server's own configuration names a WebSocket
    path. Without that key the port serves ordinary HTTP, and an upgrade request is answered as the unimplemented
    route it looks like.
- id: 47-1
  week: 47
  day: 1
  category: Actions
  headline: 'Send the <welcome-email> to the <user: email>.'
  explanation: Send, Log, Write and Store run at their own statement and force their inputs first. Deferral
    is an allowlist of value-producing verbs, so an effect can never drift to wherever somebody happened
    to read its result.
- id: 47-2
  week: 47
  day: 2
  category: Plugins
  headline: ARO_ACTION("DJB2", "own", "from,with,for")
  explanation: 'Declares a C action: its name, its semantic role, and the prepositions it accepts as one
    comma-separated string. The macro registers it through a constructor, so the action list is built
    before the runtime ever asks for it.'
- id: 47-3
  week: 47
  day: 3
  category: Compiler
  headline: ARO_ALLOW_EMBEDDED_PYTHON=1 aro build ./MyApp
  explanation: Builds a Python plugin into a static binary anyway, resolving the interpreter and standard
    library from the build machine. For people who build on the machine that will run it. The value has
    to be exactly 1; true and yes are not accepted.
- id: 47-4
  week: 47
  day: 4
  category: Concurrency
  headline: 'Stream the <rows> from the <file: "big.csv">.'
  explanation: A stream is pulled element by element rather than read into a list, so the file's size
    stops being the program's memory floor. The producer is allowed a small lead over the consumer and
    then waits — backpressure, not a buffer that grows until something breaks.
- id: 47-5
  week: 47
  day: 5
  category: Tooling
  headline: aro diff --graph main..my-branch --html report.html
  explanation: Writes a self-contained HTML report with both graphs side by side, and still prints the
    summary to the terminal. The wires are derived with the runtime's own matching rules, so the picture
    is the one the event bus will actually build.
- id: 47-6
  week: 47
  day: 6
  category: Data
  headline: 'Compute the <changed: symmetric-difference> from <before> with <after>.'
  explanation: The elements in exactly one of the two collections - what was added or removed, without
    saying which. The four set operations share one shape, so intersect, difference and union read the
    same way.
- id: 47-7
  week: 47
  day: 7
  category: Actions
  headline: 'Update the <order> with { status: "paid" }.'
  explanation: Update and Delete sit under OWN beside Compute, which is why the deferral list is written
    verb by verb rather than derived from roles. Deferring a repository delete would move a world-changing
    effect somewhere else entirely.
- id: 48-1
  week: 48
  day: 1
  category: Plugins
  headline: ARO_QUALIFIER("size", "List,String", "Length of a list or string")
  explanation: Declares a qualifier with the input types it accepts. Types are the names the runtime detects
    — String, Int, Double, Bool, List, Object — and the value arrives as JSON with its detected type alongside,
    plus whatever a with clause carried.
- id: 48-2
  week: 48
  day: 2
  category: Compiler
  headline: aro build ./Examples/MarkdownRenderer --dynamic
  explanation: A Python plugin needs an interpreter and a standard library at run time, so --static refuses
    rather than produce something that looks standalone and dies elsewhere. The refusal names the plugin
    and the Python installation it would have depended on. --dynamic builds it with the same warning,
    because that mode never promised one file.
- id: 48-3
  week: 48
  day: 3
  category: Concurrency
  headline: ARO_MAX_CALL_DEPTH=50000
  explanation: A backstop for runaway recursion in user-defined actions, not the recursion model. A call
    in tail position reuses its frame and is not counted at all; other recursion is bounded by memory,
    and this budget exists so hitting that bound produces an error naming the call chain instead of an
    OOM kill.
- id: 48-4
  week: 48
  day: 4
  category: Tooling
  headline: aro actions Log
  explanation: Looks up one action by its name or by any of its verbs, so aro actions print finds Log.
    It shows the role, the full verb list, which prepositions are accepted and an example statement. Add
    --format json when something else has to read it.
- id: 48-5
  week: 48
  day: 5
  category: Data
  headline: 'Compute the <tags: unique> from <all>.'
  explanation: 'Removes duplicates with the first occurrence winning, so order survives. Equality is the
    language''s own: numbers compare across Int and Double, a Bool is never a number, and a string is
    never either.'
- id: 48-6
  week: 48
  day: 6
  category: Actions
  headline: Sleep the <pause> for 2.
  explanation: Sleep is deliberately left out of the deferrable verbs, because the delay is the effect.
    Moving it to whoever first read its result would delete the pause the statement exists to create,
    and a Sleep whose result nobody reads would not pause at all.
- id: 48-7
  week: 48
  day: 7
  category: Plugins
  headline: '@plugin(name="plugin-python-collection", version="1.0.0", handle="Stats")'
  explanation: A Python plugin's metadata goes on a class that is otherwise empty. The handlers are module-level
    functions decorated with @action and @qualifier, not methods, because the runtime reaches them by
    name in the module namespace.
- id: 49-1
  week: 49
  day: 1
  category: Compiler
  headline: aro build ./Examples/FileUpload
  explanation: Which routes stream their request body and which turn it into a value is computed from
    the source before anything runs, and that answer is baked into the binary. The compiled server enforces
    the same per-route limits and streams the same bodies as aro run — the analysis is shared, not reimplemented.
- id: 49-2
  week: 49
  day: 2
  category: Concurrency
  headline: aro run ./Examples/ApplicationLimits
  explanation: Work started beneath something that already holds a concurrency slot runs under that slot
    rather than queueing for its own. That inheritance is what makes the ceiling deadlock-free — a parent
    can never be waiting on a child that is waiting for the parent's slot to free.
- id: 49-3
  week: 49
  day: 3
  category: Tooling
  headline: aro compile ./MyApp --format ast
  explanation: Prints the syntax tree the parser built, which is the quickest way to see how a statement
    was actually read — including the synthetic names the parser fills in where the source had none. --format
    json gives per-feature-set counts instead, and report is the default.
- id: 49-4
  week: 49
  day: 4
  category: Actions
  headline: 'Validate the <data: email> for the <email-format>.'
  explanation: 'Validate, Compare and Accept are excluded from deferral on purpose: they feed branches,
    and a guard that has not decided yet is not a guard. A failed Validate maps to 422, so the statement
    doubles as the rule and as the response when the rule is broken.'
- id: 49-5
  week: 49
  day: 5
  category: Plugins
  headline: export_abi(globals())
  explanation: 'The last line of a Python plugin, and it is not optional. It injects the C-ABI entry points
    into the module: the metadata function, one per action, and the qualifier dispatcher. Without it the
    decorators have registered into the SDK and the runtime finds nothing.'
- id: 49-6
  week: 49
  day: 6
  category: Compiler
  headline: aro build ./Examples/AssertDemo
  explanation: Test feature sets are stripped from the binary, using the same business-activity suffix
    that aro test uses to find them. Application-Start and the Application-End handlers are always kept.
    So tests can live in the file they test without ever shipping.
- id: 49-7
  week: 49
  day: 7
  category: Concurrency
  headline: 'Configure the <application: concurrency> with 0.'
  explanation: 'Zero is the explicit no-ceiling setting, and it is the default. The value has to be a
    whole number: a negative or fractional one fails the statement rather than being rounded, because
    a ceiling somebody typed wrong should not quietly become a different ceiling.'
- id: 50-1
  week: 50
  day: 1
  category: Tooling
  headline: aro run ./MyApp --debug
  explanation: 'Selects developer formatting for the response: a table with each value''s type annotated,
    rather than the human rendering a terminal run gets or the JSON an HTTP request gets. One Return statement,
    three renderings, chosen by who is reading.'
- id: 50-2
  week: 50
  day: 2
  category: Actions
  headline: Compare the <same-length> from the <first-length> against the <second-length>.
  explanation: 'Compare takes both operands as inputs and binds a fresh result: `<same-length: matches>`
    is the boolean and `<same-length: result>` is equal, less or greater. Nothing is rebound, which is
    what immutability requires.'
- id: 50-3
  week: 50
  day: 3
  category: Plugins
  headline: char* aro_plugin_info(void);
  explanation: The one export every native plugin must have. It returns metadata as JSON — the plugin's
    name, version, handle, and the actions and qualifiers it provides. The runtime frees what it gets
    back through the plugin's own free function, never its own.
- id: 50-4
  week: 50
  day: 4
  category: Compiler
  headline: aro build ./Examples/PositionalArguments
  explanation: The positional names an Application-Start declares with takes are written into the binary
    at build time, because the syntax tree is gone by the time it runs. The compiled program therefore
    parses its command line exactly as the interpreter did.
- id: 50-5
  week: 50
  day: 5
  category: Actions
  headline: Execute the <output> with "ls -la".
  explanation: Execute runs a shell command on the host and declares the OWN role, as Call does — neither
    manages a service, so neither is SERVER. The role tables in the proposals are generated from the runtime,
    so what they print is what each action actually declares.
- id: 50-6
  week: 50
  day: 6
  category: Plugins
  headline: char* aro_plugin_execute(const char* action, const char* input);
  explanation: 'One entry point dispatches every action, with the name as an argument and the arguments
    as JSON. Ownership runs one way: what a plugin returns belongs to the caller and is freed through
    the plugin''s free function; what is passed in is borrowed and must not be freed.'
- id: 50-7
  week: 50
  day: 7
  category: Compiler
  headline: aro build ./Examples/GreetingPlugin
  explanation: Under the default static link a native plugin is compiled and linked into the binary, with
    its symbols renamed so several plugins can each export the same C entry points without colliding.
    There is no dlopen at run time and no shared library to ship.
- id: 51-1
  week: 51
  day: 1
  category: Actions
  headline: Application.DoubleValue the <d> from 5.
  explanation: A feature set whose business activity is `Action` is callable application-wide, from any
    file, with no import. `from` works only when the header declares `takes <field>`; without it, callers
    pass an object through `with` and the mismatch is a compile error.
- id: 51-2
  week: 51
  day: 2
  category: Plugins
  headline: 'Greeting.Greet the <greeting> with { name: "ARO Developer" }.'
  explanation: 'A plugin action reads like any other statement: the handle and the action name are the
    verb. An action that takes named arguments gets them as an object through with, and the result binds
    like any other, ready to be read by the statement that needs it.'
- id: 51-3
  week: 51
  day: 3
  category: Compiler
  headline: aro_set_build_link_mode("static")
  explanation: The generated main calls this before anything else, so a compiled binary knows how it was
    linked. That is what decides whether it may load a plugin at run time — asking the dynamic loader
    answers a different question, and answers it too late to be useful.
- id: 51-4
  week: 51
  day: 4
  category: Actions
  headline: 'Application.SumAndDouble the <res> with { a: 3, b: 4 }.'
  explanation: 'Arguments arrive on the synthetic `<input>` conduit — `Extract the <a> from the <input:
    a>.` — the same shape `<event: x>` and `<request: body>` use. An action has no request or event context,
    and reaching for one is a compile error.'
- id: 51-5
  week: 51
  day: 5
  category: Plugins
  headline: Hash.DJB2 the <djb2-result> from the <test-string>.
  explanation: The same shape with a single input, through from. Which preposition a plugin action accepts
    is part of what its manifest declares, so it is checked rather than assumed — the same rule built-in
    actions live under.
- id: 51-6
  week: 51
  day: 6
  category: Compiler
  headline: aro build ./Examples/HelloWorld
  explanation: 'The shortest way to see the whole pipeline: parse and analyse, generate LLVM IR, emit
    an object file, link. What comes out is an ordinary executable with no runtime of its own to install,
    which is the point of having a compiler as well as an interpreter.'
- id: 51-7
  week: 51
  day: 7
  category: Actions
  headline: 'Return an <OK: status> with { doubled: <doubled> }.'
  explanation: 'The caller''s variable holds the returned object flattened at the top level: `status`
    plus every field of the payload. Field values keep their shape, so a returned list arrives as a list.
    A bare primitive lands under `value`.'
- id: 52-1
  week: 52
  day: 1
  category: Plugins
  headline: Markdown.ToHTML the <html-result> from the <markdown>.
  explanation: Python plugins are called exactly like native ones, and the name matching is case-insensitive,
    so an action declared to-html answers to ToHTML. What differs is the run-time cost and the fact that
    a Python plugin cannot be compiled into a standalone binary.
- id: 52-2
  week: 52
  day: 2
  category: Actions
  headline: Application.Countdown the <r> from <next>.
  explanation: A call whose result an unguarded final `Return` hands back untouched reuses its frame,
    so tail recursion costs nothing in depth. Any work between the call and that return — one `Extract`
    is enough — means the frame is still needed.
- id: 52-3
  week: 52
  day: 3
  category: Plugins
  headline: 'Compute the <sorted-numbers: stats.sort> from the <numbers>.'
  explanation: A plugin qualifier is always reached through its namespace — there is no bare registration
    — so handle.qualifier is the only spelling that resolves. The result name and the operation are separate,
    which is how you can sort two collections in one feature set.
- id: 52-4
  week: 52
  day: 4
  category: Actions
  headline: 'Application.Walk the <result> with { node: <child> }.'
  explanation: Recursion has no depth limit. Frames that cannot be reused live on the heap and are bounded
    by memory; `ARO_MAX_CALL_DEPTH`, 50 000 by default, stops a runaway with the call chain named rather
    than letting the OS kill it.
- id: 52-5
  week: 52
  day: 5
  category: Plugins
  headline: 'Log <numbers: collections.reverse> to the <console>.'
  explanation: Qualifiers work in expression position too, not only as the result of a Compute. They also
    chain with a pipe, and the chain is resolved a stage at a time, so a plugin qualifier and a built-in
    one can sit in the same ladder.
- id: 52-6
  week: 52
  day: 6
  category: Actions
  headline: Request the <page> from "https://example.com".
  explanation: Request is the outbound HTTP action and carries the REQUEST role, along with Extract, Retrieve,
    Read, Probe, Pull and Clone. Probe is the one that asks whether a target is reachable without halting
    on failure.
- id: 52-7
  week: 52
  day: 7
  category: Actions
  headline: 'Emit a <PageIndexed: event> with { url: <url> }.'
  explanation: Emit carries the EXPORT role with Publish, Commit, Push, Tag and Schedule — the verbs that
    make something available beyond the current execution. Emit is also an effect, so its payload is forced
    at this statement.
- id: 53-1
  week: 53
  day: 1
  category: Actions
  headline: 'Accept the <transition: placed_to_paid> on <order: status>.'
  explanation: Accept is the single-statement state transition. There are no multi-statement transactions
    in ARO, so where a read-then-write across two statements would race, modelling the change as one action
    is the answer.

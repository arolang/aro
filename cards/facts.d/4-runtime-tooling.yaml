# Cards 4: runtime, compiler, plugins and tooling.
# Written for v0.2.2-beta.10. Every claim verified against Proposals/ and Sources/
# in this repository; ARO headlines pass cards/validate-facts.py.

facts:
  - category: "Concurrency"
    headline: "ARO_NO_DEFER=1 aro run ./MyApp"
    explanation: "Statements start in source order and the program waits at the first read of a result, so independent work overlaps. This runs every action at its own statement — the one-step way to find out whether a suspected bug is ordering. The variable is presence-only: any value disables deferral, including 0."
  - category: "Concurrency"
    headline: "Sleep the <pause> for 50 milliseconds."
    explanation: "Sleep is deliberately absent from the deferrable verb list. For the verbs that are on it the wait moves to the first read of the result; with Sleep the delay is the effect, so deferring it would quietly delete the pacing between this statement and the one after it."
  - category: "Concurrency"
    headline: "Compute the <total: sum> from <amounts>."
    explanation: "Deferral is an allowlist of value-producing verbs, not the complement of the effects. Semantic role is too coarse to decide it: Update and Delete classify as own alongside Compute, and deferring a repository delete would move a world-changing effect to wherever somebody happened to read its result."
  - category: "Concurrency"
    headline: "Log <total> to the <console>."
    explanation: "Log runs at its own statement and forces what it reads first, so console output stays in source order even when the statements around it overlap. Return, Throw, Publish, Emit, Compare, Validate and Accept behave the same way — effects and branch conditions are never deferred."
  - category: "Concurrency"
    headline: "Retrieve the <rows> from the <user-repository>."
    explanation: "Retrieve is deferrable, so this starts here and the program waits at the first statement that reads rows. If nothing ever reads it, feature-set exit forces it anyway, so a failure nobody looked at is still reported — and attributed to this line rather than to wherever it surfaced."
  - category: "Concurrency"
    headline: "ARO_FORCE_WARN_SECONDS=5"
    explanation: "When a statement has waited this long on a deferred result, the runtime writes one line to stderr naming the binding and its source position, then keeps waiting. It is a diagnostic aid, not a deadline. Set it to 0, off, false or no to silence it."
  - category: "Concurrency"
    headline: "Configure the <application: concurrency> with 8."
    explanation: "This bounds the whole application, not one loop: every triggered feature set and every parallel-loop iteration that is not already running inside a slot counts against it. Work queues at the ceiling, it never fails. 0 means no ceiling, and ARO_CONCURRENCY sets the same number."
  - category: "Concurrency"
    headline: "Configure the <http-client> with { concurrency: 4, rate: \"10/s\" }."
    explanation: "Several settings for one category go in one object — two Configure statements naming the same category would rebind an immutable binding. A ceiling and a rate are different limits and both apply: one request at a time still exceeds a per-minute quota."
  - category: "Concurrency"
    headline: "Configure the <http-client: rate> with \"10/s\"."
    explanation: "The rate is a token bucket that refills continuously, not a fixed window — a window would let ten requests through at 0:59 and ten more at 1:01. Units are seconds, minutes and hours with their usual spellings, and a multiplier is allowed, so 5/2s parses."
  - category: "Concurrency"
    headline: "parallel for each <page> in <pages> with <concurrency: 6> {"
    explanation: "Clause order in the header is fixed: the concurrency modifier comes before any where filter. N has to be an integer literal, so a variable in that slot does not parse. Leave the clause off and the loop uses the item count or four times the core count, whichever is smaller."
  - category: "Concurrency"
    headline: "parallel for each <number> in <numbers> {"
    explanation: "Iterations run concurrently and finish in no particular order, in the interpreter and in a compiled binary alike. A parallel loop always materialises its collection first — concurrent iteration has nothing to pull a stream with — so a streamed source is read into memory here."
  - category: "Concurrency"
    headline: "for each <number> in <numbers> {"
    explanation: "The sequential loop runs one iteration at a time in source order, and yields cooperatively every five hundred iterations so a long loop cannot pin a core. Reach for parallel only when the iterations are independent; the ordering you get back is the thing you gave up."
  - category: "Concurrency"
    headline: "ARO_CONCURRENCY=8"
    explanation: "The application-wide ceiling, without editing the source. It is a FIFO gate: when it is saturated the next unit of work waits and is admitted in arrival order. Lowering it mid-run never revokes a slot already granted; the count drains to the new limit as work finishes."
  - category: "Concurrency"
    headline: "ARO_HTTP_CONCURRENCY=8"
    explanation: "How many outbound HTTP requests may be in flight at once, eight by default. It is a separate gate from the application ceiling, so a handler already holding an application slot still queues here. Configure the http-client category from ARO source to set the same number."
  - category: "Concurrency"
    headline: "ARO_HTTP_RATE=10/s"
    explanation: "An outbound request rate for the whole application. The rate is checked before the concurrency gate, so a request waits for a token first and for a slot second. Only second, minute and hour units parse; 10/day is not a rate specification the runtime accepts."
  - category: "Concurrency"
    headline: "Store the <user> to the <user-repository>."
    explanation: "Store is never deferred: it changes state another statement can observe. By default it also awaits its repository observers, so the statement after it runs in the world the observers left behind rather than racing them."
  - category: "Concurrency"
    headline: "ARO_ASYNC_OBSERVERS=1"
    explanation: "Makes Store publish its repository-change event through a bounded worker pool instead of awaiting the whole observer chain, which frees the storing handler's locals immediately. Off by default, because it changes store then observer side effect then next statement ordering. Only 1, true or yes enable it."
  - category: "Concurrency"
    headline: "ARO_OBSERVER_WORKERS=8"
    explanation: "How many persistent workers drain the observer queue when asynchronous observer dispatch is on. The default is twice the core count, with a floor of four — sized so lightweight observers stay responsive while heavy ones cannot all run at once."
  - category: "Concurrency"
    headline: "ARO_OBSERVER_QUEUE_CAPACITY=4096"
    explanation: "The ceiling on observer work items queued but not yet dispatched. When the queue is full the producer suspends until a slot frees, which is what keeps the queue's memory bounded. Workers never produce into it, so it cannot deadlock against itself."
  - category: "Concurrency"
    headline: "Emit a <PageFetched: event> with { page: <page> }."
    explanation: "Emit runs at its own statement and forces the payload it reads, so a value computed immediately above is materialised before the event is delivered rather than somewhere downstream. The handler it wakes is a unit of work in its own right and counts against the application ceiling."
  - category: "Concurrency"
    headline: "ARO_STREAM_PREFETCH=2"
    explanation: "How far a stream's producer may run ahead of its consumer, through a bounded channel that suspends the producer when it is full. Two on purpose: the win is overlapping one element's read and parse with the previous one's processing, and a deeper buffer trades memory for latency the consumer cannot use."
  - category: "Concurrency"
    headline: "Stream the <rows> from the <file: \"big.csv\">."
    explanation: "A stream is pulled element by element rather than read into a list, so the file's size stops being the program's memory floor. The producer is allowed a small lead over the consumer and then waits — backpressure, not a buffer that grows until something breaks."
  - category: "Concurrency"
    headline: "ARO_MAX_CALL_DEPTH=50000"
    explanation: "A backstop for runaway recursion in user-defined actions, not the recursion model. A call in tail position reuses its frame and is not counted at all; other recursion is bounded by memory, and this budget exists so hitting that bound produces an error naming the call chain instead of an OOM kill."
  - category: "Runtime"
    headline: "ARO_MAX_BODY=1MB"
    explanation: "The default ceiling on how much of a request body may become a value in memory, one megabyte unless you change it. It is a materialisation limit, not a transport limit: a route that only moves its body to a file or a socket accumulates nothing and is not bounded by it."
  - category: "Runtime"
    headline: "x-aro-max-body: 256KB"
    explanation: "A per-route body limit, declared in the OpenAPI contract beside the operationId. A route's own declaration wins over the application default, and the check happens before the body is read — from Content-Length where the client sent one, incrementally otherwise."
  - category: "Runtime"
    headline: "Configure the <http-server: max-body> with \"1MB\"."
    explanation: "This sets the default for routes that declare nothing, and it is process-wide: it raises or lowers the ceiling for every route in the application, including ones already serving. Set it once at startup, and use x-aro-max-body in the contract for anything per-route."
  - category: "Runtime"
    headline: "ARO_BODY_CHUNK_SIZE=65536"
    explanation: "The buffer size for streamed request bodies and streamed file writes, sixty-four kilobytes by default. It matches the file service's own read chunk, so a body streamed from a socket straight to a file moves in one buffer size from end to end."
  - category: "Runtime"
    headline: "Keepalive the <application> for the <events>."
    explanation: "Without this, a feature set that starts a server returns and the process exits. Keepalive blocks until SIGINT or SIGTERM arrives, leaving the event loop free to dispatch requests and events, and hands control to Application-End on the way out."
  - category: "Concurrency"
    headline: "aro run ./Examples/ApplicationLimits"
    explanation: "Work started beneath something that already holds a concurrency slot runs under that slot rather than queueing for its own. That inheritance is what makes the ceiling deadlock-free — a parent can never be waiting on a child that is waiting for the parent's slot to free."
  - category: "Concurrency"
    headline: "Configure the <application: concurrency> with 0."
    explanation: "Zero is the explicit no-ceiling setting, and it is the default. The value has to be a whole number: a negative or fractional one fails the statement rather than being rounded, because a ceiling somebody typed wrong should not quietly become a different ceiling."
  - category: "Compiler"
    headline: "aro build ./MyApp"
    explanation: "Compiles the application to a native binary through LLVM IR and an object file, then links it. The output takes the directory's own name and is written inside it, so this produces ./MyApp/MyApp. Intermediates land in a .build folder beside it and are removed afterwards."
  - category: "Compiler"
    headline: "aro build ./MyApp -o myapp"
    explanation: "A bare name is resolved relative to the application root, so the binary still lands beside the source. Give a path instead and the build goes out of place. Either way the intermediate files stay under the app's own .build directory, keyed by the binary's basename."
  - category: "Compiler"
    headline: "aro build"
    explanation: "Native compilation needs LLVM, and it is available on macOS and Linux. On Windows the command is not there: run, check, compile and test are the supported path, and an application developed on Windows still builds to a binary on the other two."
  - category: "Compiler"
    headline: "aro build ./MyApp --static"
    explanation: "The default, so passing it changes nothing. It means the Swift runtime is linked in rather than shipped alongside, and native plugins are compiled into the binary instead of loaded at startup. On macOS the Swift runtime is always the system one — Apple ships no static build of it."
  - category: "Compiler"
    headline: "aro build ./MyApp --dynamic"
    explanation: "On Linux this links the Swift runtime dynamically and copies the Swift, Foundation and ICU shared objects next to the binary with an rpath of $ORIGIN, so the directory travels as a unit. Plugins ship beside the binary too and are loaded at startup the way the interpreter loads them."
  - category: "Compiler"
    headline: "aro build ./MyApp --static --dynamic"
    explanation: "This is a hard error, not a preference the build resolves for you. Link mode decides whether plugins are compiled in or shipped alongside, and it is settled before any plugin is built, so a contradictory pair has to be refused rather than silently ranked."
  - category: "Compiler"
    headline: "aro build ./MyApp --release"
    explanation: "Sugar for --optimize --size --strip together. Worth knowing what that combination means: size wins over speed at the link step, so a release build links at -Os rather than -O2. Reach for --optimize alone when you want the faster one."
  - category: "Compiler"
    headline: "aro build ./MyApp --optimize"
    explanation: "Raises the object-emission level and adds thin link-time optimisation. It is the flag to use for a binary you care about the speed of; --release also turns on size optimisation and stripping, which is a different trade."
  - category: "Compiler"
    headline: "aro build ./MyApp --size"
    explanation: "Optimises for size instead of speed, and also turns on dead-stripping. The saving happens at the link step: the object-emission stage stays at -O2 because the tool that emits it only understands -O0 through -O3, with no size level among them."
  - category: "Compiler"
    headline: "aro build ./MyApp --strip"
    explanation: "Removes symbols, at the link step and again with a separate pass afterwards, and turns on dead-stripping — which a plain or optimised build never does on its own. Strip after you have finished debugging: the DWARF that lets lldb stop on an .aro line goes with it."
  - category: "Compiler"
    headline: "aro build ./MyApp --emit-llvm"
    explanation: "Writes the LLVM IR as text and stops there. No object file, no link, no binary, and none of the post-build steps run. It is the way to see what a feature set actually compiles to without waiting for a link you are going to throw away."
  - category: "Compiler"
    headline: "aro build ./MyApp --keep-intermediate"
    explanation: "The .ll and .o are written on every build; this flag only stops them being deleted afterwards. Keep them when you are debugging the compiler itself, or when you want the object file that a symbolicated stack trace on macOS needs to resolve."
  - category: "Compiler"
    headline: "aro build ./MyApp --verbose"
    explanation: "Prints each stage as it runs and raises the log level for the whole process, not only the progress lines. It is what tells you which runtime archive was found, which plugins were compiled in, and how many test feature sets were stripped."
  - category: "Compiler"
    headline: "aro build ./MyApp --sign '-'"
    explanation: "Signs the finished binary ad-hoc, which is enough to satisfy macOS on the machine that built it. Signing is deliberately the last step that touches the file: anything that rewrites bytes afterwards invalidates the signature, and Gatekeeper reports an invalid signature as damaged."
  - category: "Compiler"
    headline: "aro build ./MyApp --sign \"Apple Development: Jane Doe (AB12CD34)\" --hardened-runtime"
    explanation: "A real identity plus the hardened runtime, which is the combination anything destined for distribution needs. The two flags are independent, so asking for a signature does not turn the hardened runtime on for you — pass both. Both exist on macOS only."
  - category: "Compiler"
    headline: "codesign -dv --verbose=4 ./MyApp/MyApp"
    explanation: "Reads back what was actually signed: the identity, the flags, and whether the hardened runtime is on. Worth running once after wiring signing into a release script, because a signing failure is reported as a warning and the build still exits successfully with an unsigned binary."
  - category: "DevOps"
    headline: "swift build --product ARORuntime && swift build --product aro"
    explanation: "Two invocations on purpose. SwiftPM honours only the last --product, so naming both in one command silently builds only the runtime. Do this before testing aro build against a runtime change, or the link picks up the archive you have installed instead."
  - category: "DevOps"
    headline: "ARO_LIB_PATH=$PWD/.build/release/libARORuntime.a aro build ./MyApp"
    explanation: "Names the runtime archive outright, and it is checked before every other location. Without it the search ends at the working directory's .build, so an installed copy under /opt/homebrew/lib wins — and a runtime change appears to do nothing because the binary was built against the release."
  - category: "DevOps"
    headline: "brew install llvm"
    explanation: "aro build needs LLVM's llc on the machine doing the building. It is looked for in the Homebrew and system prefixes before PATH, and if it is not there the build stops with the install command for your platform rather than failing somewhere further down."
  - category: "DevOps"
    headline: "sudo apt-get install llvm-14"
    explanation: "The Linux side of the same requirement. The object file is emitted position-independent there, which is not optional: modern distributions default to position-independent executables, and an object built without it produces relocations the link then rejects."
  - category: "Compiler"
    headline: "lldb ./MyApp/MyApp"
    explanation: "A compiled binary carries DWARF that points at the .aro files it came from, so a debugger stops in your source rather than in generated code. Each feature set becomes a subprogram named after itself, located at its real file and line."
  - category: "Compiler"
    headline: "breakpoint set --file main.aro --line 5"
    explanation: "Debug locations are emitted per statement, not only per feature set, so a breakpoint on an ARO line resolves in a compiled binary on macOS and Linux alike. aro debug is the other route: it steps the interpreter and takes its commands on stdin."
  - category: "Compiler"
    headline: "ARO_STATIC_PYTHON=/opt/cpython-static aro build ./MyApp"
    explanation: "Lets a Python plugin go into a standalone binary, by carrying the interpreter and the parts of the standard library the program needs. The distribution must have a real static libpython — the build reads the file's archive magic rather than trusting its name, because some installs ship a symlink to the dynamic library under that name."
  - category: "Compiler"
    headline: "ARO_ALLOW_EMBEDDED_PYTHON=1 aro build ./MyApp"
    explanation: "Builds a Python plugin into a static binary anyway, resolving the interpreter and standard library from the build machine. For people who build on the machine that will run it. The value has to be exactly 1; true and yes are not accepted."
  - category: "Compiler"
    headline: "aro build ./Examples/MarkdownRenderer --dynamic"
    explanation: "A Python plugin needs an interpreter and a standard library at run time, so --static refuses rather than produce something that looks standalone and dies elsewhere. The refusal names the plugin and the Python installation it would have depended on. --dynamic builds it with the same warning, because that mode never promised one file."
  - category: "DevOps"
    headline: "otool -L ./MyApp/MyApp"
    explanation: "The honest way to find out what a finished binary needs on the target machine — the link line is a statement of intent, this is the result. Anything outside the system paths is a file the recipient has to receive alongside the binary."
  - category: "DevOps"
    headline: "ldd ./MyApp/MyApp"
    explanation: "The Linux counterpart. One thing to expect even from a static build: Foundation is linked dynamically there, so it shows up. If the static Swift runtime is missing from the toolchain the build warns on stderr and links dynamically instead of failing, so read that warning."
  - category: "Compiler"
    headline: "aro build ./Examples/FileUpload"
    explanation: "Which routes stream their request body and which turn it into a value is computed from the source before anything runs, and that answer is baked into the binary. The compiled server enforces the same per-route limits and streams the same bodies as aro run — the analysis is shared, not reimplemented."
  - category: "Compiler"
    headline: "aro build ./Examples/AssertDemo"
    explanation: "Test feature sets are stripped from the binary, using the same business-activity suffix that aro test uses to find them. Application-Start and the Application-End handlers are always kept. So tests can live in the file they test without ever shipping."
  - category: "Compiler"
    headline: "aro build ./Examples/PositionalArguments"
    explanation: "The positional names an Application-Start declares with takes are written into the binary at build time, because the syntax tree is gone by the time it runs. The compiled program therefore parses its command line exactly as the interpreter did."
  - category: "Compiler"
    headline: "aro build ./Examples/GreetingPlugin"
    explanation: "Under the default static link a native plugin is compiled and linked into the binary, with its symbols renamed so several plugins can each export the same C entry points without colliding. There is no dlopen at run time and no shared library to ship."
  - category: "Compiler"
    headline: "aro_set_build_link_mode(\"static\")"
    explanation: "The generated main calls this before anything else, so a compiled binary knows how it was linked. That is what decides whether it may load a plugin at run time — asking the dynamic loader answers a different question, and answers it too late to be useful."
  - category: "Compiler"
    headline: "aro build ./Examples/HelloWorld"
    explanation: "The shortest way to see the whole pipeline: parse and analyse, generate LLVM IR, emit an object file, link. What comes out is an ordinary executable with no runtime of its own to install, which is the point of having a compiler as well as an interpreter."
  - category: "DevOps"
    headline: "swift test --filter ActionRoleParityTests"
    explanation: "The interpreter and the compiled binary each keep their own copy of the action catalogue, and the copies have drifted into a user-visible bug more than once. This test fails when they disagree, which is why adding an action means touching both."
  - category: "DevOps"
    headline: "swift test --filter FrameworkVariableParityTests"
    explanation: "Statement modifiers — a with clause, a by pattern, a where field — live in framework variables that must be cleared between statements. The interpreter gives each statement its own scope and the compiler clears a list; this test is what keeps the two lists the same."
  - category: "Plugins"
    headline: "aro new plugin my-greeting --lang swift"
    explanation: "Scaffolds a plugin under Plugins/<name>/ with its manifest and a working action. --lang is required — swift, rust, c, cpp, python or aro — and there is no interactive prompt, so a bare aro new plugin is an error rather than a questionnaire."
  - category: "Plugins"
    headline: "aro new plugin --name my-csv --lang rust --actions --qualifiers"
    explanation: "The scaffolding flags pick what to generate: actions, qualifiers, services, system-objects, events, templates, or hybrid for native code plus .aro files. With none of them set you get actions. The name must be kebab-case, and --handle defaults to a PascalCase reading of it."
  - category: "Plugins"
    headline: "aro add https://github.com/arolang/plugin-csv.git"
    explanation: "Clones a plugin into your application's Plugins/ directory and records it. The repository must have a plugin.yaml at its root; without one the install stops rather than leaving a directory the loader will skip."
  - category: "Plugins"
    headline: "aro add git@github.com:arolang/plugin-csv.git --ref v1.0.0"
    explanation: "Pins the install to a tag or commit. --branch is the same knob under another name — it folds into --ref — so the two are not independent and there is no point passing both. SSH and HTTPS URLs both work."
  - category: "Plugins"
    headline: "aro remove plugin-csv --force"
    explanation: "Deletes the plugin's directory and drops it from the lock file. Without --force it asks first. Removing the directory by hand leaves the lock entry behind, so the command is worth using even though the deletion looks trivial."
  - category: "Plugins"
    headline: "aro plugins"
    explanation: "Lists what is installed, and it never builds anything — it is a directory walk and a manifest read, so it cannot sit there in a compile or block on a build lock. A plugin that has no artefact yet is shown with a note telling you to run a rebuild."
  - category: "Plugins"
    headline: "aro plugins rebuild"
    explanation: "Recompiles native plugins from source. This is the counterpart to the listing not building: after pulling a plugin's new version, or after changing your own plugin's code, this is the step that produces the library the runtime will load."
  - category: "Plugins"
    headline: "aro plugins export"
    explanation: "Writes .aro-sources, one Git URL and optional ref per line, for every plugin that came from a repository. aro plugins restore reads it back and installs them, skipping anything already present — which is how a checkout without vendored plugins gets its dependencies."
  - category: "Plugins"
    headline: "aro plugins check"
    explanation: "Verifies installed plugins against plugins.lock, the YAML file that records each plugin's name, version, repository, ref and resolved commit. The commit is what makes an install reproducible; aro add and aro plugins update are what write it."
  - category: "Plugins"
    headline: "handle: Collections"
    explanation: "The root-level handle in plugin.yaml is the canonical way to declare a namespace, and PascalCase is the convention. Qualifiers are then reached as Collections.pick-random and actions as Collections.Verb. Lookup is case-insensitive, so the lowercase spelling in a statement resolves to the same thing."
  - category: "Plugins"
    headline: "handler: collections"
    explanation: "The legacy spelling, nested inside a provides entry. It still works and warns, including when a root-level handle is present as well. If the two name different namespaces the root-level one wins and the warning says so, so you can see which name your qualifiers actually got."
  - category: "Plugins"
    headline: "  - type: swift-plugin"
    explanation: "A provides entry says what kind of thing a directory holds and where it is. Seven types are recognised: swift-plugin, rust-plugin, c-plugin, cpp-plugin, python-plugin, aro-files and aro-templates. One plugin may list several, so native code and plain .aro feature sets can ship together."
  - category: "Plugins"
    headline: "name: plugin-c-hash"
    explanation: "Plugin names are lowercase kebab-case, starting with a letter and ending with a letter or digit. The name is also the fallback namespace: a qualifier plugin that declares no handle answers to its own plugin name, which is why declaring one is worth the line."
  - category: "Plugins"
    headline: "Plugins/my-plugin/plugin.yaml"
    explanation: "Plugins/ with a capital P is the directory, and each plugin is one subdirectory with a manifest in it. Discovery goes exactly one level deep; a subdirectory without a plugin.yaml is skipped with a warning rather than guessed at. A lowercase plugins/ is still read, and warns."
  - category: "Plugins"
    headline: "@AROExport"
    explanation: "The whole of a Swift plugin's registration, put on the plugin value itself. The macro emits the C entry point that forces the value to initialise, and the SDK supplies the rest of the ABI. Actions, qualifiers and services are added to the value with a builder chain."
  - category: "Plugins"
    headline: ".library(name: \"HelloPlugin\", type: .dynamic, targets: [\"HelloPlugin\"])"
    explanation: "A Swift plugin's package must declare a dynamic library. Leave the type off and SwiftPM builds a static one, which the runtime cannot load — and the failure arrives at plugin-load time, not at build time, so it is worth getting right in the manifest."
  - category: "Plugins"
    headline: "crate-type = [\"cdylib\"]"
    explanation: "The Rust counterpart, in Cargo.toml. The SDK's export macro generates the C entry points from a list of your functions, so you do not write no-mangle extern declarations by hand — and the qualifier entry point is only emitted when you actually declare qualifiers."
  - category: "Plugins"
    headline: "ARO_PLUGIN(\"plugin-c-hash\", \"1.0.0\")"
    explanation: "Declares a C plugin's name and version. The namespace is a second macro, ARO_HANDLE(\"Hash\"), rather than an argument here — so the first argument is the plugin name, not the handle it will be called through."
  - category: "Plugins"
    headline: "#define ARO_PLUGIN_SDK_IMPLEMENTATION"
    explanation: "The C SDK is a single header in the style that carries its own implementation, so this define goes above the include in exactly one translation unit. Without it you get declarations and no entry points, and the plugin loads as a library with nothing in it."
  - category: "Plugins"
    headline: "ARO_ACTION(\"DJB2\", \"own\", \"from,with,for\")"
    explanation: "Declares a C action: its name, its semantic role, and the prepositions it accepts as one comma-separated string. The macro registers it through a constructor, so the action list is built before the runtime ever asks for it."
  - category: "Plugins"
    headline: "ARO_QUALIFIER(\"size\", \"List,String\", \"Length of a list or string\")"
    explanation: "Declares a qualifier with the input types it accepts. Types are the names the runtime detects — String, Int, Double, Bool, List, Object — and the value arrives as JSON with its detected type alongside, plus whatever a with clause carried."
  - category: "Plugins"
    headline: "@plugin(name=\"plugin-python-collection\", version=\"1.0.0\", handle=\"Stats\")"
    explanation: "A Python plugin's metadata goes on a class that is otherwise empty. The handlers are module-level functions decorated with @action and @qualifier, not methods, because the runtime reaches them by name in the module namespace."
  - category: "Plugins"
    headline: "export_abi(globals())"
    explanation: "The last line of a Python plugin, and it is not optional. It injects the C-ABI entry points into the module: the metadata function, one per action, and the qualifier dispatcher. Without it the decorators have registered into the SDK and the runtime finds nothing."
  - category: "Plugins"
    headline: "char* aro_plugin_info(void);"
    explanation: "The one export every native plugin must have. It returns metadata as JSON — the plugin's name, version, handle, and the actions and qualifiers it provides. The runtime frees what it gets back through the plugin's own free function, never its own."
  - category: "Plugins"
    headline: "char* aro_plugin_execute(const char* action, const char* input);"
    explanation: "One entry point dispatches every action, with the name as an argument and the arguments as JSON. Ownership runs one way: what a plugin returns belongs to the caller and is freed through the plugin's free function; what is passed in is borrowed and must not be freed."
  - category: "Plugins"
    headline: "Greeting.Greet the <greeting> with { name: \"ARO Developer\" }."
    explanation: "A plugin action reads like any other statement: the handle and the action name are the verb. An action that takes named arguments gets them as an object through with, and the result binds like any other, ready to be read by the statement that needs it."
  - category: "Plugins"
    headline: "Hash.DJB2 the <djb2-result> from the <test-string>."
    explanation: "The same shape with a single input, through from. Which preposition a plugin action accepts is part of what its manifest declares, so it is checked rather than assumed — the same rule built-in actions live under."
  - category: "Plugins"
    headline: "Markdown.ToHTML the <html-result> from the <markdown>."
    explanation: "Python plugins are called exactly like native ones, and the name matching is case-insensitive, so an action declared to-html answers to ToHTML. What differs is the run-time cost and the fact that a Python plugin cannot be compiled into a standalone binary."
  - category: "Plugins"
    headline: "Compute the <sorted-numbers: stats.sort> from the <numbers>."
    explanation: "A plugin qualifier is always reached through its namespace — there is no bare registration — so handle.qualifier is the only spelling that resolves. The result name and the operation are separate, which is how you can sort two collections in one feature set."
  - category: "Plugins"
    headline: "Log <numbers: collections.reverse> to the <console>."
    explanation: "Qualifiers work in expression position too, not only as the result of a Compute. They also chain with a pipe, and the chain is resolved a stage at a time, so a plugin qualifier and a built-in one can sit in the same ladder."
  - category: "Testing"
    headline: "aro test ./MyApp"
    explanation: "Tests are feature sets whose business activity ends in Test or Tests, living in the same .aro files as the code they cover. Nothing is discovered by filename. Finding no tests at all is an exit failure rather than a pass, so a renamed activity cannot quietly empty the suite."
  - category: "Testing"
    headline: "(length-of-hello: String Utils Test) {"
    explanation: "The suffix on the business activity is what makes this a test, and it is also what strips it: aro build removes test feature sets from the binary using the same rule the runner uses to find them. Tests and production code can therefore share a file without shipping."
  - category: "Testing"
    headline: "Given the <text> with \"hello\"."
    explanation: "Given binds an input for the test that follows. Several Givens build up the context, and everything bound is visible to the feature set the test exercises — there is no separate fixture or mock layer to wire up."
  - category: "Testing"
    headline: "When the <len> from the <get-length>."
    explanation: "When runs the named feature set with every variable the test has bound so far, and binds its result. It is optional: any ordinary statement may sit between Given and Then, which is how a test that only exercises a computation is written."
  - category: "Testing"
    headline: "Then the <len> with 5."
    explanation: "Then is the assertion. A failure reads \"Expected len to be 5, but was 4\" — the binding's name, the expected value, the actual one. An undefined binding is reported as its own failure rather than compared against nothing."
  - category: "Testing"
    headline: "aro test ./MyApp --filter upper"
    explanation: "The filter is a case-insensitive substring match on the feature-set name, not a glob and not a regular expression. So --filter upper runs uppercase-simple and uppercase-mixed, and there is no pattern syntax to get wrong."
  - category: "REPL"
    headline: "aro repl --load definitions.aro"
    explanation: "Pre-loads feature sets and definitions into the session before the first prompt, so you can poke at an application's own actions rather than retyping them. Immutability still applies inside a session: a name binds once, and re-binding it is refused."
  - category: "REPL"
    headline: "aro repl --json"
    explanation: "Speaks one JSON object per line on stdin and stdout instead of running a terminal REPL — newline framing, not LSP Content-Length headers. It answers execute, is_complete, complete, inspect, info, reset and shutdown, and an unknown type gets an explicit protocol error rather than silence."
  - category: "REPL"
    headline: "{\"id\": 1, \"type\": \"execute\", \"code\": \"Log \\\"hi\\\" to the <console>.\"}"
    explanation: "Every stream message for a request is written before that request's single result message — the server pushes a sentinel through the capture pipe and waits for it, so the ordering is a guarantee rather than a race you usually win."
  - category: "REPL"
    headline: "{\"id\": 2, \"type\": \"execute\", \"cellId\": \"c7\", \"code\": \"...\"}"
    explanation: "Sending a cellId releases the bindings that cell made before re-running it, which is what makes re-executing a notebook cell work at all. Leave it out and the session keeps ARO's ordinary rule, so a plain REPL line that re-binds a name is still refused."
  - category: "REPL"
    headline: "ARO_REPL_ALLOW_BLOCKING=1"
    explanation: "Keepalive, Wait and Block are refused inside a REPL or notebook cell, because a cell that blocks forever cannot be unwound and takes the session with it. Set this to exactly 1 when you really do want the cell to sit there."
  - category: "REPL"
    headline: "ARO_REPL_PLUGINS_DIR=~/.aro/repl-plugins"
    explanation: "Where a REPL session looks for plugins, since a session has no application directory of its own to read a Plugins folder from. Both the terminal REPL and the JSON server load from it, so a qualifier you can call in one works in the other."
  - category: "Tooling"
    headline: "aro kernel install"
    explanation: "Writes kernels/aro/kernel.json into your Jupyter data directory and then Jupyter starts the kernel itself. The spec records the absolute path of the aro binary, because Jupyter does not inherit the PATH of the shell you installed from."
  - category: "Tooling"
    headline: "brew install zeromq"
    explanation: "The native Jupyter kernel speaks the Jupyter wire protocol over ZeroMQ directly, with no Python and no ipykernel, so libzmq is a system dependency alongside libgit2. On Debian and Ubuntu the package is libzmq3-dev."
  - category: "IDE"
    headline: "aro lsp"
    explanation: "The language server, spoken over stdio, and normally started by an editor extension rather than by you. It serves diagnostics, hover, completion, go-to-definition, references, document and workspace symbols, formatting, rename, folding, signature help, code actions, document highlight and inlay hints."
  - category: "IDE"
    headline: "aro lsp --debug"
    explanation: "Logs every message received and sent to stderr with a timestamp, truncated so one large document does not bury the trace. This is the first thing to reach for when an editor shows no diagnostics: it tells you whether the editor is talking to the server at all."
  - category: "IDE"
    headline: "\"aro.lsp.path\": \"/usr/local/bin/aro\""
    explanation: "The VS Code extension resolves the server binary from this setting, falling back to whatever aro is on PATH. Point it at a checkout's build when you want the editor to use the compiler you are working on rather than the one you installed."
  - category: "IDE"
    headline: "python3 Scripts/generate-editor-grammars.py --check"
    explanation: "The TextMate grammars under Editor/ are generated from the same action registry that feeds aro actions and the language server, and CI verifies they are current. A hand-maintained verb list drifts; a derived one cannot."
  - category: "Tooling"
    headline: "aro mcp"
    explanation: "Runs ARO as an MCP server over stdio so a model can use the real toolchain. It exposes eight tools — aro_check, aro_run, aro_compile, aro_examples, aro_actions, aro_qualifiers, aro_parse and aro_syntax — along with the proposals, examples and books as resources."
  - category: "Tooling"
    headline: "aro ask \"write a feature set that greets a user\""
    explanation: "A coding assistant that runs against a local model and has the real toolchain wired in as tools, so it can check and run what it writes rather than guessing. Give it a prompt for one answer, or no argument to get a REPL."
  - category: "Tooling"
    headline: "aro ask --read-only \"why does this route 500?\""
    explanation: "Withholds the tools that write files or run commands instead of refusing them later, and tells the model so. A tool whose use will be refused is not a capability — it is a round the model spends discovering that — so the answer comes back as a description of the change."
  - category: "Tooling"
    headline: "ARO_ASK_ENDPOINT=http://localhost:8080/v1"
    explanation: "Points aro ask at any OpenAI-compatible server and takes priority over every local backend. Nothing ships configured to send your project anywhere: this variable is the only route out, and ARO_ASK_API_KEY supplies the bearer token if the endpoint wants one."
  - category: "Tooling"
    headline: "aro ask --stats \"add pagination to listUsers\""
    explanation: "Prints what the run cost and what the harness had to correct — turns, tool calls, and only when non-zero the failures, retries and repairs. It goes to stderr, so a pipeline reading the answer does not have to strip a bill off the end of it."
  - category: "Tooling"
    headline: "aro ask --yes /fix ./MyApp/main.aro"
    explanation: "Every tool call that writes a file or runs a command asks for approval first; --yes approves them all for the session and is the documented route for non-interactive use. Paths are confined to the working directory, with the shell tool as the deliberate exception."
  - category: "Tooling"
    headline: "aro ask /clean"
    explanation: "The conversation is persisted to a .context YAML file in the current working directory, so a session survives closing the terminal. Treat it like shell history — it records whatever was in the files the model read — and /clean deletes it."
  - category: "Tooling"
    headline: "aro ask /index"
    explanation: "Builds the retrieval index over the project, and prints how many chunks it made. Until you run it, /search has nothing to search and says so rather than returning an empty result you might read as an answer."
  - category: "Tooling"
    headline: "aro ask --file ./MyApp/users.aro"
    explanation: "Marks one file as the open file: its current content is injected into every request, so the model does not have to spend a tool call re-reading what you are looking at. In the REPL, /file changes it without restarting the session."
  - category: "Tooling"
    headline: "aro debug ./Examples/HelloWorld"
    explanation: "Pauses at every statement and takes a small command set on stdin: step, continue, b for a breakpoint on a line number or on any statement using a given verb, p to print the symbol table, bt for where you are. It runs through the interpreter, the same path as aro run."
  - category: "Tooling"
    headline: "aro check ./MyApp"
    explanation: "Parses and analyses without running anything. It reports unknown Compute qualifiers as errors, unreachable code after a Return, a Require whose source nothing publishes, and a user-defined action whose every path calls itself before it can return."
  - category: "Tooling"
    headline: "aro check -r ./Apps"
    explanation: "A directory of applications is not an application. Without -r, a path holding several Application-Start feature sets in different subdirectories is an error naming one to point at instead — the same answer run and build give. With it, each is checked separately."
  - category: "Tooling"
    headline: "aro check ./Examples/FileUpload"
    explanation: "For an application with a contract, the report ends with one line per route saying whether it streams its request body or holds it in memory, and under what limit. The verb that reads the body is named, so you can see which statement turned a stream into a value."
  - category: "Tooling"
    headline: "aro check --syntax 'Compute the <x: bogus> from <a>.'"
    explanation: "Checks a bare fragment rather than a whole application — a statement, a block, or a feature-set body — from an argument, a file, or standard input. Useful for a REPL line or a generator that wants to gate one snippet without wrapping it in a feature set first."
  - category: "Tooling"
    headline: "echo 'Log \"Hi\" to the <console>.' | aro"
    explanation: "With no arguments and input on a pipe, aro evaluates what it reads through a REPL session. Consecutive statements are kept in one unit on purpose, so work the language may overlap still overlaps instead of being serialised by the splitting."
  - category: "Tooling"
    headline: "aro run ./MyApp --record events.json"
    explanation: "Records the run's events to a file that --replay feeds back in, which is how an event-driven bug becomes reproducible. --debug-record is a different thing with a different format: per-statement JSONL for a live view, not a replayable recording."
  - category: "Tooling"
    headline: "aro diff --graph main..my-branch"
    explanation: "Compares two revisions as feature graphs rather than as text: nodes are feature sets, wires are events, Application.<Name> calls and repository observers. Nodes are keyed by name, so a feature set that changed file is reported as moved rather than as a delete and an add."
  - category: "Tooling"
    headline: "aro diff --graph main..my-branch --html report.html"
    explanation: "Writes a self-contained HTML report with both graphs side by side, and still prints the summary to the terminal. The wires are derived with the runtime's own matching rules, so the picture is the one the event bus will actually build."
  - category: "Tooling"
    headline: "aro actions --qualifiers"
    explanation: "Prints the live table the runtime registers — 73 built-in actions with their roles, verbs and prepositions, and the built-in qualifiers alongside. Prefer it over any written list: a documentation table drifts, and this one is the registry."
  - category: "Tooling"
    headline: "aro actions Log"
    explanation: "Looks up one action by its name or by any of its verbs, so aro actions print finds Log. It shows the role, the full verb list, which prepositions are accepted and an example statement. Add --format json when something else has to read it."
  - category: "Tooling"
    headline: "aro compile ./MyApp --format ast"
    explanation: "Prints the syntax tree the parser built, which is the quickest way to see how a statement was actually read — including the synthetic names the parser fills in where the source had none. --format json gives per-feature-set counts instead, and report is the default."
  - category: "Metrics"
    headline: "Log the <metrics: prometheus> to the <console>."
    explanation: "Runtime metrics are a value you read, in the format you name: short, table, plain or prometheus. The Prometheus rendering carries per-feature-set execution, success and failure counters, duration gauges, request-body byte counters and process CPU, memory and file-descriptor metrics."
  - category: "Metrics"
    headline: "Log the <metrics: short> to the <console>."
    explanation: "One line: executions, feature sets, average duration, uptime, CPU, memory and file descriptors. Metrics count feature-set executions rather than statements, and there is deliberately no way to reset them — a counter that goes backwards is worse than no counter."
  - category: "Tooling"
    headline: "aro run ./MyApp --debug"
    explanation: "Selects developer formatting for the response: a table with each value's type annotated, rather than the human rendering a terminal run gets or the JSON an HTTP request gets. One Return statement, three renderings, chosen by who is reading."

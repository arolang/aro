# Data, HTTP and I/O cards — verified against ARO at this revision.
facts:
  - category: Data
    headline: 'Filter the <active-orders: List> from the <orders> where <status> is "active".'
    explanation: The where clause reads the fields of each element by name, so <status> here is a field of an order rather than a binding in the feature set. Comparisons take a literal or another binding. Nothing in the source collection is copied.

  - category: HTTP
    headline: 'Return a <TooManyRequests: status> with <retry-after>.'
    explanation: Status names are looked up in one catalog that the interpreter, the compiled binary and aro check all read. Case and separators do not distinguish a name, so NoContent, no-content and No_Content are the same 204. A name the catalog does not know is answered 200.

  - category: Files
    headline: 'Compute the <name: basename> from <p>.'
    explanation: The path qualifiers are pure functions on a string — basename, dirname, extension and stem never touch the filesystem, so they work on a path that does not exist yet. The three agree that basename is stem, a dot, and extension, which makes renaming a file two qualifiers rather than a Split.

  - category: Data
    headline: 'Reduce the <total: Float> from the <orders> with sum(<amount>).'
    explanation: Reduce names its aggregate as a call — sum, avg, count, min, max. A field inside the parentheses aggregates that field of every record; empty parentheses, as in count(), aggregate the rows themselves. The annotation on the result is the type of the answer, not of the collection.

  - category: HTTP
    headline: 'Return an <Unprocessable: status> with <problems>.'
    explanation: Several spellings map to one code where one reads better than another — Invalid is BadRequest, RateLimited is TooManyRequests, ServerError is Error. What ARO calls a status is not always the wire's reason phrase — this one is 422, sent as Unprocessable Content.

  - category: Files
    headline: 'Compute the <joined: path-join> from "uploads/" with "/photo.png".'
    explanation: path-join puts exactly one separator between the pieces however they are written, which is the bug that string concatenation leaves in a program until a value arrives with a trailing slash. Both sides stay otherwise untouched.

  - category: Data
    headline: 'Group the <by-status> from the <orders> by "status".'
    explanation: Group partitions a collection into sub-collections keyed by one field's value, and the field name is quoted. Every row lands in exactly one group, keyed by whatever that field holds. Reduce over each group is how a per-key total is written.

  - category: HTTP
    headline: 'Return a <PendingVerification: status> with <account>.'
    explanation: A status name of your own is a deliberate 200, and the language keeps that spelling available for domain vocabulary. aro check stays quiet about it and warns only when a name is within a typo's distance of a real status, because NotFoudn is not domain vocabulary.

  - category: Data
    headline: 'Map the <emails: email> from the <users>.'
    explanation: A lowercase qualifier on the result is a field name, so Map projects that one field out of every record. There is no per-element binding to compute with; for arithmetic per row, use a for each loop. A record without the field contributes nothing.

  - category: Files
    headline: 'Compute the <safe: path-join> from "/uploads" with "/etc/passwd".'
    explanation: An absolute right-hand component does not reset the path. The answer is /uploads/etc/passwd, deliberately unlike Python, because the call this exists for is joining a trusted directory to a name somebody else chose. A join must not be turnable into "anywhere on the filesystem".

  - category: Data
    headline: 'Map the <summaries: List<UserSummary>> from the <users>.'
    explanation: A PascalCase annotation is a schema from the contract's components/schemas, and Map copies only the fields that schema declares — recursively, so a nested record is projected too. It is how a field stays out of a response. A name that matches no schema is an error, not an empty list.

  - category: HTTP
    headline: 'x-aro-max-body: 256KB'
    explanation: A route declares how much of a request body it is willing to hold. A body over the limit is answered 413 before it is read — from Content-Length where the client declared one, incrementally otherwise. The default is 1 MB, and the route's own declaration wins over it.

  - category: Data
    headline: 'Compute the <common: intersect> from <list-a> with <list-b>.'
    explanation: intersect, difference and union apply to lists, strings and objects alike. Lists carry multiset semantics — [1,2,2,3] against [2,2,2,4] intersects to [2,2], the smaller count of the two. Objects compare field by field, and union merges with the left side winning.

  - category: Files
    headline: 'Compute the <ext: extension> from ".gitignore".'
    explanation: A dotfile is a name, not an extension, so this is empty and stem is the whole .gitignore. An extension never carries its dot, which is what lets it be compared against a literal without one and joined back with path-join.

  - category: HTTP
    headline: 'Extract the <upload> from the <request: body>.'
    explanation: This binds the body without reading it, so on its own it costs nothing whatever the upload weighs. What the statement after it does decides everything — moving the body leaves it a stream, reading it turns it into a value, and only a value has a size to bound.

  - category: Data
    headline: 'Compute the <changed: symmetric-difference> from <before-roles> with <after-roles>.'
    explanation: The elements in exactly one of the two collections — what a diff of two sets of roles, tags or ids actually asks for. Against itself it is empty, which makes "nothing changed" a length of zero rather than a special case.

  - category: Files
    headline: 'Compute the <abs: absolute> from "/srv/./app/../app/run.sh".'
    explanation: Dot and double-dot are resolved lexically against the working directory, so the answer never depends on what is a symlink today. Being a pure function is the point — the same input gives the same path on a machine where none of it exists.

  - category: HTTP
    headline: 'Write the <upload> to the <file: target>.'
    explanation: Moving a body to a sink never builds it in memory, so no limit applies and a four-gigabyte upload costs one chunk. Write, Append, Send, Return, Broadcast, Emit and Publish are all moves. What a route can accept is therefore a property of what the handler does, not of the server.

  - category: Data
    headline: 'Return an <OK: status> for the <request> when <required-roles> subset of <user-roles>.'
    explanation: subset of is an operator, not a qualifier, because it answers a question instead of producing a collection. It sits with in, contains and matches, and follows set semantics — a duplicate on the left does not make a new member, and the empty set is a subset of everything.

  - category: Data
    headline: 'Filter the <remaining> from <items> where <value> not in <exclude-list>.'
    explanation: in and not in take a collection on the right, so an exclusion list is a binding rather than a chain of comparisons. when and where accept the same operator set, so a predicate that filters a collection also guards a statement unchanged.

  - category: HTTP
    headline: 'Extract the <text> from the <note: text>.'
    explanation: Reading a field out of a body is what turns it into a value, and the value is what the route's limit bounds. Log, Store, Compute, Validate and a when guard do the same, and so does a plain Create that copies the body. Anything the analysis cannot see through, such as a plugin action, counts as reading.

  - category: Files
    headline: 'Compute the <dir: dirname> from "report.csv".'
    explanation: The dirname of a bare filename is a single dot, not an empty string, so the result stays a usable path for the next join or Read. Nothing here asks the filesystem anything, which is why the answer is the same on a machine where the file does not exist.

  - category: Data
    headline: 'Filter the <failures> from the <log-rows> where <level> is "FATAL".'
    explanation: At ten thousand records or more, Filter binds a stream rather than an array, so the next stage sees rows as they are produced instead of after a full intermediate copy. A list of plain strings takes the eager path instead, where the copy costs little.

  - category: HTTP
    headline: 'Compute the <digest: sha256> from <payload>.'
    explanation: The folding qualifiers — sha256, hash, length, count, size, lines — consume a body chunk by chunk, so hashing a four-gigabyte upload costs a chunk as well. A chain folds only if every step does, so lines then length still streams while lines then uppercase does not.

  - category: Files
    headline: 'Configure the <mode> for the <file: "./run.sh"> with { permissions: "755" }.'
    explanation: Setting permissions binds a record of path, permissions, octal and previous, so the change is auditable in the same statement that makes it. Octal and the symbolic form Stat prints are both accepted, which means a mode read off one file applies unchanged to another.

  - category: Repositories
    headline: 'Configure the <cart-repository: scope> with "session".'
    explanation: A repository's scope is declared once, where the repository is declared, and no statement restates it. A cart is per-caller in every line that touches it, so saying so once is both less to write and impossible to get inconsistently wrong. An undeclared repository is application-scoped.

  - category: HTTP
    headline: 'Emit a <DocumentReceived: event> with <upload>.'
    explanation: A handler outlives the request that triggered it, so emitting a body anchors it — drained to a temporary file one chunk at a time, readable afterwards by every handler, and deleted when the last reference goes. Memory stays at one chunk; the cost moves to disk.

  - category: Repositories
    headline: 'Configure the <cart-repository> with { scope: "session", ttl: 3600 }.'
    explanation: Several settings for one repository go in one object, because a second Configure naming the same subject is an immutable rebind. The scope value is quoted, because a bare word inside an object literal is a variable reference and would be looked up as a binding called session.

  - category: Files
    headline: 'Touch the <marker> for the <file: "./build-stamp.txt">.'
    explanation: Touch creates the file when it is absent and stamps it when it is there, and the result says which by binding created. A build marker or a lock file is therefore one statement, with no check-then-create window between two of them.

  - category: HTTP
    headline: 'Configure the <http-server: max-body> with "1MB".'
    explanation: This sets the default for routes that declare nothing, and ARO_MAX_BODY sets the same thing from the environment. KB, MB and GB are powers of 1000 and KiB, MiB and GiB powers of 1024, so the 1 MB default is a round million bytes.

  - category: Repositories
    headline: 'Configure the <partial-repository: scope> with "connection".'
    explanation: A TCP connection is not a user. Anyone who can open a socket gets one, it carries no credentials, and nothing about it survives a reconnect — so connection scope and session scope are two words rather than one. Connection-scoped data is dropped when the socket closes.

  - category: Files
    headline: 'Stat the <info> for the <file: "./config.yaml">.'
    explanation: Stat reads a file's metadata into a record — size, dates and permissions among them — and permissions come back in the symbolic form that Configure accepts. Asking about a file is a different action from reading it, so nothing about the contents is loaded.

  - category: Repositories
    headline: 'Attach the <session> to the <connection>.'
    explanation: A socket peer that authenticates in-band is promoted with this one statement, after which session-scoped repositories resolve for it. Promotion cannot be undone or redirected inside a connection, because either would be a downgrade attack in one line. Closing the socket is how a peer stops being that session.

  - category: HTTP
    headline: 'aro check ./FileUpload'
    explanation: Whether a route streams its body or holds it is computed from the source before a port is bound, and the check prints the verdict per route — which statement made a route hold its body, and how much it may hold. A declared limit on a streaming route is reported as unused rather than silently ignored.

  - category: Repositories
    headline: 'Attach the <session> to the <caller>.'
    explanation: The HTTP half of the same verb, which hands the caller the session cookie. A record with no id mints a session; a record carrying one adopts that session and rotates its identifier, which is the session-fixation defence. An id no session holds is an error.

  - category: Files
    headline: 'Delete the <gone> from the <file: "./build-stamp.txt">.'
    explanation: A path inside angle brackets is a quoted string, not a bare word. The unquoted spelling does not parse, which is the first thing to check when a file statement is rejected and the path looks obviously fine.

  - category: HTTP
    headline: 'Extract the <name> from the <pathParameters: name>.'
    explanation: A path parameter declared in the contract arrives under pathParameters, named exactly as the contract names it. Nothing in the feature set declares the route or the segment — the contract did that, and the handler is named after its operationId.

  - category: Repositories
    headline: 'Retrieve the <cart> from the <cart-repository>.'
    explanation: Scope mistakes are caught before the program runs, because a feature set's trigger is known from its business activity. A session-scoped repository read from Application-Start or a file handler is reported, and so is a connection-scoped one read from an HTTP route.

  - category: Contract
    headline: 'operationId: uploadDocument'
    explanation: The operationId in openapi.yaml is the name of the feature set that handles the route, so there is no routing table, no decorator and no registration statement. A route nothing implements answers 501 and names the operationId it looked for. Two routes sharing an operationId is a contract error.

  - category: Repositories
    headline: 'Store the <item> into the <cart-repository>.'
    explanation: The same statement is correct over HTTP, WebSocket and TCP; what differs is who the caller is, and each transport answers that its own way. Touching a session-scoped repository where no session exists is an error — never an empty repository, and never a silent fall back to the application-wide one.

  - category: Date
    headline: 'Compute the <next-week: +7d> from <now>.'
    explanation: A date offset is written in the qualifier slot — +7d, -1d, +1h, +2w — and reads as the sentence it replaces. The framework variable <now> is the current instant in UTC, so an offset from it does not depend on the machine's local zone.

  - category: Data
    headline: 'Compute the <first: captures> from the <line> by /(?<key>\w+)=(?<value>\S+)/.'
    explanation: captures binds the first match as a record of its groups — named ones under their names, numbered ones under "1", "2", and the whole match under match. It is the difference between the parts around a delimiter, which Split gives, and the parts of the match itself.

  - category: Contract
    headline: 'Start the <http-server> with <contract>.'
    explanation: The contract is the routing table, so this statement names no routes and no port. The port comes from the servers URL in openapi.yaml when the statement supplies none, and 8080 when the contract supplies none either. Application-Start must still reach a Keepalive, or the process exits.

  - category: Date
    headline: 'Extract the <year> from the <now: year>.'
    explanation: The parts of a date are read the way any field is read. year, month, day, hour and the rest come off an instant without formatting it first, so a comparison or a filename segment does not go through a string.

  - category: Data
    headline: 'Compute the <settings: all-captures> from the <line> by /(?<key>\w+)=(?<value>\S+)/.'
    explanation: all-captures binds every match as a list of those records, which a for each loop then walks. A group that took part in no match is absent from its record rather than present and empty, so a guard on it means what it says.

  - category: HTTP
    headline: 'Return a <Created: status> with <name>.'
    explanation: The status name carries the code and the value after with becomes the body, encoded as the contract says. A body that is still a stream is written out chunk by chunk with chunked transfer encoding and no Content-Length, so echoing a large upload back does not hold it.

  - category: Data
    headline: 'Compute the <absent: captures> from the <line> by /(?<scheme>https?):/.'
    explanation: A pattern that matches nothing binds an empty record — an empty list for all-captures — rather than failing the statement. It is the same call ARO makes for a Retrieve that matches nothing, so the program guards on the result instead of handling an error.

  - category: Date
    headline: 'Compute the <meeting: date> from "2025-06-15T14:00:00Z".'
    explanation: The date qualifier parses an ISO 8601 string into an instant. Once it is one, the comparison operators work on it directly, so "is this in the past" is a when guard against <now> rather than string arithmetic.

  - category: HTTP
    headline: 'Request the <response> from the <api-url>.'
    explanation: The preposition picks the method — from is a GET, to is a POST — so the common calls need no configuration at all. A method key inside the config object overrides the preposition when the verb and the intent differ.

  - category: Data
    headline: 'Split the <fields> from the <csv-line> by /,/.'
    explanation: The delimiter is a regular expression between slashes and it follows by, never with — writing with is a check-time error that says so. Adjacent and trailing delimiters produce empty elements, and a pattern that matches nothing returns the whole string as one element.

  - category: Date
    headline: 'Extract the <berlin: timezone> from <instant> with "Europe/Berlin".'
    explanation: Timezone conversion is an Extract, not a Compute qualifier, because it reads one rendering of an instant out of another. The instant never moves — the same moment rendered in three zones still carries one timestamp, which is what keeps comparisons honest.

  - category: Repositories
    headline: 'Store the <first-order> into the <order-repository> with { id: "1", status: "open" }.'
    explanation: Store takes into or to and nothing else, so the English-sounding "in the repository" does not parse. The object after with is the row, and a list stores one row per element rather than one row holding a list.

  - category: HTTP
    headline: 'Request the <created> to the <endpoint> with { body: <payload>, timeout: 10 }.'
    explanation: Headers, body, method and timeout travel in one object, and the timeout is seconds for this request rather than a setting somewhere else. Left out, a request gives up after thirty seconds. The answer is a record, so nothing is thrown when the status is not a success.

  - category: Repositories
    headline: 'Retrieve the <widget> from the <products-repository> where <id> is "p1".'
    explanation: What comes back depends on how many rows matched — none binds an empty list, exactly one binds that record, several bind a list. A Retrieve that matches nothing does not fail, so a handler that assumes a record needs a guard rather than an error handler.

  - category: HTTP
    headline: 'Extract the <code> from the <response: status>.'
    explanation: A response is a record of body, status and headers, so the status line is read the same way the payload is. Checking what came back is a field access rather than a separate call, and a guard on it is an ordinary when clause.

  - category: Date
    headline: 'Extract the <tokyo: "Asia/Tokyo"> from <summer>.'
    explanation: The zone may be the qualifier itself when it is a literal, which keeps a one-off rendering to a single statement. Converting out and back is the identity, because nothing about the instant changed on the way.

  - category: Repositories
    headline: 'Retrieve the <hardware> from the <products-repository> where <category> is "hardware".'
    explanation: A repository where clause is an equality lookup against the stored rows. Anything richer — a comparison, contains, a range — is a Filter over what the Retrieve returned, which keeps the storage question and the predicate question apart.

  - category: Contract
    headline: 'Extract the <limit> from the <queryParameters: limit>.'
    explanation: Query parameter values are always strings, including a default the schema supplies — a missing limit with a default of 10 arrives as "10", never as the number. Compute the type you want before doing arithmetic with it.

  - category: Repositories
    headline: 'Delete the <purged> from the <order-repository> where <status> is "cancelled".'
    explanation: A delete is something to report on, so the statement binds count, deleted, target and success. deleted is always a list, including for a single match, and a delete that matched nothing is distinguishable by its count rather than by an absence.

  - category: Date
    headline: 'Log "dst ${<berlin: dst>}" to the <console>.'
    explanation: A named zone carries its own history, so the same zone is +01:00 in January and +02:00 in July and a rendering says whether daylight saving was in force. A fixed offset stored in a config file gets one of those two halves of the year wrong, quietly.

  - category: Repositories
    headline: 'Delete the <cleared> from the <order-repository>.'
    explanation: With no where clause the repository is emptied, and count is what it held. One Delete carries exactly one predicate — chaining conditions is refused at check time, with the hint that one statement per predicate is the spelling.

  - category: Contract
    headline: 'Extract the <api-key> from the <headerParameters: x-api-key>.'
    explanation: Only headers the contract declares as in header appear here. An undeclared header is absent rather than empty, and there is no spelling that reaches the raw header map, so a header a handler depends on is a header the contract names. Cookies arrive the same way under cookieParameters.

  - category: Date
    headline: 'Create the <vacation: date-range> from <start-date> to <end-date>.'
    explanation: A range is a value, so its span is read off it — days, hours — rather than recomputed from the endpoints at each use. Membership is the in operator and includes both endpoints, and the last seven days is the same value built from an offset and <now>.

  - category: Repositories
    headline: '(Audit Changes: user-repository Observer)'
    explanation: A feature set whose business activity is a repository name followed by Observer runs on every change to it, and the name includes the -repository suffix. Several observers on one repository all run, so auditing and projection do not have to share a feature set.

  - category: HTTP
    headline: 'ARO_HTTP_PORT=9090 aro run ./UserService'
    explanation: The environment wins over every other source of the port, including the contract and the Start statement, so one application runs twice on one machine without editing anything it ships. ARO_MAX_BODY overrides the default body limit the same way.

  - category: Repositories
    headline: 'Extract the <change> from the <event: changeType>.'
    explanation: A repository event carries repositoryName, changeType of created, updated or deleted, entityId, newValue, oldValue and timestamp — so an observer can tell an edit from an insert and see both sides of it. Storing a list raises one event per element, not one for the list.

  - category: Date
    headline: 'Create the <standup: recurrence> with "every monday".'
    explanation: A recurrence is written the way somebody would say it — every day, every 2 weeks, every monday, every last friday — and the next occurrence is extracted from it. The pattern is a value the program can hold, not a cron string handed to a scheduler.

  - category: Sockets
    headline: 'Start the <socket-server> with { port: 9000 }.'
    explanation: A TCP server is one statement and a Keepalive, and the connections it accepts arrive at feature sets whose business activity is Socket Event Handler. Nothing registers a callback, so the handlers can live in a different file from the statement that opened the port.

  - category: Data
    headline: 'Retrieve the <latest> from the <user-repository: last>.'
    explanation: The element-access qualifiers work on the repository itself, so the newest row does not need a Retrieve of everything followed by an access. first and last read as they say, and numeric indices count from the end.

  - category: Files
    headline: 'Write the <users> to "./output/users.csv".'
    explanation: The extension picks the format. A list of records becomes CSV with a header row, and the same value written to .json, .jsonl, .yaml, .tsv, .md, .xml, .toml, .sql or .html comes out in that shape instead. Nothing in the statement names a serialiser.

  - category: Sockets
    headline: 'Connect the <conn> to the <host> with { port: 9001 }.'
    explanation: The client side binds a connection it can then Send to, and replies come back as socket events rather than as the result of the Send. A client therefore needs a Keepalive too, or the program exits before the answer arrives.

  - category: Data
    headline: 'Extract the <newest: 0> from the <entries>.'
    explanation: A numeric index counts from the end — 0 is the last element, 1 the one before it. An index past the end fails the statement and names the index and the length, rather than quietly handing back the whole list.

  - category: Data
    headline: 'Extract the <recent: 0-2> from the <entries>.'
    explanation: A range is inclusive and counts from the end, and the elements come back in that same order — newest first. Picks work the same way, so 0,2,4 returns three elements in the order the indices were written. Reverse puts a result back into source order.

  - category: Sockets
    headline: 'Extract the <received-data> from the <packet: buffer>.'
    explanation: A data event carries the payload twice over — buffer and data give the raw bytes, message and text give them decoded as UTF-8. Which one to read is the question of whether the protocol is binary, and reading the wrong one is how a protocol bug becomes a text bug.

  - category: Files
    headline: 'Read the <users> from "./output/users.csv".'
    explanation: Reading is the mirror image — a CSV, JSON, YAML or .env file arrives as records, so the pipeline that follows does not care which it was. A path may be written as a plain string here, without the angle-bracket file form.

  - category: Data
    headline: 'Merge the <all-fruits: fruits> with <more-fruits>.'
    explanation: Merge names its left-hand source in the result's qualifier, which is what lets the result take a fresh name under immutability. Lists concatenate, strings concatenate, and objects merge with the right-hand side winning a conflict — the opposite of union, where the left wins.

  - category: Sockets
    headline: 'Extract the <client-id> from the <connection: id>.'
    explanation: A connect handler is given connection, with id and remoteAddress on it; a data handler is given packet; a disconnect handler is given event, with connectionId and reason. The three system objects differ because the three moments know different things.

  - category: Files
    headline: 'Read the <boot-text: raw> from "./logs/boot.txt".'
    explanation: The raw qualifier opts out of format detection and hands back the file's characters whatever the name says. Resolution runs raw first, then an explicit format qualifier, then the extension, so the statement always says plainly which of the three decided.

  - category: Data
    headline: 'Sort the <ranked> from the <users> by "score".'
    explanation: Sorting is an action, not a qualifier, and the direction rides on the result — a descending qualifier on the result name reverses it. Ascending is the default. A repository query has no order by clause, so sorting is this statement over what a Retrieve returned.

  - category: Sockets
    headline: '(Handle Data Received: Socket Event Handler)'
    explanation: Which of the three socket events a handler subscribes to is read out of its name — disconnect wins over connect, and data, message or received all mean the data event. A name carrying none of those words subscribes to all three rather than silently to nothing.

  - category: Data
    headline: 'Filter the <mid-range> from the <products> where <price> between 10 and 100.'
    explanation: A where clause takes is, is not, the comparison operators, in and not in, between and and, contains, starts with, ends with, and combinations with and and or. Over a list of plain values the field name is decorative — the element is matched as itself.

  - category: Files
    headline: 'Read the <payload: json> from "./data/payload.txt".'
    explanation: An explicit format qualifier overrides what the extension suggests, which is how a file that carries JSON under some other name is still read as JSON. The same qualifier works on Write, for a file that must keep a name its format does not match.

  - category: Data
    headline: 'chmod o+w config.store'
    explanation: A .store file's other-write bit decides whether the repository it seeds is written back to disk. It is the least commonly set bit, it shows up in ls -l, and it needs no new syntax or config file. Read-only means "not written back" rather than "refuses writes" — the repository still changes in memory.

  - category: Sockets
    headline: 'Send the <received-data> to the <client>.'
    explanation: Sending to a connection that has gone away raises rather than reporting a success nobody can check. Broadcast to the socket server is the other half — one statement to every connected client, which is what makes a push from an HTTP route two lines.

  - category: Repositories
    headline: 'Retrieve the <products> from the <products-repository>.'
    explanation: A file named products.store beside the source seeds products-repository with its YAML contents, before Application-Start runs. The repository's name is the file's stem plus -repository, spelled exactly as the file is, and seed data therefore lives in data rather than in a run of Store statements.

  - category: Files
    headline: 'Start the <file-monitor> with ".".'
    explanation: One statement starts watching a directory, and the events arrive at feature sets whose business activity is File Event Handler. Which event a handler takes is read from its name — created, modified or deleted — and a name carrying none of the three receives all of them.

  - category: HTTP
    headline: '(Handle WebSocket Message: WebSocket Event Handler)'
    explanation: WebSocket handlers are named on the same rule as socket handlers, and a connect handler reads connectionId, path and remoteAddress from the event while a message handler reads connectionId and message. The activity is checked for WebSocket first, since it contains the words Socket Event Handler.

  - category: Repositories
    headline: 'Commit the <saved> to the <orders-repository>.'
    explanation: Writable stores are written a second after a change by default, which is a second in which a kill loses it. Commit writes now and waits, and binds which repositories were written and how many rows went. A Commit to a repository no writable store backs is an error rather than a quiet success.

  - category: Files
    headline: 'Extract the <path> from the <event: path>.'
    explanation: A file event carries exactly two fields, path and kind, and the handler reads them the way any event field is read. The application needs a Keepalive as well, because Application-Start returning is otherwise the end of the program.

  - category: HTTP
    headline: 'Start the <http-server> with { port: 8080, websocket: "/ws" }.'
    explanation: The upgrade handler is installed only when the server's own configuration names a WebSocket path. Without that key the port serves ordinary HTTP, and an upgrade request is answered as the unimplemented route it looks like.

  - category: Repositories
    headline: 'Configure the <stores: write-back> with "manual".'
    explanation: In manual mode a mutation only marks the store dirty and Commit does the writing, which suits a run that rewrites the same rows repeatedly. Shutdown still flushes in both modes, because losing a run's work to a clean exit would be the worse default.

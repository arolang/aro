# ARO cards — language fundamentals and syntax
#
# Every ARO headline in this file was checked with `aro check` via
# cards/validate-facts.py against the current tree.

facts:
  # ===== Statement shape =====
  - category: Syntax
    headline: 'Retrieve the <user> from the <user-repository>.'
    explanation: >-
      Every statement has the same three slots — the action verb, the result it binds, the object it reads. The preposition between them is grammar rather than decoration. Each action declares which prepositions it accepts, and one it does not is a check-time error.

  - category: Syntax
    headline: 'Log <message> to <console>.'
    explanation: >-
      Articles are optional everywhere. The lexer recognises a, an and the, then discards them, so they change how a line reads aloud and nothing else. Write one where the sentence wants it and leave it out where it gets in the way.

  - category: Syntax
    headline: 'Compute the <total> from <price> * <quantity>.'
    explanation: >-
      The period ends a statement, not the newline. Whitespace only separates tokens, so a long statement can wrap across several lines and two short ones can share one. What every statement does need is its terminating period.

  - category: Syntax
    headline: '(* A block comment runs until the closing star-paren, over as many lines as it needs. *)'
    explanation: >-
      ARO has two comment forms. The block form spans lines; a double slash runs to the end of one. Specifications and examples reach for the block form, because a note above a feature set rarely fits on a single line.

  - category: Syntax
    headline: 'Extract the <id> from the <pathParameters: id>.'
    explanation: >-
      The text after the colon is a qualifier. On a record it selects a field, so this binds one path parameter instead of the whole dictionary. The contract names the parameter and the statement reads it, with no routing table in between.

  - category: Syntax
    headline: 'Compute the <first-length: length> from the <first-message>.'
    explanation: >-
      Qualifier-as-name splits two jobs that used to share one word. The base is the variable the statement binds; the qualifier picks the operation. Without it, computing two lengths in one feature set would try to bind length twice, and bindings are immutable.

  - category: Syntax
    headline: 'Compute the <slug: lowercase|trim> from the <title>.'
    explanation: >-
      Qualifiers chain with a vertical bar, applied left to right. The namespace is closed — a qualifier must resolve to a built-in, a plugin qualifier under its handle, a chain of those, or a date offset. An invented name is an error naming the closest match.

  - category: Expressions
    headline: 'Compute the <line-total> from <item: qty> * <item: price>.'
    explanation: >-
      A qualified reference is a valid expression operand wherever a bare one is. Its meaning is identical to extracting the field into a temporary first, so two Extract statements collapse into the arithmetic that wanted them.

  - category: Syntax
    headline: '(getUser: User API) {'
    explanation: >-
      A feature set header is a name and a business activity. The name matches an operationId in openapi.yaml, which is how a route finds its handler. The activity is the scope that published variables travel in. No decorator, no registration call.

  - category: Syntax
    headline: '(Break Room Booking: Env Require)'
    explanation: >-
      Between the parentheses an author names their own domain, so the language reserves nothing there. Break, Require and Each all begin statements elsewhere and stay ordinary words in a header, because no statement can start inside one.

  - category: Syntax
    headline: 'Log "Starting the importer." to the <console>.'
    explanation: >-
      Sink syntax puts an expression where a result binding would go, for a value consumed once and never named. The missing article is the giveaway — Log the <message> names a binding, Log "…" sinks a literal. Strings, numbers, variables and literals all work.

  - category: Syntax
    headline: 'Compare the <same-size> from the <left-count> against the <right-count>.'
    explanation: >-
      Compare reads both operands and binds a fresh third name. <same-size: matches> is the boolean; <same-size: result> spells the outcome out. Both operands stay bound afterwards, which is the only shape immutability allows.

  # ===== Philosophy =====
  - category: Philosophy
    headline: 'Store the <invoice> into the <invoice-repository>.'
    explanation: >-
      Only the happy case is written. When a statement fails, the runtime reconstructs it with the values it held and reports that, so the failing line becomes the error message. There is no catch block and no error variable to thread through the feature set.

  - category: Philosophy
    headline: 'Retrieve the <users> from the <user-repository> where <status> is "active".'
    explanation: >-
      A Retrieve that matches nothing is not a failure. It binds an empty list, and a where clause matching exactly one row binds that record rather than a one-element list. Guard on the result — the statement will not fail on your behalf.

  - category: Philosophy
    headline: 'Return a <TooManyRequests: status> for the <request>.'
    explanation: >-
      Status names come from one catalog that the interpreter, the compiled binary and aro check all read, so this is 429 in every mode. Case and separators do not distinguish names, and a misspelling close to a real one is reported at check time.

  # ===== Types =====
  - category: Types
    headline: 'Create the <price> with 19.99.'
    explanation: >-
      Four primitives cover the language — Integer, Float, String, Boolean — and the type is inferred from the literal, so 19.99 is a Float and 19 an Integer. Anything more structured is declared in openapi.yaml rather than in ARO.

  - category: Types
    headline: 'Create the <user: User> with <data>.'
    explanation: >-
      User here is a schema from openapi.yaml, not a name ARO defines. The contract is the type source whether or not the application serves HTTP: a spec with no paths still publishes its component schemas to every feature set.

  - category: Types
    headline: 'Compute the <count> as Integer from <total> / 2.'
    explanation: >-
      The as clause annotates a result's type. It exists because the colon slot is taken — <count: length> selects an operation, so a type needs somewhere else to live. Annotations are optional; reach for one when inference gives an Integer and you wanted a Float.

  - category: Types
    headline: 'Create the <nothing> with null.'
    explanation: >-
      ARO has no optional types. There is nothing to unwrap and no way to declare a field as maybe-absent. A null value still exists — null, nil and none lex to the same literal — and is null compares against it. The guarantee is no declared optionality.

  # ===== Literals =====
  - category: Literals
    headline: 'Create the <budget> with 1_000_000_000.'
    explanation: >-
      Underscores group digits in decimal, hexadecimal and binary literals and are purely visual. Each must sit between two digits: no leading or trailing underscore, none doubled, and none touching the decimal point or the exponent marker.

  - category: Literals
    headline: 'Create the <avogadro> with 6.022_140_76e23.'
    explanation: >-
      Separators work in the fraction and the exponent too, so a constant can be grouped the way it is printed. Grouping is free-form rather than thousands-only, because the lexer strips the underscores before the number is parsed at all.

  - category: Literals
    headline: 'Create the <config> with { port: 8080, host: "localhost" }.'
    explanation: >-
      Object literals take identifier or quoted-string keys and array literals use square brackets. Both infer their type from the contents, so this is a Map and [1, 2, 3] is a List of Integer. Neither needs a schema to exist.

  - category: Literals
    headline: 'Create the <greeting> with "Hello, ${<name>}.".'
    explanation: >-
      Interpolation embeds an expression in a string, and it is the full expression grammar, so arithmetic works inside the braces. A double-quoted string may also span source lines — a newline between the quotes is content, kept exactly as written.

  - category: Literals
    headline: 'Create the <greeting> with "Hello, " ++ <name> ++ ".".'
    explanation: >-
      Two plus signs concatenate strings, and sit with plus and minus in the precedence table. Single plus stays arithmetic, so no operator means addition for numbers and joining for text. The spelling you wrote says which one you meant.

  # ===== Expressions =====
  - category: Expressions
    headline: 'Return an <OK: status> for the <order> when <order-total> >= 50 or <prime-member>.'
    explanation: >-
      Grouping depends only on the operators, never on the shape of the operands. This reads as (order-total >= 50) or prime-member, because comparison binds tighter than or. Parentheses here would be for the reader; they produce the same tree.

  - category: Expressions
    headline: 'Return an <OK: status> for the <check> when not <balance> >= 0.'
    explanation: >-
      not sits below the comparisons, so this negates the comparison rather than the operand. Unary minus is the tight one, which makes -<a> * <b> read as (-<a>) * <b>. The ten-level precedence table is the whole story.

  - category: Expressions
    headline: 'Create the <region> with <params: region> default <config: region> default "eu".'
    explanation: >-
      default yields its left operand when that operand is present and the right one otherwise, chaining left to right so the first present value wins. Present means the value exists: false, 0, "" and [] are values somebody wrote, and they beat the default.

  - category: Expressions
    headline: 'Extract the <port> from the <env: PORT> default "8080".'
    explanation: >-
      Only an unset variable takes the default. An empty PORT is a value and wins, the same rule the operator follows for 0 and the empty string. Without the clause an unset environment variable still binds an empty string rather than failing.

  - category: Expressions
    headline: 'Create the <flag> with <enabled> or false.'
    explanation: >-
      and and or evaluate truthiness and yield a boolean, so or is not a fallback: a port reference or 8080 is true, not the port. A non-boolean literal under either is a check-time error whose message names default and shows the rewrite.

  # ===== Condition operators =====
  - category: Operators
    headline: 'Return an <OK: status> for the <request> when <path> starts with "/api".'
    explanation: >-
      starts with and ends with are literal, which is the point of having them — matches "^a.c" accepts axc as readily as a.c. Neither word is reserved: only a following with, in operator position, makes one an operator, so <starts> stays usable as a name.

  - category: Operators
    headline: 'Log "Admin access" to the <console> when <roles> contains "admin".'
    explanation: >-
      contains picks its comparison from the runtime type of the left operand. A list tests element membership, a string tests substring, a map tests key membership, and every other type answers false. Two strings therefore compare as substrings.

  - category: Operators
    headline: 'Log "Priority" to the <console> when <tier> in ["gold", "platinum"].'
    explanation: >-
      in is the inverse of contains and dispatches on the right operand instead of the left. A list tests elements, a string tests substring, a map tests keys, and a date range tests the interval inclusive of both ends. not in is its negation.

  - category: Operators
    headline: 'Return an <OK: status> for the <check> when <name> matches "^a.c".'
    explanation: >-
      matches is a regular expression test, and the pattern lives in a string, so a backslash needs doubling. When a literal prefix or suffix is what you actually want, starts with and ends with say so without any escaping at all.

  - category: Operators
    headline: 'Log "Upcoming" to the <console> when <event-date> after <now>.'
    explanation: >-
      before and after compare two instants — dates, or the ISO-8601 strings dates arrive as over HTTP and in JSON — at the same precedence as the arithmetic comparisons. Comparing something that is neither a date nor a number raises rather than answering false.

  - category: Operators
    headline: 'Return an <OK: status> for the <request> when <required-roles> subset of <user-roles>.'
    explanation: >-
      subset of asks a question rather than producing a collection, so it is a condition operator and not a Compute qualifier. Set semantics apply: a duplicate on the left does not make a new member, and the empty set is a subset of everything.

  - category: Operators
    headline: 'Filter the <overdue> from the <invoices> where <due> before <now>.'
    explanation: >-
      A where clause takes the condition operators a when guard takes: in, not in, starts with, ends with, contains, matches, before and after all read the same in both places. A predicate that filters a collection therefore also guards a statement.

  - category: Operators
    headline: 'Return an <OK: status> for the <check> when <user: email> exists.'
    explanation: >-
      exists tests presence, and is null, is empty and is not empty are its companions. They are checks rather than comparisons — nothing is being compared against a sentinel. A field that is missing and one explicitly set to null are both absent.

  # ===== Scoping =====
  - category: Scoping
    headline: 'Create the <score> with 97. Publish as <headline-score> <score>.'
    explanation: >-
      Publish as exports a binding under an alias so other feature sets can read it. It is a statement form of its own, with no preposition and no object clause. Inside the publishing feature set both names keep working, because the alias is an alias.

  - category: Scoping
    headline: 'Create the <score> with 97. Publish as <top-score> <score> when <score> > 50.'
    explanation: >-
      A publish takes the same when guard an action statement takes. A false condition leaves the name unpublished rather than published with a placeholder, so a reader fails the way an absent binding always fails. Otherwise the test moves to every reader.

  - category: Scoping
    headline: 'Require the <API_TOKEN> from the <environment>.'
    explanation: >-
      Require names an external dependency, and the source decides who supplies it. environment binds the process environment variable of that name; reading it when it is unset fails the statement in the ordinary way.

  - category: Scoping
    headline: 'Require the <settings> from the <ConfigLoader>.'
    explanation: >-
      A source that is neither framework nor environment names a feature set, and aro check warns when nothing publishes that symbol. The source is a single identifier, so a multi-word feature set cannot be named here. framework documents a runtime dependency and does nothing.

  - category: Scoping
    headline: 'Retrieve the <profile> for the <authenticated-user>.'
    explanation: >-
      A published variable crosses feature sets only inside the same business activity. Two feature sets both marked User Management see each other's published names; one marked Commerce does not. The activity in the header is the scope boundary.

  - category: Scoping
    headline: 'Create the <_internal> with "first".'
    explanation: >-
      A name starting with an underscore is framework-internal and exempt from the immutability check, which is how the runtime keeps its per-statement bookkeeping out of your way. User code should not use them, so every name you write is one you can bind only once.

  # ===== Immutability =====
  - category: Immutability
    headline: 'Compute the <value-doubled> from <value-incremented> * 2.'
    explanation: >-
      Bindings are immutable. The analyzer reports a rebind as an error citing the line of the first binding, so a transformation takes a new name instead. The chain of names then records the pipeline the value went through.

  - category: Immutability
    headline: 'Compute the <second-length: length> from the <second-message>.'
    explanation: >-
      Immutability is why qualifier-as-name exists. Two statements both writing <length> are a rebind, not an overwrite, so the operation moved into the qualifier and the base became whatever you want to call the result.

  - category: Immutability
    headline: 'Compute the <item-total> from <item: price> * <item: quantity>.'
    explanation: >-
      A loop variable is immutable per iteration rather than across the loop, because each pass builds fresh bindings in a child context. So a statement inside a for-each may bind the same name on every pass, and still cannot rebind it within one.
